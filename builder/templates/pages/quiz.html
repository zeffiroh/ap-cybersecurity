<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>${page_title}</title>
<link rel="stylesheet" href="${assets}/quizzes/quiz-theme.css">
</head>
<body>
${toolbar}
<div class="quiz-header">
  <h1 class="quiz-title" id="quiz-title">Loading…</h1>
  <p class="quiz-subtitle" id="quiz-subtitle"></p>
  <div class="quiz-progress-bar"><div class="quiz-progress-fill" id="quiz-progress-fill"></div></div>
  <div class="quiz-meta-row">
    <span>Question <strong id="quiz-position">–</strong></span>
    <span>Total: <strong id="quiz-total">–</strong></span>
    <span id="quiz-score-live"></span>
  </div>
</div>

<div class="quiz-body" id="quiz-body"></div>
<div class="results-panel" id="results-panel"></div>

<script>
window.QUIZ_CONFIG = {
  mode: "${mode}",
  dataUrl: "${data_url}",
  title: "${title}",
  subtitle: "${subtitle}",
  topicFilter: null
};
</script>
<script src="${assets}/config.js"></script>
<script src="${assets}/shared/neon.js"></script>
<script src="${assets}/shared/identity.js"></script>
<script src="${assets}/shared/backend-client.js"></script>
<script src="${assets}/quizzes/quiz-engine.js"></script>
<script src="${assets}/quizzes/report-generator.js"></script>
</body>
</html>
