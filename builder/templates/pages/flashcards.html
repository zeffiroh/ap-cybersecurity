<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>${page_title}</title>
<link rel="stylesheet" href="${assets}/flashcards/flashcard-theme.css">
</head>
<body>
<nav class="top-nav">
  <div class="actions">
    <button class="export-btn" onclick="FlashcardPlayer.exportAnki()">&#8681; Export to Anki (.apkg)</button>
  </div>
</nav>

<div class="deck-header">
  <h1 class="deck-title" id="deck-title">Loading…</h1>
  <p class="deck-subtitle" id="deck-subtitle"></p>
</div>

<div class="deck-progress">
  <span>Card <strong id="deck-position">–</strong></span>
  <span>Total: <strong id="deck-total">–</strong></span>
</div>

<div class="card-stage">
  <div class="flashcard" id="card-stage-inner" onclick="FlashcardPlayer.flip()"></div>
</div>

<div class="deck-controls">
  <button class="ctrl-btn" id="prev-btn" onclick="FlashcardPlayer.prev()">&larr; Previous</button>
  <button class="ctrl-btn" onclick="FlashcardPlayer.flip()">Flip</button>
  <button class="ctrl-btn" onclick="FlashcardPlayer.reshuffle()">&#8635; Shuffle</button>
  <button class="ctrl-btn primary" id="next-btn" onclick="FlashcardPlayer.next()">Next &rarr;</button>
</div>

<script>
window.FLASHCARD_CONFIG = {
  dataUrl: "${data_url}",
  apkgUrl: "${apkg_url}",
  title: "${title}",
  subtitle: "${subtitle}"
};
</script>
<script src="${assets}/flashcards/flashcard-player.js"></script>
</body>
</html>
