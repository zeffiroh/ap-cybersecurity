<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>${page_title}</title>
<link rel="stylesheet" href="${assets}/assignments/assignment-theme.css">
</head>
<body>
<div class="hub-header">
  <h1 class="hub-title">Topic ${tid} Assignments</h1>
  <p class="hub-subtitle">${topic_title} &middot; ${n_items} practice questions &middot; ${n_coding} coding assignments</p>
</div>

<h2 class="section-heading">Practice Questions</h2>
<div class="pq-list" id="pq-list"></div>

<h2 class="section-heading">Coding Assignments</h2>
<div class="problem-grid">
${cards}</div>


<script src="${assets}/config.js"></script>
<script src="${assets}/shared/neon.js"></script>
<script src="${assets}/shared/identity.js"></script>
<script src="${assets}/shared/backend-client.js"></script>
<script src="${assets}/assignments/assignment-engine.js"></script>
<script>
fetch("${data_url}").then(function(r){ return r.json(); }).then(function(d){
  AssignmentEngine.renderPracticeItems(d.practice_items, document.getElementById("pq-list"), "${tid}");
});
</script>
</body>
</html>
