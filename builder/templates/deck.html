<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>__TITLE__</title>
<link rel="stylesheet" href="site.css">
</head>
<body>

<div id="stage">

  <!-- TOP CHROME -->
  <div class="chrome-top">
    <div class="chrome-left">
      <span class="brand-dot"></span>
      <span class="chrome-kicker">__KICKER__</span>
      <span class="chrome-divider">/</span>
      <span class="chrome-unit">__TITLE__</span>
    </div>
    <div class="chrome-right">
      <button id="btn-notes" onclick="openNotesPopup()" title="Open speaker notes in a synced popup (N)">
        Speaker Notes ↗
      </button>
      <div class="slide-counter" id="slide-counter">01 / __COUNT__</div>
    </div>
  </div>

  <!-- MAIN CONTENT -->
  <div class="chrome-main">
    <div class="panel active" id="panel-slide"></div>

    <!-- ANNOTATION CANVAS  (sits above slide content; pointer-events toggled by JS) -->
    <canvas id="anno-canvas" width="1280" height="664"></canvas>

    <!-- ANNOTATION TOOLBAR -->
    <div id="anno-toolbar">
      <button class="anno-btn active" data-tool="pointer" title="Pointer, navigate freely (Esc)">&#x2738;</button>
      <button class="anno-btn" data-tool="pen"       title="Pen, freehand draw">&#x270F;</button>
      <button class="anno-btn" data-tool="highlight" title="Highlighter, semi-transparent brush">&#x25AE;</button>
      <button class="anno-btn" data-tool="eraser"    title="Eraser">&#x25A1;</button>
      <div class="anno-sep"></div>
      <button class="anno-swatch active" data-color="#FF3300" style="background:#FF3300" title="Red"></button>
      <button class="anno-swatch"        data-color="#FFAA00" style="background:#FFAA00" title="Amber"></button>
      <button class="anno-swatch"        data-color="#22CC55" style="background:#22CC55" title="Green"></button>
      <button class="anno-swatch"        data-color="#1155FF" style="background:#1155FF" title="Blue"></button>
      <button class="anno-swatch"        data-color="#FFFFFF" style="background:#FFFFFF;border-color:rgba(255,255,255.35)" title="White"></button>
      <div class="anno-sep"></div>
      <button class="anno-btn" id="anno-clear" title="Clear annotations on this slide">&#x2715;</button>
    </div>
  </div>

  <!-- BOTTOM CHROME -->
  <div class="chrome-bottom">
    <button class="nav-btn" id="btn-prev" onclick="goPrev()" disabled>&#x2039; Prev</button>
    <div class="progress-wrap">
      <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
      <div class="progress-unit" id="progress-unit"></div>
    </div>
    <button class="nav-btn primary" id="btn-next" onclick="goNext()">Next &#x203A;</button>
  </div>

</div><!-- /#stage -->

<div id="popup-view">
  <div id="popup-header">
    <div id="popup-meta">
      <div id="popup-eyebrow"></div>
      <div id="popup-slide-title"></div>
    </div>
    <div id="popup-badge">Speaker Notes</div>
    <div id="popup-counter">01 / __COUNT__</div>
  </div>
  <div id="popup-content"></div>
  <div id="popup-nav">
    <button id="popup-btn-prev" onclick="goPrev()" disabled>&#x2190; Prev</button>
    <button id="popup-btn-next" onclick="goNext()">Next &#x2192;</button>
  </div>
</div><!-- /#popup-view -->

<script>
const SLIDES    = __SLIDES__;
const DECK_META = __META__;
</script>
<script src="site.js"></script>
</body>
</html>
