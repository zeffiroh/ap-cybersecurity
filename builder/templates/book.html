<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book · Aayat-AP-Prep</title>
<style>
:root{
  --paper-bg:#FAF9F6; --surface:#ffffff; --text-primary:#000000; --text-muted:#555555;
  --text-faint:#6b6b68; --accent-color:#800000; --accent-dark:#5c0000; --accent-tint:#fdeceb;
  --border-color:#dcdcd8; --border-strong:#c9c5be; --codebg:#F5F3EE; --rulegray:#707070;
  --focus-ring:#1a5fb4;
  --font-serif:"Times New Roman", Georgia, serif;
  --font-sans:"Inter","Helvetica Neue",Arial,sans-serif;
  --font-mono:"Courier New",Courier,monospace;
  --sidebar-w: 280px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--paper-bg);color:var(--text-primary);font-family:var(--font-serif);}
img{max-width:100%;height:auto;display:block;}
a{color:var(--accent-color);}
::selection{background:var(--accent-tint);}

/* ---------------- layout shell ---------------- */
.app{display:flex;min-height:100vh;}
.sidebar{
  width:var(--sidebar-w);flex-shrink:0;background:var(--surface);
  border-right:1px solid var(--border-color);position:sticky;top:var(--apnav-h,0px);height:calc(100vh - var(--apnav-h,0px));
  overflow-y:auto;font-family:var(--font-sans);padding:18px 0 40px;
  transition:margin-left .2s ease;
}
.sidebar.collapsed{margin-left:calc(-1 * var(--sidebar-w));}
.sidebar h2.toc-title{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint);
  padding:0 20px;margin:6px 0 12px;}
.sidebar nav ul{list-style:none;margin:0;padding:0;}
.sidebar nav > ul > li.nav-unit{margin-bottom:2px;}
.sidebar nav > ul > li.nav-unit > a{
  display:block;padding:9px 20px;font-weight:700;font-size:13.5px;color:var(--accent-dark);
  text-decoration:none;border-left:3px solid transparent;
}
.sidebar nav > ul > li.nav-unit > a:hover{background:var(--accent-tint);border-left-color:var(--accent-color);}
.sidebar nav ul ul{padding-left:0;}
.sidebar nav ul ul li a{
  display:block;padding:6px 20px 6px 34px;font-size:12.5px;color:var(--text-muted);
  text-decoration:none;border-left:3px solid transparent;
}
.sidebar nav ul ul li a:hover{background:var(--accent-tint);color:var(--accent-dark);border-left-color:var(--accent-color);}
.sidebar-toggle{
  position:fixed;top:14px;left:14px;z-index:200;
  background:var(--accent-color);color:#fff;border:none;border-radius:6px;
  width:36px;height:36px;font-size:16px;cursor:pointer;font-family:var(--font-sans);
  box-shadow:0 1px 4px rgba(0,0,0,.25);
}
.sidebar-toggle:hover{background:var(--accent-dark);}
.sidebar.collapsed ~ .sidebar-toggle{left:14px;}

.main{flex:1;min-width:0;}
.save-bar{
  position:sticky;top:0;z-index:150;background:#fff;border-bottom:1px solid var(--border-color);
  padding:10px 32px 10px 62px;display:flex;align-items:center;justify-content:flex-end;gap:12px;
  font-family:var(--font-sans);
}
.save-status{font-size:12px;color:var(--text-faint);}
#save-btn{
  background:var(--accent-color);color:#fff;border:none;border-radius:6px;
  padding:9px 18px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:var(--font-sans);
  letter-spacing:.01em;
}
#save-btn:hover{background:var(--accent-dark);}

.book{max-width:820px;margin:0 auto;padding:0 32px 120px;}

/* ---------------- title page ---------------- */
.titlepage{text-align:center;padding:14vh 20px 10vh;border-bottom:3px double var(--rulegray);margin-bottom:40px;}
.titlepage .kicker{font-family:var(--font-sans);letter-spacing:.18em;text-transform:uppercase;
  font-size:12px;color:var(--text-faint);margin-bottom:18px;}
.titlepage h1{font-size:44px;margin:0 0 6px;color:var(--accent-color);letter-spacing:-0.01em;}
.titlepage .subtitle1{font-family:var(--font-sans);font-size:20px;font-weight:600;color:var(--text-primary);margin-bottom:22px;}
.titlepage .subtitle2{font-size:17px;font-style:italic;color:var(--text-muted);max-width:520px;margin:0 auto 40px;}
.titlepage .author{font-size:16px;margin-top:60px;}
.titlepage .author .name{font-weight:700;font-size:19px;}
.titlepage .author .org{font-family:var(--font-sans);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-color);margin-top:4px;}
.titlepage .date{font-family:var(--font-sans);font-size:12px;color:var(--text-faint);margin-top:30px;}

.preface{margin:0 0 60px;padding-bottom:40px;border-bottom:1px solid var(--border-color);}
.preface h2{font-family:var(--font-sans);font-size:13px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--accent-color);border-bottom:none;margin-bottom:14px;}
.preface p{font-size:16px;line-height:1.7;}

/* ---------------- unit / topic structure ---------------- */
section.unit{margin-bottom:90px;}
.unit-header{text-align:center;margin:60px 0 36px;}
.unit-header .unit-cover{max-width:340px;margin:0 auto 18px;}
.unit-header h1{font-size:30px;color:var(--accent-color);border-bottom:3px double var(--rulegray);
  padding-bottom:14px;display:inline-block;margin:0 auto;}
.unit-intro{font-size:16px;line-height:1.75;margin-bottom:20px;}
.unit-intro p{margin:0 0 16px;}

section.topic{margin:56px 0;padding-top:8px;}
.topic-header{text-align:center;margin-bottom:20px;}
.topic-header .topic-cover{max-width:180px;margin:0 auto 12px;opacity:.92;}
.topic-header h2{font-size:24px;color:var(--text-primary);margin:0;border-bottom:1px solid var(--border-strong);
  padding-bottom:10px;}

.chapter-quote{border:none;margin:0 0 30px;padding:0 0 0 0;text-align:right;font-family:var(--font-sans);}
.chapter-quote p{font-style:italic;font-size:14px;color:var(--text-muted);margin:0 0 4px;max-width:70%;margin-left:auto;}
.chapter-quote cite{font-style:normal;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--text-faint);}

.topic h3{font-size:20px;color:var(--accent-dark);margin:34px 0 14px;border-bottom:2px solid var(--accent-tint);padding-bottom:6px;}
.topic p{font-size:16px;line-height:1.75;margin:0 0 15px;}
.topic ul, .topic ol{font-size:16px;line-height:1.7;margin:0 0 16px;padding-left:26px;}
.topic li{margin-bottom:6px;}
strong{color:inherit;}
code{font-family:var(--font-mono);background:var(--codebg);padding:1px 5px;border-radius:3px;font-size:.92em;}
.math-block{display:block;font-family:var(--font-mono);background:var(--codebg);padding:10px 14px;margin:10px 0;
  border-left:3px solid var(--accent-color);font-size:14.5px;}

/* callout boxes */
.box{border:1px solid var(--border-color);border-left:5px solid var(--accent-color);
  background:var(--surface);border-radius:4px;padding:16px 20px;margin:22px 0;}
.box p{margin:0 0 8px;}
.box p:last-child{margin-bottom:0;}
.box-label{font-family:var(--font-sans);font-weight:700;font-size:12px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--accent-color);margin-bottom:8px !important;}
.box-definition{border-left-color:var(--accent-color);background:var(--accent-tint);}
.box-definition .box-label{color:var(--accent-dark);}
.box-misconception{border-left-color:#9A9A9A;background:#F5F3EE;}
.box-misconception .box-label{color:#6b6b68;}
.box-example{border-left-color:#5c0000;background:#fff;}
.box-figurenote{border-left-color:var(--border-strong);background:#fcfcfb;}
.box-figurenote .box-label{color:var(--text-faint);}
.box-enrichment{border-left-color:#3a6b52;background:#f3f7f5;}
.box-enrichment .box-label{color:#2d5340;}
.center{text-align:center;}
.flushright{text-align:right;}
.preface .flushright p{font-style:italic;}

/* end-of-chapter sources */
ol.sources{list-style:none;padding-left:0;font-size:14px;line-height:1.6;}
ol.sources li:target{background:var(--accent-tint);}
.src-num{font-family:var(--font-sans);font-weight:700;color:var(--accent-color);}
sup.src-cite a{text-decoration:none;font-family:var(--font-sans);font-size:.75em;}
.topic .ap-topic{font-family:var(--font-sans);font-size:12.5px;line-height:1.5;color:var(--text-muted);margin:0 0 10px;}
.topic .ap-note{font-size:11px;line-height:1.5;}
.topic h4{font-size:17px;color:var(--accent-dark);margin:26px 0 10px;}
figure.diagram img[src*="book-figures/"]{background:#fff;padding:8px;}

/* AP alignment */
.ap-alignment{background:#fff;border:1px dashed var(--border-strong);border-radius:4px;
  padding:16px 20px;margin:20px 0 30px;font-family:var(--font-sans);}
.ap-alignment h4{margin:0 0 10px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-color);}
.ap-alignment ul{list-style:none;padding:0;margin:0;font-size:13.5px;}
.ap-alignment li{margin-bottom:8px;font-family:var(--font-serif);font-size:15px;}
.obj-code{font-family:var(--font-mono);font-weight:700;background:var(--codebg);padding:1px 5px;border-radius:3px;font-size:12.5px;}
.obj-skill{font-family:var(--font-sans);font-style:italic;font-size:12px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.03em;}
.ap-note{font-family:var(--font-sans);font-size:11px;color:var(--text-faint);margin-top:10px !important;}

/* figures / images / tables / code */
figure{margin:26px 0;}
figure.diagram{text-align:center;}
figure.diagram img{margin:0 auto;border:1px solid var(--border-color);border-radius:4px;}
figure.diagram figcaption{font-family:var(--font-sans);font-size:13px;color:var(--text-muted);
  margin-top:10px;font-style:italic;}
figure.table-figure table{width:100%;border-collapse:collapse;font-size:14.5px;}
figure.table-figure th,figure.table-figure td{border:1px solid var(--border-color);padding:8px 10px;text-align:left;vertical-align:top;}
figure.table-figure th{background:var(--accent-tint);font-family:var(--font-sans);font-weight:700;color:var(--accent-dark);}
figure.table-figure figcaption{font-size:13px;color:var(--text-muted);margin-top:8px;font-style:italic;font-family:var(--font-sans);}
figure.code-figure{background:var(--codebg);border-radius:5px;overflow:hidden;border:1px solid var(--border-color);}
.code-lang{font-family:var(--font-sans);font-size:11px;text-transform:uppercase;letter-spacing:.06em;
  background:var(--rulegray);color:#fff;padding:4px 12px;}
pre.code-block{margin:0;padding:14px 18px;overflow-x:auto;font-family:var(--font-mono);font-size:13.5px;
  line-height:1.55;background:transparent;white-space:pre;}
.code-caption{font-family:var(--font-sans);font-size:12px;color:var(--text-muted);padding:6px 18px 12px;font-style:italic;}

/* review questions / answer key */
.review-questions{background:#fff;border:1px solid var(--border-color);border-radius:4px;padding:18px 22px;margin:30px 0 20px;}
.review-questions::before{content:"Review Questions";display:block;font-family:var(--font-sans);font-weight:700;
  font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-color);margin-bottom:12px;}
.answer-key{background:var(--codebg);border:1px solid var(--border-color);border-radius:4px;padding:18px 22px;margin:0 0 40px;}
.answer-key .box-label{margin-bottom:10px !important;}
.answer-key li{display:flex;justify-content:space-between;gap:10px;align-items:baseline;}
.answer-code{font-size:11px;color:var(--text-faint);white-space:nowrap;}

/* editable affordance */
[contenteditable="true"]{outline:none;border-radius:2px;}
[contenteditable="true"]:hover{background:rgba(128,0,0,0.04);}
[contenteditable="true"]:focus{background:rgba(128,0,0,0.07);box-shadow:0 0 0 2px var(--accent-tint);}

.editor-note{font-family:var(--font-sans);font-size:12px;color:var(--text-faint);text-align:center;
  padding:14px 20px;border-top:1px dashed var(--border-color);margin-top:20px;}

@media (max-width: 860px){
  .sidebar{position:fixed;left:0;top:0;z-index:180;box-shadow:2px 0 10px rgba(0,0,0,.15);}
  .sidebar.collapsed{margin-left:calc(-1 * var(--sidebar-w));}
  .save-bar{padding-left:56px;}
}

/* ---------------- accessibility: skip link & focus states ---------------- */
.skip-link{position:absolute;left:-9999px;top:0;background:var(--accent-color);color:#fff;
  padding:10px 16px;z-index:999;font-family:var(--font-sans);font-size:14px;
  border-radius:0 0 6px 0;text-decoration:none;}
.skip-link:focus{left:0;}
a:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible,
[contenteditable="true"]:focus-visible{
  outline:3px solid var(--focus-ring);outline-offset:2px;
}
#main-content{outline:none;}

/* ---------------- search ---------------- */
.search-wrap{position:relative;flex:1;max-width:340px;font-family:var(--font-sans);}
#book-search{width:100%;padding:8px 12px;border:1px solid var(--border-color);border-radius:6px;
  font-size:13.5px;font-family:var(--font-sans);background:#fff;color:var(--text-primary);}
.search-results{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;
  border:1px solid var(--border-color);border-radius:6px;box-shadow:0 4px 14px rgba(0,0,0,.15);
  max-height:380px;overflow-y:auto;z-index:250;text-align:left;}
.search-results button.sr-item{display:block;width:100%;text-align:left;padding:8px 12px;
  font-size:13px;color:var(--text-primary);text-decoration:none;border:none;border-bottom:1px solid var(--border-color);
  background:#fff;cursor:pointer;font-family:var(--font-sans);}
.search-results button.sr-item:last-child{border-bottom:none;}
.search-results button.sr-item:hover,.search-results button.sr-item:focus-visible{background:var(--accent-tint);}
.search-results .sr-heading{font-weight:700;color:var(--accent-dark);display:block;font-size:11px;
  text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px;}
.search-results .sr-snippet{color:var(--text-muted);}
.search-results .sr-empty{padding:10px 12px;font-size:13px;color:var(--text-faint);}
mark.search-hit{background:#fff3b0;color:inherit;padding:0 1px;border-radius:2px;}
.search-jump-target{animation:search-flash 1.6s ease-out;}
@keyframes search-flash{
  0%{box-shadow:0 0 0 4px var(--accent-tint);background:var(--accent-tint);}
  100%{box-shadow:0 0 0 0 rgba(0,0,0,0);background:transparent;}
}

/* ---------------- table of contents controls ---------------- */
.toc-controls{padding:0 20px 10px;display:flex;gap:8px;}
.toc-controls button{flex:1;font-family:var(--font-sans);font-size:11px;font-weight:600;
  text-transform:uppercase;letter-spacing:.03em;background:var(--surface);
  border:1px solid var(--border-color);border-radius:4px;padding:6px 4px;cursor:pointer;color:var(--text-muted);}
.toc-controls button:hover{background:var(--accent-tint);color:var(--accent-dark);}

/* ---------------- collapsible units / topics ---------------- */
.unit-header,.topic-header{position:relative;}
.section-toggle{
  position:absolute;top:0;right:0;font-family:var(--font-sans);font-size:14px;font-weight:700;
  background:var(--surface);color:var(--accent-color);border:1px solid var(--border-strong);
  border-radius:5px;width:30px;height:30px;line-height:1;cursor:pointer;
}
.section-toggle:hover{background:var(--accent-tint);}
section.unit.collapsed > *:not(.unit-header){display:none;}
section.topic.collapsed > *:not(.topic-header){display:none;}
section.unit.collapsed .unit-header,section.topic.collapsed .topic-header{margin-bottom:0;}

/* ---------------- practice questions ---------------- */
.practice-check{background:#fff;border:1px solid var(--border-color);border-left:5px solid #3a6b52;
  border-radius:4px;padding:16px 20px;margin:26px 0;font-family:var(--font-sans);}
.practice-check::before{content:"Check Your Understanding";display:block;font-weight:700;font-size:12px;
  letter-spacing:.06em;text-transform:uppercase;color:#2d5340;margin-bottom:14px;}
.pq-question{margin-bottom:18px;padding-bottom:18px;border-bottom:1px dashed var(--border-color);}
.pq-question:last-child{margin-bottom:0;padding-bottom:0;border-bottom:none;}
.pq-stem{font-family:var(--font-serif);font-size:15.5px;margin:0 0 10px;color:var(--text-primary);line-height:1.5;}
.pq-choices{display:flex;flex-direction:column;gap:6px;}
.pq-choice{text-align:left;font-family:var(--font-sans);font-size:13.5px;background:var(--surface);
  border:1px solid var(--border-color);border-radius:5px;padding:8px 12px;cursor:pointer;color:var(--text-primary);}
.pq-choice .pq-key{font-weight:700;color:var(--accent-dark);}
.pq-choice:hover{background:var(--accent-tint);border-color:var(--accent-color);}
.pq-choice.correct{background:#e6f4ea;border-color:#2d7a3f;color:#1e5c2b;}
.pq-choice.incorrect{background:#fdecea;border-color:#b3261e;color:#8c1d17;}
.pq-feedback{margin-top:10px;padding:10px 12px;border-radius:5px;font-size:13.5px;background:var(--codebg);line-height:1.5;}
.pq-feedback.correct{background:#e6f4ea;color:#1e5c2b;}
.pq-feedback.incorrect{background:#fdecea;color:#8c1d17;}

/* ---------------- downloads section ---------------- */
.downloads-section{margin:70px 0 40px;padding-top:26px;border-top:3px double var(--rulegray);}
.downloads-section > h2{font-size:26px;color:var(--accent-color);text-align:center;margin:0 0 10px;}
.downloads-intro{text-align:center;font-family:var(--font-sans);font-size:13.5px;color:var(--text-muted);
  max-width:560px;margin:0 auto 26px;line-height:1.6;}
.downloads-unit{margin:0 0 34px;}
.downloads-unit h3{font-size:17px;color:var(--accent-dark);border-bottom:1px solid var(--border-strong);
  padding-bottom:6px;margin:0 0 12px;}
.downloads-table-wrap{overflow-x:auto;}
.downloads-table{width:100%;border-collapse:collapse;font-size:13px;font-family:var(--font-sans);}
.downloads-table th,.downloads-table td{border:1px solid var(--border-color);padding:7px 9px;
  text-align:left;vertical-align:middle;white-space:nowrap;}
.downloads-table th{background:var(--accent-tint);color:var(--accent-dark);font-weight:700;}
.downloads-table td:first-child{white-space:normal;font-weight:600;}
.downloads-table td a{margin-right:8px;}
.downloads-textbook{text-align:center;margin:0 0 34px;font-family:var(--font-sans);}
.downloads-textbook a{display:inline-block;background:var(--accent-color);color:#fff;padding:11px 24px;
  border-radius:6px;text-decoration:none;font-weight:700;font-size:14px;}
.downloads-textbook a:hover{background:var(--accent-dark);}
.downloads-textbook a,.downloads-textbook .soon{margin:4px;}
.downloads-textbook .soon{display:inline-block;border:1px dashed var(--border-strong);color:var(--text-faint);padding:10px 22px;
  border-radius:6px;font-weight:700;font-size:14px;cursor:not-allowed;}
.downloads-textbook .store-note{display:block;margin-top:12px;font-size:13px;color:var(--text-muted);}

/* ---------------- inline PPTX preview (assets/classroom-slides/*.pptx) ---------------- */
.embed-toggle{font:inherit;font-family:var(--font-sans);font-size:12px;background:none;cursor:pointer;
  border:1px dashed var(--border-color);border-radius:4px;padding:2px 8px;color:var(--text-muted);white-space:nowrap;}
.embed-toggle:hover{border-color:var(--accent-color);color:var(--accent-color);}
.embed-toggle[aria-expanded="true"]{border-style:solid;border-color:var(--accent-color);color:var(--accent-color);}
.embed-panel{margin:8px 0;border:1px solid var(--border-color);border-radius:6px;overflow:hidden;white-space:normal;}
.embed-panel-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 9px;
  border-bottom:1px solid var(--border-color);background:var(--accent-tint);}
.embed-note{font-family:var(--font-sans);font-size:11px;color:var(--text-muted);}
.embed-close{font:inherit;font-family:var(--font-sans);font-size:11px;background:none;
  border:1px solid var(--border-color);border-radius:10px;padding:2px 9px;cursor:pointer;white-space:nowrap;}
.embed-close:hover{border-color:var(--accent-color);color:var(--accent-color);}
.embed-frame-wrap{width:100%;aspect-ratio:16/9;background:#f4f4f2;}
.embed-frame{display:block;width:100%;height:100%;border:0;}

/* ---------------- print ---------------- */
@media print{
  .sidebar,.sidebar-toggle,.save-bar,.search-wrap,.search-results,.section-toggle,
  .toc-controls,.skip-link,.editor-note{display:none !important;}
  .app{display:block;}
  .main{width:100%;}
  .book{max-width:100%;padding:0 10mm;margin:0;}
  section.unit.collapsed > *,section.topic.collapsed > *{display:block !important;}
  section.unit{page-break-before:always;}
  section.unit:first-of-type{page-break-before:avoid;}
  section.topic{page-break-inside:avoid;}
  figure,table,.box,.review-questions,.answer-key,.practice-check,.pq-question,
  .downloads-unit{page-break-inside:avoid;}
  .pq-feedback{display:none !important;}
  a{color:#000;text-decoration:underline;}
  a[href^="#"]{text-decoration:none;}
  body{background:#fff;}
  .downloads-table{font-size:11px;}
  .embed-toggle,.embed-panel,.embed-panel-row{display:none !important;}
}
</style>

<body>
<a class="skip-link" href="#main-content">Skip to book content</a>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <h2 class="toc-title">Contents</h2>
    <div class="toc-controls"><button type="button" id="expand-all-btn">Expand all</button><button type="button" id="collapse-all-btn">Collapse all</button></div>
    <nav><ul>
__NAV__
    </ul></nav>
  </aside>
  <button class="sidebar-toggle" id="sidebar-toggle" title="Toggle table of contents" aria-label="Toggle table of contents">&#9776;</button>
  <div class="main">
    <div class="save-bar">
      <div class="search-wrap"><label for="book-search" class="sr-only-label" style="position:absolute;left:-9999px;">Search the book</label><input type="search" id="book-search" placeholder="Search this book&hellip;" autocomplete="off" aria-label="Search the book"><div id="search-results" class="search-results" hidden role="listbox" aria-label="Search results"></div></div>
    </div>
    <div class="book" id="main-content" tabindex="-1">
__BOOK__
    </div>
  </div>
</div>

<script>
/*
 * Page script for the book.
 * Runtime behavior: sidebar toggle, collapsible units/topics, client-side
 * search, practice-question checking, and PPTX previews in the downloads table.
 * Nothing is stored: no autosave, no localStorage.
 */

// ---- 1. Sidebar toggle ------------------------------------------------
var sidebar = document.getElementById('sidebar');
var sidebarToggle = document.getElementById('sidebar-toggle');
sidebarToggle.addEventListener('click', function () {
  sidebar.classList.toggle('collapsed');
});

// ---- 4. Accessibility: focus the main content when the skip link is used --
(function () {
  var skipLink = document.querySelector('.skip-link');
  var mainContent = document.getElementById('main-content');
  if (skipLink && mainContent) {
    skipLink.addEventListener('click', function () {
      // tabindex="-1" on #main-content lets us move keyboard focus there
      // even though a <div> isn't normally focusable.
      setTimeout(function () { mainContent.focus(); }, 0);
    });
  }
})();

// ---- 5. Collapsible units and topics -----------------------------------
(function () {
  function makeToggle(section, isUnit) {
    var header = section.querySelector(isUnit ? '.unit-header' : '.topic-header');
    if (!header) return;
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'section-toggle';
    btn.setAttribute('aria-expanded', 'true');
    btn.setAttribute('aria-label', 'Collapse this ' + (isUnit ? 'unit' : 'topic'));
    btn.textContent = '−'; // minus sign
    btn.addEventListener('click', function () {
      var collapsed = section.classList.toggle('collapsed');
      btn.setAttribute('aria-expanded', String(!collapsed));
      btn.textContent = collapsed ? '+' : '−';
      btn.setAttribute('aria-label', (collapsed ? 'Expand' : 'Collapse') + ' this ' + (isUnit ? 'unit' : 'topic'));
    });
    header.appendChild(btn);
  }

  var units = document.querySelectorAll('section.unit');
  for (var u = 0; u < units.length; u++) { makeToggle(units[u], true); }
  var topicsEls = document.querySelectorAll('section.topic');
  for (var t = 0; t < topicsEls.length; t++) { makeToggle(topicsEls[t], false); }

  function setAll(collapsed) {
    var all = document.querySelectorAll('section.unit, section.topic');
    for (var i = 0; i < all.length; i++) {
      all[i].classList.toggle('collapsed', collapsed);
      var toggleBtn = all[i].querySelector(':scope > .unit-header > .section-toggle, :scope > .topic-header > .section-toggle');
      if (toggleBtn) {
        toggleBtn.setAttribute('aria-expanded', String(!collapsed));
        toggleBtn.textContent = collapsed ? '+' : '−';
      }
    }
  }
  var expandAllBtn = document.getElementById('expand-all-btn');
  var collapseAllBtn = document.getElementById('collapse-all-btn');
  if (expandAllBtn) { expandAllBtn.addEventListener('click', function () { setAll(false); }); }
  if (collapseAllBtn) { collapseAllBtn.addEventListener('click', function () { setAll(true); }); }

  // Expose a helper used by search-result navigation below: expand every
  // collapsed ancestor of a given element so a search hit is actually visible.
  window.__revealAncestors = function (el) {
    var node = el;
    while (node && node !== document.body) {
      if (node.classList && node.classList.contains('collapsed') &&
          (node.classList.contains('unit') || node.classList.contains('topic'))) {
        node.classList.remove('collapsed');
        var tb = node.querySelector(':scope > .unit-header > .section-toggle, :scope > .topic-header > .section-toggle');
        if (tb) { tb.setAttribute('aria-expanded', 'true'); tb.textContent = '−'; }
      }
      node = node.parentElement;
    }
  };
})();

// ---- 6. Client-side search ----------------------------------------------
(function () {
  var input = document.getElementById('book-search');
  var resultsBox = document.getElementById('search-results');
  if (!input || !resultsBox) return;

  var index = null; // built lazily: [{el, text, headingText}]

  function nearestHeading(el) {
    var topic = el.closest('section.topic');
    var unit = el.closest('section.unit');
    if (topic) {
      var h2 = topic.querySelector(':scope > .topic-header h2');
      if (h2) return h2.textContent.trim();
    }
    if (unit) {
      var h1 = unit.querySelector(':scope > .unit-header h1');
      if (h1) return h1.textContent.trim();
    }
    return "Cybersecurity";
  }

  function buildIndex() {
    var nodes = document.querySelectorAll(
      '.book h1, .book h2, .book h3, .book h4, .book p, .book li'
    );
    var out = [];
    for (var i = 0; i < nodes.length; i++) {
      var el = nodes[i];
      // Skip UI chrome and not-yet-answered practice-question internals that
      // shouldn't surface as if they were book prose.
      if (el.closest('.search-results') || el.closest('.pq-explain')) continue;
      var text = el.textContent.replace(/\s+/g, ' ').trim();
      if (!text) continue;
      out.push({ el: el, text: text, lower: text.toLowerCase(), heading: nearestHeading(el) });
    }
    return out;
  }

  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function highlight(text, query) {
    var idx = text.toLowerCase().indexOf(query);
    if (idx === -1) return escapeHtml(text.slice(0, 120));
    var start = Math.max(0, idx - 40);
    var end = Math.min(text.length, idx + query.length + 60);
    var pre = (start > 0 ? '…' : '') + escapeHtml(text.slice(start, idx));
    var hit = escapeHtml(text.slice(idx, idx + query.length));
    var post = escapeHtml(text.slice(idx + query.length, end)) + (end < text.length ? '…' : '');
    return pre + '<mark class="search-hit">' + hit + '</mark>' + post;
  }

  function closeResults() {
    resultsBox.hidden = true;
    resultsBox.innerHTML = '';
  }

  function jumpTo(el) {
    window.__revealAncestors(el);
    closeResults();
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    el.classList.add('search-jump-target');
    setTimeout(function () { el.classList.remove('search-jump-target'); }, 1700);
    if (el.hasAttribute('contenteditable')) {
      // don't steal the edit caret automatically; just move visual focus
      el.setAttribute('tabindex', '-1');
      el.focus({ preventScroll: true });
    }
  }

  function runSearch() {
    var q = input.value.trim().toLowerCase();
    if (q.length < 2) { closeResults(); return; }
    if (!index) { index = buildIndex(); }
    var matches = [];
    for (var i = 0; i < index.length && matches.length < 20; i++) {
      if (index[i].lower.indexOf(q) !== -1) { matches.push(index[i]); }
    }
    resultsBox.innerHTML = '';
    if (matches.length === 0) {
      var empty = document.createElement('div');
      empty.className = 'sr-empty';
      empty.textContent = 'No matches in the book text.';
      resultsBox.appendChild(empty);
    } else {
      for (var m = 0; m < matches.length; m++) {
        (function (match) {
          var item = document.createElement('button');
          item.type = 'button';
          item.className = 'sr-item';
          item.setAttribute('role', 'option');
          var headingSpan = '<span class="sr-heading">' + escapeHtml(match.heading) + '</span>';
          var snippetSpan = '<span class="sr-snippet">' + highlight(match.text, q) + '</span>';
          item.innerHTML = headingSpan + snippetSpan;
          item.addEventListener('click', function () { jumpTo(match.el); });
          resultsBox.appendChild(item);
        })(matches[m]);
      }
    }
    resultsBox.hidden = false;
  }

  input.addEventListener('input', runSearch);
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { closeResults(); input.blur(); }
    if (e.key === 'Enter') {
      var first = resultsBox.querySelector('.sr-item');
      if (first) { first.click(); }
    }
  });
  document.addEventListener('click', function (e) {
    if (!resultsBox.contains(e.target) && e.target !== input) { closeResults(); }
  });
})();

// ---- 7. Practice-question ("Check Your Understanding") checking --------
(function () {
  document.addEventListener('click', function (e) {
    var btn = e.target.closest ? e.target.closest('.pq-choice') : null;
    if (!btn) return;
    var qEl = btn.closest('.pq-question');
    if (!qEl) return;
    var correctKey = qEl.getAttribute('data-answer');
    var chosenKey = btn.getAttribute('data-key');
    var allChoices = qEl.querySelectorAll('.pq-choice');
    for (var i = 0; i < allChoices.length; i++) {
      allChoices[i].classList.remove('correct', 'incorrect');
    }
    var isCorrect = chosenKey === correctKey;
    btn.classList.add(isCorrect ? 'correct' : 'incorrect');
    if (!isCorrect) {
      var rightBtn = qEl.querySelector('.pq-choice[data-key="' + correctKey + '"]');
      if (rightBtn) { rightBtn.classList.add('correct'); }
    }
    var explainEl = qEl.querySelector('.pq-explain');
    var explainText = explainEl ? explainEl.textContent : '';
    var fb = qEl.querySelector('.pq-feedback');
    if (fb) {
      fb.textContent = (isCorrect ? 'Correct. ' : 'Not quite. ') + explainText;
      fb.classList.remove('correct', 'incorrect');
      fb.classList.add(isCorrect ? 'correct' : 'incorrect');
      fb.hidden = false;
    }
  });
})();

// ---- 8. Inline PPTX preview for the Downloads table (Office Online viewer) --------
(function () {
  document.addEventListener('DOMContentLoaded', function () {
    var links = document.querySelectorAll('.downloads-table a[href$=".pptx"]');
    for (var i = 0; i < links.length; i++) {
      (function (a) {
        var toggle = document.createElement('button');
        toggle.type = 'button';
        toggle.className = 'embed-toggle';
        toggle.textContent = 'Preview';
        var panel = null;

        function close() {
          if (panel) { panel.parentNode.removeChild(panel); panel = null; }
          toggle.textContent = 'Preview';
          toggle.setAttribute('aria-expanded', 'false');
        }
        function open() {
          var abs = new URL(a.getAttribute('href'), window.location.href).href;
          var wrap = document.createElement('div');
          wrap.className = 'embed-panel';
          var bar = document.createElement('div');
          bar.className = 'embed-panel-bar';
          var note = document.createElement('span');
          note.className = 'embed-note';
          note.textContent = 'Loads from Microsoft Office Online, requires internet access.';
          var closeBtn = document.createElement('button');
          closeBtn.type = 'button';
          closeBtn.className = 'embed-close';
          closeBtn.textContent = 'Close preview ×';
          closeBtn.addEventListener('click', close);
          bar.appendChild(note);
          bar.appendChild(closeBtn);
          var frameWrap = document.createElement('div');
          frameWrap.className = 'embed-frame-wrap';
          var iframe = document.createElement('iframe');
          iframe.className = 'embed-frame';
          iframe.loading = 'lazy';
          iframe.title = 'Slide deck preview';
          iframe.src = 'https://view.officeapps.live.com/op/embed.aspx?src=' + encodeURIComponent(abs);
          frameWrap.appendChild(iframe);
          wrap.appendChild(bar);
          wrap.appendChild(frameWrap);

          var tr = a.closest('tr');
          var table = a.closest('table');
          var colCount = (table && table.querySelector('thead tr')) ? table.querySelectorAll('thead tr th').length : 1;
          panel = document.createElement('tr');
          panel.className = 'embed-panel-row';
          var td = document.createElement('td');
          td.colSpan = colCount;
          td.appendChild(wrap);
          panel.appendChild(td);
          tr.parentNode.insertBefore(panel, tr.nextSibling);

          toggle.textContent = 'Hide preview';
          toggle.setAttribute('aria-expanded', 'true');
        }
        toggle.addEventListener('click', function () { if (panel) close(); else open(); });
        a.parentNode.insertBefore(document.createTextNode(' '), a.nextSibling);
        a.parentNode.insertBefore(toggle, a.nextSibling);
      })(links[i]);
    }
  });
})();

</script>
<script src="../assets/config.js"></script>
<script src="../assets/shared/neon.js"></script>
<script src="../assets/shared/sponsor-metrics.js"></script>
<script src="../assets/shared/support.js"></script>
</body>
</html>
