# BLACKBOX CONTRACT for the mhsec toolkit. Each tool function in tools.py is independently
# swappable; a student implementation that passes source/capstone/tests is accepted.
id: "scenario-mhsec-toolkit"
kind: toolkit-tool
language: python3
module: "toolkit/tools.py"
tools:
  - { entry: "recon",        signature: "recon(network: dict) -> list[dict]" }
  - { entry: "detect_spray", signature: "detect_spray(auth_logs: list[dict], min_users=5, min_fails=20) -> list[dict]" }
  - { entry: "find_phish",   signature: "find_phish(emails: list[dict], legit_domain='meridian-health.org') -> list[dict]" }
  - { entry: "ir_timeline",  signature: "ir_timeline(emails, auth_logs, meta) -> dict" }
tests: "tests/test_scenario.py"     # run from source/capstone/
reference: "toolkit/tools.py"
allow_deps: []
swap:
  impl_env: "MHSEC_TOOLS"           # point at an alternate tools.py implementation
  run: "python -m pytest tests -q"
