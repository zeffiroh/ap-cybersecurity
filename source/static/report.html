<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Report card · Aayat-AP-Prep</title>
<link rel="stylesheet" href="assets/reports/report-theme.css">
</head>
<body>
<nav class="top-nav">
  <button class="print-btn" onclick="window.print()">Print Report Card</button>
</nav>
<div class="report-wrap">
  <h1 class="report-title">My Report Card</h1>
  <p class="report-subtitle" id="student-subtitle">Loading…</p>
  <div id="report-body"></div>
</div>

<script src="assets/config.js"></script>
<script src="assets/shared/neon.js"></script>
<script src="assets/shared/identity.js"></script>
<script src="assets/shared/backend-client.js"></script>
<script src="assets/reports/report-client.js"></script>
<script>
Identity.ensureEmail(function (email) {
  document.getElementById("student-subtitle").textContent = email;
  var body = document.getElementById("report-body");
  var stop = ReportClient.showLoading(body, "Loading your report card…");
  Backend.getStudentReport(email).then(function (report) {
    stop();
    ReportClient.renderStudentReport(body, report);
  });
});
</script>
</body>
</html>
