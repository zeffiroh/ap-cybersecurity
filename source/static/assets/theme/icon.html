<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Icon · Aayat-AP-Prep</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
body{margin:0;background:#fff;color:#111;font:17px/1.5 "Times New Roman",Times,serif}
main{max-width:760px;margin:0 auto;padding:28px 20px 60px}
h1{font-size:30px;margin:0 0 14px}
button{font:inherit;font-size:15px;padding:4px 12px;border:1px solid #000;background:#fff;cursor:pointer}
button:hover{background:#000;color:#fff}
.row{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;margin:18px 0}
.row figure{margin:0;text-align:center;font-size:13px;color:#555}
.row img{display:block;margin:0 auto 4px;image-rendering:auto}
</style>
</head>
<body>
<main>
<h1>Icon</h1>
<button id="export">Export all</button>
<div class="row" id="preview"></div>
</main>
<script>
// One drawing, every size: a padlock with a circuit keyhole, black and white.
// "Export all" downloads icon.svg and the PNGs; put them in assets/theme/.

const INK = "#000", PAPER = "#fff";

function icon() {
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<rect width="512" height="512" rx="112" fill="${INK}"/>
<path d="M166 238V176a90 90 0 0 1 180 0v62" fill="none" stroke="${PAPER}" stroke-width="44"/>
<path d="M106 232H406V392L366 432H146L106 392Z" fill="${PAPER}"/>
<g fill="none" stroke="${INK}" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
  <path d="M220 300H160V270"/><path d="M292 300H352V270"/>
  <path d="M232 372H176V400"/><path d="M280 372H336V400"/>
</g>
<g fill="${INK}">
  <circle cx="160" cy="266" r="14"/><circle cx="352" cy="266" r="14"/>
  <circle cx="176" cy="404" r="14"/><circle cx="336" cy="404" r="14"/>
  <path d="M256 268a34 34 0 0 1 20 61l8 59H228l8-59a34 34 0 0 1 20-61Z"/>
</g>
</svg>`;
}

const FILES = [["icon-16.png", 16], ["icon-32.png", 32], ["apple-touch-icon.png", 180],
               ["icon-192.png", 192], ["icon-512.png", 512], ["lock-art.png", 800]];

function svgUrl() {
  return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(icon());
}

function raster(size) {
  return new Promise(done => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement("canvas");
      c.width = c.height = size;
      c.getContext("2d").drawImage(img, 0, 0, size, size);
      c.toBlob(done, "image/png");
    };
    img.src = svgUrl();
  });
}

function save(name, blob) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

document.getElementById("export").addEventListener("click", async () => {
  save("icon.svg", new Blob([icon()], { type: "image/svg+xml" }));
  for (const [name, size] of FILES) {
    save(name, await raster(size));
    await new Promise(r => setTimeout(r, 250));
  }
});

document.getElementById("preview").innerHTML = [256, 128, 64, 32, 16].map(s =>
  `<figure><img src="${svgUrl()}" width="${s}" height="${s}" alt="">${s}</figure>`).join("");
</script>
</body>
</html>
