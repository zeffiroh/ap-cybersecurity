# /etc/nginx/sites-enabled/nimbumart on web01
server {
    listen 80;
    listen 443 ssl;
    server_name shop.nimbumart.test;
    server_tokens on;
    ssl_certificate     /etc/ssl/nimbumart.crt;
    ssl_certificate_key /etc/ssl/nimbumart.key;
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
    client_max_body_size 200m;
    autoindex on;
    root /var/www/nimbumart;

    location /uploads/ {
        try_files $uri =404;
        fastcgi_pass unix:/run/php/php8.1-fpm.sock;
    }
}
