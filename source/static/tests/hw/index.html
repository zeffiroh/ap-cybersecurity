<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CW/HW quizzes · Aayat-AP-Prep</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{font-family:'Times New Roman',Times,serif;background:#fff;color:#000;font-size:14px}
.hd{background:#111111;color:#fff;display:flex;align-items:center;gap:10px;padding:6px 16px}
.hd img{height:28px;object-fit:contain}.hd h1{font-size:13px;font-weight:bold;flex:1}
.hd a{color:#ffcccc;font-size:12px;text-decoration:none}.hd a:hover{color:#fff}
.container{max-width:900px;margin:0 auto;padding:20px 16px}
.page-title{font-size:18px;font-weight:bold;margin-bottom:4px}
.page-sub{font-size:12px;color:#666;margin-bottom:20px}
.unit-block{margin-bottom:24px}
.unit-hd{background:#111111;color:#fff;padding:4px 12px;font-size:12px;font-weight:bold;letter-spacing:.04em;text-transform:uppercase;margin-bottom:8px}
.topic-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.topic-card{border:1px solid #e0e0e0;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.topic-card:hover{border-color:#111111;background:#fff8f8}
.topic-info .tid{font-size:10px;color:#111111;font-weight:bold;font-family:'Courier New',monospace}
.topic-info .tname{font-size:12.5px;font-weight:bold;margin-top:1px}
.topic-info .tmeta{font-size:10.5px;color:#888;margin-top:2px}
.btn-start{font-family:'Times New Roman',serif;font-size:12px;padding:4px 14px;background:#111111;color:#fff;border:1px solid #600000;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn-start:hover{background:#a00000}
.statusbar{background:#fafafa;border-top:1px solid #e0e0e0;padding:4px 16px;font-size:10.5px;color:#777;display:flex;justify-content:space-between}
</style>
</head>
<body>
<div class="hd">
  <img src="../logo.png" onerror="this.style.display='none'">
  <h1>CW/HW quizzes</h1>
</div>
<div class="container">
  <div id="units"></div>
</div>
<div class="statusbar">
  <span id="totals"></span>
  <span style="color:#aaa;font-size:10px">© mitali120501@gmail.com</span>
</div>
<script src="../engine.js"></script>
<script>
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
Engine.hwIndex().then(d => {
  document.getElementById('units').innerHTML = d.units.map(u => `
  <div class="unit-block">
    <div class="unit-hd">${u.unit_id} — ${esc(u.title)}</div>
    <div class="topic-grid">${u.topics.map(t => `
      <div class="topic-card">
        <div class="topic-info">
          <div class="tid">${t.topic_id.replace("-", " · ")}</div>
          <div class="tname">${esc(t.title)}</div>
          <div class="tmeta">${t.count} questions · ~${t.count} min</div>
        </div>
        <a class="btn-start" href="quiz.html?topic=${encodeURIComponent(t.topic_id)}">Start →</a>
      </div>`).join('')}
    </div>
  </div>`).join('');
  document.getElementById('totals').textContent = `${d.total_topics} topics · ${d.total_questions} questions total`;
});
</script>
</body>
</html>
