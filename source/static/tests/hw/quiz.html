<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CW/HW quizzes · Aayat-AP-Prep</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{font-family:'Times New Roman',Times,serif;background:#fff;color:#000;font-size:14px;overflow:hidden}
.shell{position:fixed;inset:var(--apnav-h,0px) 0 0 0;display:flex;flex-direction:column}
.hd{background:#111111;color:#fff;display:flex;align-items:center;gap:10px;padding:5px 16px;flex-shrink:0}
.hd img{height:26px;object-fit:contain}.hd .hd-txt{flex:1}
.hd h1{font-size:13px;font-weight:bold}.hd p{font-size:11px;opacity:.8}
.hd a{color:#ffcccc;font-size:11px;text-decoration:none}.hd a:hover{color:#fff}
/* progress ribbon */
.prog-ribbon{background:#111111;color:#fff;display:flex;align-items:center;gap:10px;padding:4px 12px;flex-shrink:0;font-size:12px;border-top:1px solid #600000}
.q-counter{font-weight:bold;white-space:nowrap;min-width:70px}
.prog-track{flex:1;height:6px;background:rgba(255,255,255,.25)}.prog-fill{height:100%;background:#fff;transition:width .35s}
.score-disp{font-family:'Courier New',monospace;font-size:11px;min-width:60px;text-align:right}
/* quiz area */
.quiz-area{flex:1;overflow-y:auto;padding:16px 20px;background:#fff}
.q-stem{font-size:14px;line-height:1.7;margin-bottom:14px;font-weight:bold}
.choice-btn{width:100%;text-align:left;background:#fff;border:1px solid #ccc;padding:7px 12px;margin-bottom:7px;display:flex;gap:10px;cursor:pointer;font-family:'Times New Roman',serif;font-size:13px;line-height:1.5;color:#000;transition:border-color .15s,background .15s}
.choice-btn:hover:not(:disabled){border-color:#111111;background:#fff8f8}
.choice-btn.selected{border-color:#111111;border-left:3px solid #111111;background:#fff8f8}
.choice-btn.correct{border-color:#1a6b1a;border-left:3px solid #1a6b1a;background:#f0fff0}
.choice-btn.wrong{border-color:#111111;border-left:3px solid #111111;background:#fff0f0}
.choice-btn:disabled{cursor:default}
.choice-key{font-weight:bold;color:#111111;min-width:20px;flex-shrink:0}
/* feedback */
.feedback-box{margin-top:10px;padding:10px 14px;border-left:3px solid #111111;background:#fafafa;font-size:12.5px;line-height:1.65}
.feedback-box.correct-fb{border-color:#1a6b1a;background:#f0fff0}
.feedback-box.wrong-fb{border-color:#111111;background:#fff0f0}
.fb-verdict{font-weight:bold;margin-bottom:4px;font-size:13px}
/* action bar */
.action-bar{flex-shrink:0;padding:8px 14px;border-top:1px solid #e8e8e8;display:flex;justify-content:space-between;align-items:center;background:#fff}
.btn{font-family:'Times New Roman',serif;font-size:13px;padding:6px 20px;cursor:pointer;border:1px solid}
.btn-p{background:#111111;color:#fff;border-color:#600000}.btn-p:hover{background:#a00000}
.btn-o{background:#fff;color:#000;border-color:#999}.btn-o:hover{border-color:#111111;color:#111111}
.btn:disabled{opacity:.45;cursor:default}
/* result screen */
.result-screen{position:absolute;inset:0;background:#fff;overflow-y:auto;padding:24px;display:none}
.result-screen.show{display:block}
.result-card{max-width:560px;margin:0 auto}
.r-hd{background:#111111;color:#fff;padding:8px 16px;margin-bottom:16px}
.r-hd h2{font-size:15px}.r-hd p{font-size:11px;opacity:.8;margin-top:2px}
.r-stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.r-stat{text-align:center;padding:10px;border:1px solid #e8e8e8}
.r-val{font-size:28px;font-weight:bold;color:#111111}
.r-lbl{font-size:10.5px;color:#777;margin-top:2px}
.r-tbl{width:100%;border-collapse:collapse;font-size:11.5px;margin-bottom:16px}
.r-tbl th{background:#f5f0f0;border:1px solid #d8c8c8;padding:3px 8px;text-align:left;font-size:11px;color:#111111}
.r-tbl td{border:1px solid #e8e8e8;padding:4px 8px;vertical-align:top}
.r-tbl tr:nth-child(even) td{background:#fafafa}
.green{color:#1a6b1a}.red{color:#111111}
.r-actions{display:flex;gap:8px;margin-top:8px}
.submit-ok{font-size:11.5px;color:#1a6b1a;padding:6px 10px;background:#f0fff0;border:1px solid #aadcaa;margin-bottom:10px}
.submit-err{font-size:11.5px;color:#111111;padding:6px 10px;background:#fff0f0;border:1px solid #dbaabb;margin-bottom:10px}
::-webkit-scrollbar{width:7px}::-webkit-scrollbar-track{background:#f8f8f8}
::-webkit-scrollbar-thumb{background:#d8c8c8}::-webkit-scrollbar-thumb:hover{background:#111111}
</style>
</head>
<body>
<div class="shell">
<div class="hd">
  <img src="../logo.png" onerror="this.style.display='none'">
  <div class="hd-txt">
    <h1><span class="t-id"></span> — <span class="t-title"></span></h1>
    <p><span class="t-unit"></span> · CW/HW Quiz · 10 questions</p>
  </div>
  <a href="index.html">← All Topics</a>
</div>

<!-- start screen shown before name/email -->
<div id="start-overlay" style="position:absolute;inset:0;background:#fff;display:flex;align-items:center;justify-content:center;z-index:10;padding:20px">
  <div style="width:100%;max-width:360px;border:1px solid #e0e0e0">
    <div style="background:#111111;color:#fff;padding:8px 14px;font-size:13px;font-weight:bold">
      <span class="t-id"></span> · <span class="t-title"></span>
    </div>
    <div style="padding:16px">
      <div style="margin-bottom:12px">
        <label style="display:block;font-size:12px;font-weight:bold;margin-bottom:3px">Full Name *</label>
        <input id="inp-name" type="text" style="width:100%;padding:5px 8px;border:1px solid #ccc;font-family:'Times New Roman',serif;font-size:13px;outline:none" placeholder="Jane Smith">
      </div>
      <div style="margin-bottom:14px">
        <label style="display:block;font-size:12px;font-weight:bold;margin-bottom:3px">Email *</label>
        <input id="inp-email" type="email" style="width:100%;padding:5px 8px;border:1px solid #ccc;font-family:'Times New Roman',serif;font-size:13px;outline:none" placeholder="you@school.edu">
      </div>
      <div style="display:flex;justify-content:flex-end">
        <button class="btn btn-p" onclick="startQuiz()">Begin →</button>
      </div>
    </div>
  </div>
</div>

<div class="prog-ribbon">
  <span class="q-counter">Q <span id="q-num">1</span> / 10</span>
  <div class="prog-track"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
  <span class="score-disp" id="score-disp">0 / 0</span>
</div>
<div class="quiz-area" id="quiz-area">
  <div class="q-stem" id="q-stem"></div>
  <div id="choices"></div>
  <div id="feedback-box" style="display:none"></div>
</div>
<div class="action-bar">
  <span style="font-size:11.5px;color:#888" id="action-hint">Select an answer</span>
  <div style="display:flex;gap:8px">
    <button class="btn btn-p" id="btn-submit" onclick="submitAnswer()" disabled>Submit</button>
    <button class="btn btn-p" id="btn-next" onclick="nextQ()" style="display:none">Next →</button>
  </div>
</div>

<!-- result screen -->
<div class="result-screen" id="result-screen">
  <div class="result-card">
    <div class="r-hd">
      <h2>Quiz Complete, <span class="t-id"></span> · <span class="t-title"></span></h2>
      <p id="r-student"></p>
    </div>
    <div id="r-submit-status"></div>
    <div class="r-stat-grid">
      <div class="r-stat"><div class="r-val" id="r-score">—</div><div class="r-lbl">Score</div></div>
      <div class="r-stat"><div class="r-val" id="r-pct">—</div><div class="r-lbl">Accuracy</div></div>
      <div class="r-stat"><div class="r-val" id="r-time">—</div><div class="r-lbl">Time</div></div>
    </div>
    <table class="r-tbl" id="r-tbl">
      <thead><tr><th>#</th><th>Question</th><th>Your Answer</th><th>Correct</th><th>Result</th></tr></thead>
      <tbody id="r-tbody"></tbody>
    </table>
    <div class="r-actions">
      <a class="btn btn-o" href="" onclick="location.reload();return false">Retry</a>
      <a class="btn btn-o" href="index.html">All Topics</a>
      <a class="btn btn-p" href="../index.html">Adaptive Quiz</a>
    </div>
  </div>
</div>
</div>

<script src="../../assets/config.js"></script>
<script src="../../assets/shared/neon.js"></script>
<script src="../../assets/shared/identity.js"></script>
<script src="../engine.js"></script>
<script>
// quiz.html?topic=U3-2 ; questions come from engine/data/hw/U<n>-<k>.json
let QUESTIONS = [], TOPIC_ID = new URLSearchParams(location.search).get('topic') || '', TOPIC_TTL = '', UNIT = '';
const READY = Engine.hwTopic(TOPIC_ID).then(t => {
  QUESTIONS = t.questions; TOPIC_TTL = t.title; UNIT = t.unit;
  document.title = t.title + ' · Aayat-AP-Prep';
  document.querySelectorAll('.t-id').forEach(e => e.textContent = t.topic_id.replace('-', ' · '));
  document.querySelectorAll('.t-title').forEach(e => e.textContent = t.title);
  document.querySelectorAll('.t-unit').forEach(e => e.textContent = t.unit);
  const saved = Identity.getEmail();
  if (saved) document.getElementById('inp-email').value = saved;
}).catch(() => {
  document.getElementById('start-overlay').innerHTML =
    '<p>Topic "' + esc(TOPIC_ID) + '" not found. <a href="index.html">← All Topics</a></p>';
});

let CUR_IDX=0, SEL=null, CORRECT=0, RESPONSES=[], START=0;
let STUDENT_NAME='', STUDENT_EMAIL='';

async function startQuiz(){
  await READY;
  if(!QUESTIONS.length) return;
  STUDENT_NAME=document.getElementById('inp-name').value.trim();
  STUDENT_EMAIL=document.getElementById('inp-email').value.trim();
  if(!STUDENT_NAME){alert('Please enter your name.');return;}
  if(!STUDENT_EMAIL||!STUDENT_EMAIL.includes('@')){alert('Please enter a valid email.');return;}
  document.getElementById('start-overlay').style.display='none';
  START=Date.now();
  loadQ(0);
}

function loadQ(idx){
  if(idx>=QUESTIONS.length){showResults();return;}
  CUR_IDX=idx; SEL=null;
  const q=QUESTIONS[idx];
  document.getElementById('q-num').textContent=idx+1;
  document.getElementById('prog-fill').style.width=`${(idx/QUESTIONS.length)*100}%`;
  document.getElementById('score-disp').textContent=`${CORRECT} / ${idx}`;
  document.getElementById('q-stem').textContent=q.stem;
  document.getElementById('feedback-box').style.display='none';
  document.getElementById('btn-submit').disabled=true;
  document.getElementById('btn-next').style.display='none';
  document.getElementById('action-hint').textContent='Select an answer';
  const cc=document.getElementById('choices');
  cc.innerHTML='';
  Object.entries(q.choices).forEach(([k,txt])=>{
    const b=document.createElement('button');
    b.className='choice-btn';
    b.innerHTML=`<span class="choice-key">${k}</span><span>${txt}</span>`;
    b.onclick=()=>pickChoice(k,b);
    cc.appendChild(b);
  });
}

function pickChoice(key,btn){
  SEL=key;
  document.querySelectorAll('.choice-btn').forEach(b=>b.classList.remove('selected'));
  btn.classList.add('selected');
  document.getElementById('btn-submit').disabled=false;
  document.getElementById('action-hint').textContent='Click Submit to confirm';
}

function submitAnswer(){
  if(!SEL)return;
  const q=QUESTIONS[CUR_IDX];
  const correct=SEL===q.answer;
  if(correct)CORRECT++;
  const t0=Date.now();
  RESPONSES.push({question_id:q.id,answer:SEL,correct_answer:q.answer,correct,time_taken:Math.round((t0-START)/1000/QUESTIONS.length)});
  document.querySelectorAll('.choice-btn').forEach(b=>{
    b.disabled=true;
    const key=b.querySelector('.choice-key').textContent;
    if(key===q.answer)b.classList.add('correct');
    else if(key===SEL&&!correct)b.classList.add('wrong');
  });
  const fb=document.getElementById('feedback-box');
  fb.className='feedback-box '+(correct?'correct-fb':'wrong-fb');
  fb.innerHTML=`<div class="fb-verdict">${correct?'✅ Correct!':'❌ Incorrect, correct answer: <b>'+q.answer+'</b>'}</div><div>${q.explanation||''}</div>`;
  fb.style.display='block';
  document.getElementById('btn-submit').disabled=true;
  document.getElementById('btn-next').style.display='inline-block';
  if(CUR_IDX===QUESTIONS.length-1){
    document.getElementById('btn-next').textContent='View Results →';
    document.getElementById('btn-next').onclick=showResults;
  }
}

function nextQ(){loadQ(CUR_IDX+1);}

let RESULTS_SHOWN=false;
function showResults(){
  if(RESULTS_SHOWN)return; // one saved session per attempt; Retry reloads the page
  RESULTS_SHOWN=true;
  const elapsed=Math.round((Date.now()-START)/1000);
  const pct=Math.round((CORRECT/QUESTIONS.length)*100);
  const m=Math.floor(elapsed/60),s=elapsed%60;
  const pcolor=pct>=75?'#1a6b1a':pct>=50?'#8B6914':'#111111';
  document.getElementById('r-student').textContent=`${STUDENT_NAME} · ${STUDENT_EMAIL}`;
  document.getElementById('r-score').textContent=`${CORRECT}/${QUESTIONS.length}`;
  document.getElementById('r-pct').innerHTML=`<span style="color:${pcolor}">${pct}%</span>`;
  document.getElementById('r-time').textContent=`${m}m${s}s`;
  const tbody=document.getElementById('r-tbody');
  tbody.innerHTML=RESPONSES.map((r,i)=>{
    const q=QUESTIONS[i];
    const stem=(q.stem||'').slice(0,70)+(q.stem.length>70?'…':'');
    return `<tr>
      <td style="color:#999">${i+1}</td>
      <td style="font-size:11px">${esc(stem)}</td>
      <td style="font-weight:bold">${r.answer}</td>
      <td style="font-weight:bold">${r.correct_answer}</td>
      <td>${r.correct?'<span class="green">✓</span>':'<span class="red">✗</span>'}</td>
    </tr>`;
  }).join('');
  document.getElementById('result-screen').classList.add('show');
  submitToServer(elapsed,pct);
}

async function submitToServer(elapsed,pct){
  const el=document.getElementById('r-submit-status');
  try{
    const payload={name:STUDENT_NAME,email:STUDENT_EMAIL,unit:UNIT,
      topic_id:TOPIC_ID,topic_title:TOPIC_TTL,
      n_answered:QUESTIONS.length,correct:CORRECT,
      accuracy_pct:pct,elapsed_sec:elapsed,
      session_type:'hw',responses:RESPONSES};
    Engine.saveHw(payload);
    el.innerHTML=Neon.isConfigured()
      ? '<div class="submit-ok">✓ Result recorded to the class record.</div>'
      : '<div class="submit-ok">✓ Result saved in this browser (the class database is not configured).</div>';
  }catch(e){el.innerHTML='<div class="submit-err">⚠ Could not submit: '+esc(e.message)+'</div>';}
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
</script>
</body>
</html>
