# Canonical item bank for atom 5.3.a (single source of truth).
atom: 5.3.a
title: Encryption vs. Hashing
lo:
- 5.3.A
items:
- id: q1
  type: mcq
  prompt: An engineer needs to store credit card numbers so they can be processed and charged at the end of every month. Which cryptographic primitive must they use?
  options:
  - Encryption, because the process must be reversible to retrieve the original card numbers
  - Hashing, because it protects the integrity of the credit card numbers
  - Encoding, because Base64 keeps card numbers safe on the disk
  - Obfuscation, because it hides details and is fully reversible without keys
  answer: 0
  points: 1
  explain: Since the credit card numbers must be retrieved in their original form to charge them, the control must be reversible. This requires encryption, not hashing.
- id: q2
  type: mcq
  prompt: What is the primary security goal of adding a salt to a password before hashing it?
  options:
  - To make the hashing function compute slower and consume more CPU
  - To ensure that identical passwords yield different digests, defeating precomputed lookup attacks
  - To encrypt the password so it can be decrypted by administrators
  - To detect if the password has been modified during transmission over the network
  answer: 1
  points: 1
  explain: Salting ensures that identical passwords do not hash to the same digest. This makes precomputed rainbow tables useless because an attacker would have to compute a new table for each unique salt.
- id: q3
  type: multi
  prompt: Select ALL of the following statements that represent common security misconceptions.
  options:
  - Encoding data in Base64 provides confidentiality because the output is unreadable.
  - MD5 is safe for general password hashing as long as you do not use a salt.
  - If an attacker gets access to the database of hashed passwords, they cannot reverse the digests to recover the plaintext.
  - Hashing is a reversible process if you possess the master decryption key.
  answer:
  - 0
  - 1
  - 3
  points: 3
  explain: Base64 encoding is trivially reversible and provides zero security. MD5 is deprecated and vulnerable to collisions. Hashing is mathematically one-way and has no decryption key.
- id: q4
  type: short
  prompt: What is the term for the situation when two different inputs to a hash function produce the exact same digest output?
  accept:
  - collision
  - hash collision
  - collisions
  points: 1
  explain: A collision occurs when two distinct inputs yield the same hash digest, which undermines integrity guarantees.
- id: q5
  type: code
  prompt: Implement the salted SHA-256 password hashing module in problem/ (graded automatically).
  grader: problem
  points: 3
