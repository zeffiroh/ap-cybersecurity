atom: 5.3.b
title: Symmetric encryption and key management
lo:
- 5.3.A
- 5.3.B
items:
- id: q1
  type: mcq
  prompt: A developer encrypts a bitmap image using AES in ECB mode. Even though AES itself is uncompromised, the ciphertext still reveals the outline of the original image. Why?
  options:
  - ECB mode encrypts identical plaintext blocks into identical ciphertext blocks, leaking patterns in the data
  - AES-128 keys are too short to hide image data
  - Bitmap files cannot be encrypted with any block cipher
  - ECB mode does not actually encrypt the first block
  answer: 0
  points: 1
  explain: ECB mode encrypts each block independently with the same key, so identical plaintext blocks always produce identical ciphertext blocks, exposing patterns like image outlines.
- id: q2
  type: multi
  prompt: Select ALL statements that correctly describe Galois/Counter Mode (GCM).
  options:
  - GCM is an Authenticated Encryption with Associated Data (AEAD) mode
  - GCM provides both confidentiality and integrity verification via an authentication tag
  - GCM is functionally identical to ECB mode with a different name
  - If an attacker tampers with GCM ciphertext, decryption fails
  answer:
  - 0
  - 1
  - 3
  points: 3
  explain: 'GCM is an AEAD mode: it encrypts (confidentiality) and produces an authentication tag (integrity), so tampering causes decryption/verification to fail. It is nothing like ECB.'
- id: q3
  type: mcq
  prompt: A DEK (Data Encryption Key) needs to be stored long-term alongside the encrypted data it protects. Per the key-management lifecycle, what should be done with the DEK before storing it?
  options:
  - "Store it next to the ciphertext, but in a separate column"
  - "Wrap (encrypt) it with a Key Encryption Key (KEK) kept in an HSM or secrets manager, and store the wrapped DEK"
  - "Hash it with SHA-256 so it cannot be stolen"
  - "Store it in the application's configuration file, readable only by the app"
  answer: 1
  points: 1
  explain: "Envelope encryption keeps the DEK next to the data only in wrapped (encrypted) form; the KEK that unwraps it lives in a hardware security module or secrets manager. Stealing the database then yields only ciphertext plus a locked key. A key stored nearby in plaintext or a config file protects nothing against an attacker who reaches that storage, and a hashed key can no longer decrypt anything."
- id: q4
  type: short
  prompt: Name the type of random number generator that MUST be used to generate a symmetric key, instead of a standard library like Python's `random` module.
  accept:
  - CSPRNG
  - cryptographically secure pseudo-random number generator
  - cryptographically secure prng
  points: 1
  explain: Keys must be generated with a CSPRNG (e.g., Python's `secrets` module or /dev/urandom) because standard PRNGs are predictable and unsuitable for cryptography.
- id: q5
  type: code
  prompt: Implement the symmetric key-management toolkit in problem/ (graded automatically).
  grader: problem
  points: 3
