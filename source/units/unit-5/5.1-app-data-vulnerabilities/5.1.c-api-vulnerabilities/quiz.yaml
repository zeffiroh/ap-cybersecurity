# Canonical item bank for atom 5.1.c (single source of truth).
# Used by the skill quiz page and the topic's practice questions.
atom: 5.1.c
title: API vulnerabilities
lo:
- 5.1.B
items:
- id: q1
  type: mcq
  prompt: A logged-in user changes the URL from /api/accounts/482 to /api/accounts/483 and the API returns account 483's private balance. What is this flaw called?
  options:
  - SQL injection
  - Denial of service
  - Cross-site scripting
  - Broken Object Level Authorization (BOLA/IDOR)
  answer: 3
  points: 1
  explain: The API checked that the token was valid but never verified the caller owns object 483, a textbook BOLA/IDOR.
- id: q2
  type: multi
  prompt: Select ALL statements that correctly distinguish authentication from authorization in the context of BOLA.
  options:
  - Authentication proves who the caller is (e.g., a valid session token)
  - Authorization checks whether that identity is allowed to access a specific object
  - BOLA is caused by an authentication failure, not an authorization failure
  - A valid login token alone does not prove the caller owns every object they might request
  answer:
  - 0
  - 1
  - 3
  points: 3
  explain: BOLA is specifically an authorization gap, the identity check passed, but the per-object permission check was skipped.
- id: q3
  type: mcq
  prompt: Why does hiding a button in the app's user interface fail to prevent a BOLA attack?
  options:
  - Buttons are always encrypted
  - Attackers can call the API endpoint directly with tools like curl or Postman, bypassing the UI entirely
  - UI hiding is a form of encryption
  - APIs cannot be called without a browser
  answer: 1
  points: 1
  explain: Client-side hiding only affects what the UI displays; the server endpoint is still reachable directly, so authorization must be enforced server-side.
- id: q4
  type: short
  prompt: Name the API flaw where an endpoint returns a full internal object (extra fields like password hashes) and relies on the client to hide sensitive fields.
  accept:
  - excessive data exposure
  - data exposure
  points: 1
  explain: Excessive data exposure, the server should filter fields itself, not trust the client to hide them.
- id: q5
  type: code
  prompt: Implement the object-level authorization check in problem/ (graded automatically).
  grader: problem
  points: 3
