# Canonical item bank for atom 5.1.d (single source of truth).
# Used by the skill quiz page and the topic's practice questions.
atom: 5.1.d
title: Data breaches and their impact
lo:
- 5.1.C
items:
- id: q1
  type: mcq
  prompt: Which factor is NOT one of the three primary drivers of a data breach's severity discussed in this atom?
  options:
  - Sensitivity of the data exposed
  - Scale (number of records)
  - The programming language the app was written in
  - Time to detect and contain
  answer: 2
  points: 1
  explain: Severity is driven by data sensitivity, scale, and detection/containment time, not implementation language.
- id: q2
  type: multi
  prompt: Select ALL data categories that count as high-sensitivity (PII/PHI/financial/authentication secrets).
  options:
  - Full name plus Social Security number
  - Public blog post titles
  - Plaintext passwords
  - Credit card numbers
  answer:
  - 0
  - 2
  - 3
  points: 3
  explain: Public blog titles are low-sensitivity; SSNs, plaintext passwords, and card numbers are high-sensitivity categories.
- id: q3
  type: mcq
  prompt: Why is a breach of hashed-and-salted passwords generally considered less severe than a breach of the same passwords in plaintext?
  options:
  - Hashed passwords cannot be stored in a database
  - Hashing adds a layer of work an attacker must still defeat before the passwords are usable
  - Salted passwords are automatically deleted
  - There is no difference in severity
  answer: 1
  points: 1
  explain: Hashing (with salt) does not prevent a breach but raises the cost/time for an attacker to recover usable credentials.
- id: q4
  type: short
  prompt: 'Name the general incident-response step that comes immediately after containment: identifying what data and how many records/individuals were affected.'
  accept:
  - assess
  - assessment
  points: 1
  explain: Contain -> assess -> notify -> remediate is the standard breach-response arc.
- id: q5
  type: code
  prompt: Implement the breach severity scorer in problem/ (graded automatically).
  grader: problem
  points: 3
