atom: 5.1.a
title: SQL injection
lo:
- 5.1.A
- 5.1.B
items:
- id: q1
  type: mcq
  prompt: Which of the following describes how a SQL injection attack is executed?
  options:
  - An attacker floods the database server with connections until it crashes
  - An attacker intercepts database traffic using a packet sniffer
  - An attacker inputs SQL commands into a user field, which the database then parses and runs as executable code
  - An attacker changes the routing tables to redirect database requests to their own host
  answer: 2
  points: 1
  explain: SQL injection occurs when user input is concatenated into a database query string, allowing the database engine to interpret user input as executable SQL logic.
- id: q2
  type: multi
  prompt: Which of the following methods are effective practices to prevent or mitigate SQL injection attacks? (Select ALL that apply.)
  options:
  - Using parameterized queries (prepared statements)
  - Encrypting database tables using AES symmetric encryption
  - Using input validation and sanitization
  - Running the database application with least-privilege permissions
  answer:
  - 0
  - 2
  - 3
  points: 3
  explain: Parameterized queries are the primary defense against SQLi. Input validation and least-privilege database permissions provide defense-in-depth. Database table encryption protects confidentiality of stored data but does not prevent SQLi execution.
- id: q3
  type: short
  prompt: What is the name of the SQL injection technique that uses a database keyword to combine results from the original query with results from a table of the attacker's choosing?
  accept:
  - union
  - union select
  - union-based
  - union based
  points: 1
  explain: A UNION-based SQL injection uses the UNION keyword to combine the results of the application's query with the results of a custom query injected by the attacker.
- id: q4
  type: code
  prompt: Implement the SQL injection pattern detector in problem/ (graded automatically).
  grader: problem
  points: 3
