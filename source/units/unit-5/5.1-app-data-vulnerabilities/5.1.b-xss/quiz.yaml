# Canonical item bank for atom 5.1.b (single source of truth).
# Used by the skill quiz page and the topic's practice questions.
atom: 5.1.b
title: Cross-site scripting (XSS)
lo:
- 5.1.A
- 5.1.B
items:
- id: q1
  type: mcq
  prompt: 'A search page prints ''You searched for: <user input>'' straight into the results HTML, with no escaping. Which vulnerability class is this?'
  options:
  - SQL injection
  - Broken object-level authorization
  - Cross-site scripting
  - Denial of service
  answer: 2
  points: 1
  explain: Untrusted input is placed into the HTML output unescaped and can be interpreted as markup/script, this is XSS.
- id: q2
  type: multi
  prompt: Select ALL statements that correctly describe stored XSS.
  options:
  - The payload is saved server-side (e.g., in a database or comment field)
  - Every user who later views the infected page can be compromised, with no extra click needed
  - It requires the victim to click a specially crafted URL each time
  - It is generally considered more dangerous than reflected XSS because no social engineering step is needed
  answer:
  - 0
  - 1
  - 3
  points: 3
  explain: Stored XSS persists on the server and fires automatically for any viewer; it does not need a crafted link like reflected XSS does.
- id: q3
  type: mcq
  prompt: Why is output encoding (escaping) considered the primary defense against XSS, rather than input validation alone?
  options:
  - Input validation is illegal under OWASP rules
  - Escaping is faster to type than validation
  - The same string can be safe in one context (plain text) and dangerous in another (rendered as HTML), so escaping must happen at the point of output
  - Input validation only works for SQL injection
  answer: 2
  points: 1
  explain: Escaping is context-dependent and must occur where data is written into HTML/JS/attributes, filtering on input alone misses this.
- id: q4
  type: short
  prompt: Name the XSS variant where the vulnerability lives entirely in client-side JavaScript and never touches the server.
  accept:
  - dom-based xss
  - dom based xss
  - dom xss
  points: 1
  explain: 'DOM-based XSS: untrusted data flows from a source (URL fragment, referrer) to an unsafe sink (innerHTML) purely in client script.'
- id: q5
  type: code
  prompt: Implement the XSS pattern detector in problem/ (graded automatically).
  grader: problem
  points: 3
