# Canonical item bank for atom 5.2.b (single source of truth).
# Used by the skill quiz page and the topic's practice questions.
atom: 5.2.b
title: Roles, permissions, and least privilege
lo:
- 5.2.A
- 5.2.B
items:
- id: q1
  type: mcq
  prompt: What is the principle that a subject should be granted only the permissions it needs to do its job, nothing more?
  options:
  - Least privilege
  - Separation of duties
  - Role recertification
  - Mandatory access control
  answer: 0
  points: 1
  explain: Least privilege minimizes the blast radius of a compromised or misused account.
- id: q2
  type: multi
  prompt: Select ALL statements that correctly describe privilege creep.
  options:
  - It is the gradual, unnoticed accumulation of unnecessary permissions over time
  - It happens because missing permissions are loudly noticed and fixed, while excess permissions are silently ignored
  - It is prevented automatically by RBAC with no further effort
  - Periodic role review/recertification is used to counteract it
  answer:
  - 0
  - 1
  - 3
  points: 3
  explain: RBAC organizes permissions but does not by itself prevent creep; deliberate review is required.
- id: q3
  type: mcq
  prompt: Why should the person who creates a vendor payment not also be the person who approves it?
  options:
  - Separation of duties requires that a sensitive process need collusion between two people to be abused
  - It violates least privilege by definition
  - Payments cannot be created and approved by the same software
  - It is a MAC labeling requirement
  answer: 0
  points: 1
  explain: Separation of duties splits sensitive processes across roles so a single compromised or malicious account cannot complete them alone.
- id: q4
  type: short
  prompt: Name the metaphor used to describe how much damage a compromised account with excess permissions can do.
  accept:
  - blast radius
  points: 1
  explain: Least privilege caps the 'blast radius' of a compromised identity.
- id: q5
  type: code
  prompt: Implement the least-privilege violation detector in problem/ (graded automatically).
  grader: problem
  points: 3
