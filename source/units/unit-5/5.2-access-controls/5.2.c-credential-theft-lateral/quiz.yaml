# Canonical item bank for atom 5.2.c (single source of truth).
# Used by the skill quiz page and the topic's practice questions.
atom: 5.2.c
title: Credential theft prevention and lateral movement
lo:
- 5.2.B
- 5.2.C
items:
- id: q1
  type: mcq
  prompt: An attacker who compromises one marketing laptop uses stolen credentials to hop to several other internal machines in search of valuable systems. What is this process called?
  options:
  - Lateral movement
  - Cross-site scripting
  - Broken object level authorization
  - Data exfiltration
  answer: 0
  points: 1
  explain: Moving from an initial foothold to additional systems within the network is lateral movement.
- id: q2
  type: multi
  prompt: Select ALL statements that correctly describe pass-the-hash / pass-the-ticket attacks.
  options:
  - The attacker authenticates using a stolen hash or ticket without ever knowing the plaintext password
  - These attacks require the attacker to crack the password first
  - They exploit authentication protocols that accept hash- or ticket-based authentication
  - Multi-factor authentication significantly reduces the impact of a successfully stolen credential
  answer:
  - 0
  - 2
  - 3
  points: 3
  explain: Pass-the-hash/ticket attacks specifically avoid needing the plaintext password; MFA blunts the value of any stolen credential.
- id: q3
  type: mcq
  prompt: Why does reusing the same local administrator password across every machine in an organization make lateral movement much easier for an attacker?
  options:
  - It has no effect on lateral movement
  - Shared passwords are always encrypted differently on each machine
  - One stolen admin credential authenticates on every machine that shares it, removing the need to steal new credentials at each hop
  - It only affects DAC systems
  answer: 2
  points: 1
  explain: A single shared admin credential becomes a skeleton key across the whole environment once stolen.
- id: q4
  type: short
  prompt: Name one behavioral signal defenders watch for that suggests an account is engaged in lateral movement (e.g., unusually high count of what).
  accept:
  - distinct hosts
  - number of hosts
  - host count
  - many hosts
  points: 1
  explain: A single account authenticating to an unusually large number of distinct hosts in a short window is a classic lateral-movement signal.
- id: q5
  type: code
  prompt: Implement the lateral-movement detector in problem/ (graded automatically).
  grader: problem
  points: 3
