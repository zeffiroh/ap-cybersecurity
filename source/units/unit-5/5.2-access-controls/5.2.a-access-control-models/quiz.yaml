# Canonical item bank for atom 5.2.a (single source of truth).
# Used by the skill quiz page and the topic's practice questions.
atom: 5.2.a
title: Access control models (RBAC, DAC, MAC)
lo:
- 5.2.A
items:
- id: q1
  type: mcq
  prompt: In Unix, a file's owner sets read/write/execute permissions for owner, group, and others. Which access control model does this describe?
  options:
  - Discretionary Access Control (DAC)
  - Mandatory Access Control (MAC)
  - Role-Based Access Control (RBAC)
  - Attribute-Based Access Control (ABAC)
  answer: 0
  points: 1
  explain: The object's owner decides who else may access it, that discretion is the defining trait of DAC.
- id: q2
  type: multi
  prompt: Select ALL statements that correctly describe Mandatory Access Control (MAC).
  options:
  - A central policy authority assigns labels to subjects and objects
  - Individual object owners can freely grant access to anyone they choose
  - The system enforces label-based rules automatically, regardless of owner preference
  - MAC originated in government/military contexts (e.g., Bell-LaPadula)
  answer:
  - 0
  - 2
  - 3
  points: 3
  explain: MAC removes discretion from owners; enforcement is centralized and automatic based on labels.
- id: q3
  type: mcq
  prompt: A hospital assigns permissions to a 'Nurse' role and a 'Billing Clerk' role rather than to each of its 5,000 staff individually. Which model is this?
  options:
  - DAC
  - MAC
  - RBAC
  - None of these
  answer: 2
  points: 1
  explain: Permissions attached to named roles, with users assigned to roles, is Role-Based Access Control.
- id: q4
  type: short
  prompt: 'Name the design principle: grant each subject only the permissions needed to do its job, nothing more.'
  accept:
  - least privilege
  - principle of least privilege
  points: 1
  explain: Least privilege limits the blast radius of a compromised account.
- id: q5
  type: code
  prompt: Implement the RBAC/DAC/MAC access-decision function in problem/ (graded automatically).
  grader: problem
  points: 3
