atom: 5.6.a
title: Application monitoring and logging
lo:
- 5.6.A
items:
- id: q1
  type: mcq
  prompt: A single failed login for one user is unremarkable. Fifty failed logins from one IP across twenty usernames in two minutes is a signal. What does this illustrate?
  options:
  - "The pattern, not the individual event, is the signal"
  - "Failed logins should never be logged because they are too common"
  - "Alerts should fire on every single failed login"
  - "Only successful logins indicate an attack"
  answer: 0
  points: 1
  explain: "One failure is noise; fifty from one source against twenty accounts is a password-spraying signal. Detection rules look for patterns across events (count, spread, timing) rather than single entries. Failures must be logged, or the pattern cannot be seen."
- id: q2
  type: multi
  prompt: Select ALL fields a well-designed security log line typically includes.
  options:
  - Timestamp
  - Requesting IP address
  - Result/status code
  - The victim's home address
  answer:
  - 0
  - 1
  - 2
  points: 3
  explain: Standard log fields are timestamp, source IP, user identity, resource accessed, and result code, never unrelated personal data like a home address.
- id: q3
  type: mcq
  prompt: What is a SIEM?
  options:
  - "A firewall that inspects application traffic"
  - "A tool that scans source code for vulnerabilities"
  - "An endpoint agent that blocks malware on laptops"
  - "A platform that centralizes logs from many sources and applies detection rules to raise alerts"
  answer: 3
  points: 1
  explain: "SIEM (Security Information and Event Management) collects logs from servers, firewalls, apps and endpoints in one place, correlates them, and raises alerts. A web firewall, a code scanner (SAST) and an endpoint agent (EDR/antivirus) are different tools that often SEND logs to a SIEM."
- id: q4
  type: short
  prompt: Name the log severity level at which security-relevant events (like authentication attempts) should be recorded so they are not silently dropped in production.
  accept:
  - INFO
  - info level
  - info or higher
  points: 1
  explain: Security-relevant events should be logged at INFO or higher, since DEBUG is typically disabled in production.
- id: q5
  type: mcq
  prompt: Why do defenders stream logs to a remote aggregator in real time rather than only storing them locally on the application server?
  options:
  - "Remote storage compresses logs so more history can be kept"
  - "An attacker who compromises the server can delete local logs to cover their tracks; a remote copy preserves the forensic record"
  - "Local logs cannot include timestamps"
  - "Remote aggregators automatically block attackers"
  answer: 1
  points: 1
  explain: "Clearing logs is a standard attacker step after gaining access. Shipping each line off the server as it is written means the evidence already exists elsewhere before the attacker can erase it, and a central store also lets analysts correlate across systems."
