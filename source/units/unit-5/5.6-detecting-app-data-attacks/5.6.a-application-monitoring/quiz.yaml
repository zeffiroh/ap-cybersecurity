# Canonical item bank for atom 5.6.a (single source of truth).
# Used by the skill quiz page and the topic's practice questions.
atom: 5.6.a
title: Application monitoring and logging
lo:
- 5.6.A
items:
- id: q1
  type: mcq
  prompt: A single failed login for one user is unremarkable. Fifty failed logins from one IP across twenty usernames in two minutes is a signal. What does this illustrate?
  options:
  - The pattern, not the individual event, is the signal
  - Individual events matter more than patterns
  - Logs should never be reviewed manually
  - HTTP status codes are irrelevant to security
  answer: 0
  points: 1
  explain: Seen once, a failed login is unremarkable; seen repeatedly in a tight pattern from one source, it becomes a brute-force signal.
- id: q2
  type: multi
  prompt: Select ALL fields a well-designed security log line typically includes.
  options:
  - Timestamp
  - Requesting IP address
  - Result/status code
  - The victim's home address
  answer:
  - 0
  - 1
  - 2
  points: 3
  explain: Standard log fields are timestamp, source IP, user identity, resource accessed, and result code, never unrelated personal data like a home address.
- id: q3
  type: mcq
  prompt: What is a SIEM?
  options:
  - A type of firewall rule
  - An encryption algorithm
  - A programming language for writing exploits
  - A platform that centralizes logs from many sources and applies detection rules to raise alerts
  answer: 3
  points: 1
  explain: SIEM = Security Information and Event Management, a centralized log-aggregation and alerting platform.
- id: q4
  type: short
  prompt: Name the log severity level at which security-relevant events (like authentication attempts) should be recorded so they are not silently dropped in production.
  accept:
  - INFO
  - info level
  - info or higher
  points: 1
  explain: Security-relevant events should be logged at INFO or higher, since DEBUG is typically disabled in production.
- id: q5
  type: mcq
  prompt: Why do defenders stream logs to a remote aggregator in real time rather than only storing them locally on the application server?
  options:
  - It makes the application run faster
  - An attacker who compromises the server can delete local logs to cover their tracks; a remote copy preserves the forensic record
  - Local logs are illegal to store
  - It has no security benefit
  answer: 1
  points: 1
  explain: 'Protecting the logs themselves matters: real-time remote streaming prevents an attacker from erasing the evidence of their own intrusion.'
- id: q6
  type: code
  prompt: Implement the brute-force detector in problem/ (graded automatically).
  grader: problem
  points: 3
