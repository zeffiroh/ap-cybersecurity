# Canonical item bank for atom 5.6.b (single source of truth).
# Used by the skill quiz page and the topic's practice questions.
atom: 5.6.b
title: Data loss detection (DLP)
lo:
- 5.6.B
items:
- id: q1
  type: mcq
  prompt: Which DLP detection strategy inspects the actual data leaving the organization for patterns like credit-card numbers or SSNs?
  options:
  - Volume/behavior-based detection
  - Endpoint detection and response
  - Content-based detection
  - Least privilege
  answer: 2
  points: 1
  explain: Content-based detection scans the data itself for recognizable sensitive patterns.
- id: q2
  type: multi
  prompt: Select ALL statements that correctly describe volume/behavior-based DLP detection.
  options:
  - It can catch exfiltration of encrypted or compressed data that has no recognizable content pattern
  - It relies on comparing an account's current activity against its normal baseline
  - It requires reading and understanding the literal content of every file transferred
  - A sudden large transfer to an unfamiliar destination is a classic signal it looks for
  answer:
  - 0
  - 1
  - 3
  points: 3
  explain: Behavior-based detection watches how much/when/where data moves, not what it contains, which is exactly why it catches encrypted exfiltration content inspection would miss.
- id: q3
  type: mcq
  prompt: Why do effective DLP programs maintain an approved-destination allowlist?
  options:
  - To make transfers faster
  - It is required to encrypt data
  - So legitimate large transfers (backups, sanctioned partners) don't drown out real alerts with false positives
  - It replaces the need for any volume threshold
  answer: 2
  points: 1
  explain: An approved-destination list lets DLP distinguish sanctioned large transfers from suspicious ones, reducing alert noise.
- id: q4
  type: short
  prompt: Name the DLP deployment point that runs on individual laptops/workstations and can block a USB copy of a flagged file, which network DLP alone would never see.
  accept:
  - endpoint dlp
  - endpoint
  points: 1
  explain: Endpoint DLP instruments the device itself, catching exfiltration paths (USB, local print) that never touch the network.
- id: q5
  type: mcq
  prompt: How does DLP differ from a purely forensic control like log review?
  options:
  - DLP cannot detect anything until after data has already left
  - DLP and log review are identical in function
  - DLP only works on encrypted traffic
  - A well-integrated DLP system can act preventively in real time, blocking or quarantining a transfer before it completes
  answer: 3
  points: 1
  explain: Unlike a log reviewed after the fact, DLP can intervene during the attempt, blocking an email or quarantining an upload before it finishes.
- id: q6
  type: code
  prompt: Implement the DLP egress rule in problem/ (graded automatically).
  grader: problem
  points: 3
