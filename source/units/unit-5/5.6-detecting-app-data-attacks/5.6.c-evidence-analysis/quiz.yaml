items:
- id: q1
  type: mcq
  prompt: A single failed-login spike is observed. What is the analyst's correct next step before declaring it a brute-force attack?
  options:
  - "Check the underlying evidence, e.g. is it one source targeting many usernames, or many sources targeting one username?"
  - "Block the source IP immediately and close the case"
  - "Reset every user's password as a precaution"
  - "Wait for a second spike before doing anything"
  answer: 0
  points: 1
  explain: "A spike could be brute force, password spraying, a misconfigured service retrying an old password, or users locked out after a change. Looking at the shape (one source vs many, one account vs many, any successes) decides both the classification and the right response. Blocking or mass resets before you understand it can cause outages and miss the real problem."
- id: q2
  type: multi
  prompt: Select ALL statements that correctly describe an indicator of compromise (IOC).
  options:
  - A single IOC is rarely conclusive proof of a specific attack type by itself
  - Examples include a suspicious IP, a known-malware file hash, or a credential-harvesting URL
  - Attack classification typically requires reasoning about multiple IOCs together
  - An IOC always proves the attacker's exact identity
  answer:
  - 0
  - 1
  - 2
  points: 3
  explain: IOCs are individually weak signals; classification comes from weighing multiple IOCs together, and none of them reveal an attacker's identity by themselves.
- id: q3
  type: mcq
  prompt: Why does chain of custody matter for evidence even outside a courtroom?
  options:
  - "Chain of custody is only needed when police are involved"
  - "It makes evidence files smaller and easier to store"
  - "It replaces the need to keep original copies"
  - "An internal investigation's credibility also depends on being able to show evidence wasn't tampered with"
  answer: 3
  points: 1
  explain: "Internal investigations lead to firings, insurance claims and lawsuits that may come later. If you cannot show who handled the evidence and that it was not altered (hashes, logs of access), conclusions can be challenged. Investigators always preserve originals and analyze copies."
- id: q4
  type: short
  prompt: Name the widely-used framework that gives analysts a shared vocabulary for attack techniques so classifications are consistent across teams.
  accept:
  - MITRE ATT&CK
  - ATT&CK
  - MITRE ATTACK
  points: 1
  explain: MITRE ATT&CK provides a common, consistent vocabulary for classifying attack techniques across analysts and teams.
- id: q5
  type: mcq
  prompt: An evidence bundle contains a known-malware file hash AND a suspicious email attachment. Which best describes correct classification reasoning?
  options:
  - "Classify it as malware, since a file hash is stronger evidence than an email"
  - "Score how many known indicators support each category and communicate which is best-supported, noting remaining uncertainty if any"
  - "Classify it as phishing, since the attachment arrived first"
  - "Report both categories equally and let management decide"
  answer: 1
  points: 1
  explain: "Good classification weighs all the evidence: here both malware and phishing have support (phishing delivered it, the hash says it ran or was present). The analyst reports which is best supported, why, and what is still uncertain, rather than picking one indicator or passing the decision up."
- id: q6
  type: code
  prompt: Implement the attack classifier in problem/ (graded automatically).
  grader: problem
  points: 3
