# Canonical item bank for atom 5.6.c (single source of truth).
# Used by the skill quiz page and the topic's practice questions.
atom: 5.6.c
title: Digital evidence analysis and attack classification
lo:
- 5.6.B
- 5.6.C
items:
- id: q1
  type: mcq
  prompt: A single failed-login spike is observed. What is the analyst's correct next step before declaring it a brute-force attack?
  options:
  - Check the underlying evidence, e.g. is it one source targeting many usernames, or many sources targeting one username?
  - Immediately reset all passwords
  - Ignore it, since one indicator is never worth investigating
  - Delete the log entries
  answer: 0
  points: 1
  explain: An alert is a hypothesis, not a verdict; the analyst must confirm with evidence before concluding the attack type, since the same alert could indicate brute-force or credential stuffing.
- id: q2
  type: multi
  prompt: Select ALL statements that correctly describe an indicator of compromise (IOC).
  options:
  - A single IOC is rarely conclusive proof of a specific attack type by itself
  - Examples include a suspicious IP, a known-malware file hash, or a credential-harvesting URL
  - Attack classification typically requires reasoning about multiple IOCs together
  - An IOC always proves the attacker's exact identity
  answer:
  - 0
  - 1
  - 2
  points: 3
  explain: IOCs are individually weak signals; classification comes from weighing multiple IOCs together, and none of them reveal an attacker's identity by themselves.
- id: q3
  type: mcq
  prompt: Why does chain of custody matter for evidence even outside a courtroom?
  options:
  - It doesn't matter outside a courtroom
  - It is only relevant for network logs
  - It only applies to physical evidence
  - An internal investigation's credibility also depends on being able to show evidence wasn't tampered with
  answer: 3
  points: 1
  explain: Documented chain of custody (who collected/accessed evidence, hash verification) protects the credibility of internal incident reports, not just legal proceedings.
- id: q4
  type: short
  prompt: Name the widely-used framework that gives analysts a shared vocabulary for attack techniques so classifications are consistent across teams.
  accept:
  - MITRE ATT&CK
  - ATT&CK
  - MITRE ATTACK
  points: 1
  explain: MITRE ATT&CK provides a common, consistent vocabulary for classifying attack techniques across analysts and teams.
- id: q5
  type: mcq
  prompt: An evidence bundle contains a known-malware file hash AND a suspicious email attachment. Which best describes correct classification reasoning?
  options:
  - Pick whichever category is listed first alphabetically without looking at the evidence
  - Score how many known indicators support each category and communicate which is best-supported, noting remaining uncertainty if any
  - Always classify as the most severe possible category
  - Ignore one of the two indicators since only one can be correct
  answer: 1
  points: 1
  explain: Mature analysis weighs all evidence, reports the best-supported classification, and honestly communicates any remaining uncertainty rather than discarding conflicting evidence.
- id: q6
  type: code
  prompt: Implement the attack classifier in problem/ (graded automatically).
  grader: problem
  points: 3
