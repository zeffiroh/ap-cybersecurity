# Canonical item bank for atom 5.5.a (single source of truth).
# Used by the skill quiz page and the topic's practice questions.
atom: 5.5.a
title: Input validation and sanitization
lo:
- 5.5.A
items:
- id: q1
  type: mcq
  prompt: Which validation strategy defines exactly what valid input looks like and rejects everything else, rather than trying to enumerate every bad pattern?
  options:
  - Denylist (blocklist)
  - Allowlist (whitelist)
  - Output encoding
  - Canonicalization
  answer: 1
  points: 1
  explain: Allowlisting defines the known-good shape of input and rejects anything that doesn't match; it does not need to anticipate every attack variant.
- id: q2
  type: multi
  prompt: Select ALL statements that correctly describe why client-side (JavaScript) validation is not a security control.
  options:
  - A browser is entirely under the attacker's control, so JavaScript checks can be disabled or bypassed
  - An attacker can send a crafted request directly to the server with a tool like curl, skipping the browser entirely
  - Client-side validation must still be re-enforced on the server for any security-relevant check
  - Client-side validation is cryptographically enforced and cannot be bypassed
  answer:
  - 0
  - 1
  - 2
  points: 3
  explain: Client-side validation only improves UX; because the client is attacker-controlled, every security-relevant check must be re-verified server-side.
- id: q3
  type: mcq
  prompt: An application validates a raw, un-decoded path string before checking it for '../' sequences. Why is this a mistake?
  options:
  - It has no effect on security
  - It makes the application faster
  - An attacker can URL-encode the traversal sequence (e.g. ..%2F) so it slips past the raw-string check, then gets decoded later, this is a canonicalization bypass
  - Only client-side code is affected
  answer: 2
  points: 1
  explain: Validating before canonicalizing (decoding/normalizing) lets encoded or obfuscated payloads bypass the filter; the correct order is decode/normalize first, then validate.
- id: q4
  type: short
  prompt: Name the security concept that transforms data at the point it is inserted into a new context (HTML, SQL, shell) so special characters are treated as literal data, not code.
  accept:
  - output encoding
  - output escaping
  - encoding
  - escaping
  - context-specific encoding
  points: 1
  explain: Output encoding/escaping is applied at each output context, since the correct transformation differs between HTML, SQL, shell, and JSON.
- id: q5
  type: mcq
  prompt: SQL injection, cross-site scripting (XSS), and command injection share what root cause?
  options:
  - They all require physical access to the server
  - The application trusted that input was 'just data' when a downstream interpreter treated part of it as code or control syntax
  - They only affect encrypted connections
  - They are unrelated vulnerability classes with no common cause
  answer: 1
  points: 1
  explain: In all three, unvalidated input reaches an interpreter (SQL engine, browser, shell) that treats some of its characters as executable syntax rather than literal data.
- id: q6
  type: code
  prompt: Implement the field validator in problem/ (graded automatically).
  grader: problem
  points: 3
