# Canonical item bank for atom 5.5.c (single source of truth).
# Used by the skill quiz page and the topic's practice questions.
atom: 5.5.c
title: Application security testing (SAST/DAST)
lo:
- 5.5.B
- 5.5.C
items:
- id: q1
  type: mcq
  prompt: Which testing approach reads an application's source code without executing it?
  options:
  - DAST
  - Fuzzing only
  - Penetration testing
  - SAST
  answer: 3
  points: 1
  explain: SAST (static application security testing) parses source code directly and never runs the program.
- id: q2
  type: multi
  prompt: Select ALL statements that correctly describe the tradeoffs between SAST and DAST.
  options:
  - SAST can run before the code is even merged, giving very early feedback
  - DAST requires a running, reachable instance of the application
  - SAST tends to produce more false positives because it cannot always confirm attacker-controlled input reaches a flagged line
  - DAST can see every code path in the application, including rarely-used admin features
  answer:
  - 0
  - 1
  - 2
  points: 3
  explain: SAST runs early and over-flags because it lacks runtime context; DAST needs a live instance and only sees the paths it actually exercises, not every code path.
- id: q3
  type: mcq
  prompt: A dynamic scanner sends a crafted request to a live login form and observes that it can bypass authentication. What kind of finding is this?
  options:
  - SAST-only, since it's about code logic
  - DAST, since it required interacting with the running application
  - Neither, since automated tools cannot find this
  - A compiler warning
  answer: 1
  points: 1
  explain: DAST tests the running application from the outside, exactly the way this scenario describes.
- id: q4
  type: short
  prompt: Name the kind of security testing that is performed by a skilled human who chains findings together and reasons about business logic flaws automated SAST/DAST tools cannot recognize.
  accept:
  - penetration testing
  - pen testing
  - pentest
  - pentesting
  points: 1
  explain: Penetration testing is human-driven and can reason about business logic in ways automated scanners cannot.
- id: q5
  type: mcq
  prompt: Why do mature CI/CD pipelines typically run BOTH SAST and DAST rather than picking just one?
  options:
  - SAST and DAST are the same tool with different names
  - Running both is required by law in every jurisdiction
  - DAST always finds a superset of what SAST finds
  - They find largely non-overlapping vulnerability classes, so together they give broader coverage
  answer: 3
  points: 1
  explain: SAST sees the code but not runtime behavior; DAST sees runtime behavior but not the code, they complement rather than duplicate each other.
- id: q6
  type: code
  prompt: Implement the miniature SAST rule engine in problem/ (graded automatically).
  grader: problem
  points: 3
