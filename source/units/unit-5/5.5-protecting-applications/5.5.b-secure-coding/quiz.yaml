atom: 5.5.b
title: Secure coding practices
lo:
- 5.5.A
- 5.5.B
items:
- id: q1
  type: mcq
  prompt: Which practice eliminates SQL injection risk regardless of what input validation is or isn't done upstream?
  options:
  - "Parameterized queries"
  - "Escaping single quotes in user input"
  - "Using a web application firewall"
  - "Validating input against an allowlist"
  answer: 0
  points: 1
  explain: "A parameterized query sends the SQL statement and the values separately, so the database never parses user input as SQL, no matter what it contains. Escaping quotes, WAF rules and allowlists all help, but each can be bypassed or misapplied (encodings, odd characters, fields that must allow quotes)."
- id: q2
  type: multi
  prompt: Select ALL reasons secrets (API keys, passwords) should NOT be hardcoded in source code.
  options:
  - They remain visible in version control history forever, even if later removed
  - Rotating a compromised secret requires a code change and redeployment
  - They are automatically encrypted by the version control system
  - Anyone with repository read access can see them
  answer:
  - 0
  - 1
  - 3
  points: 3
  explain: Hardcoded secrets persist in history, require a code change to rotate, and are visible to anyone with repo access; version control does not encrypt file contents.
- id: q3
  type: mcq
  prompt: 'An authentication check throws an unexpected exception. Secure coding says the application should:'
  options:
  - "Retry the check until it succeeds"
  - "Allow access but log a warning for review"
  - "Fall back to a simpler check, such as username only"
  - "Deny access by default (fail securely/fail closed)"
  answer: 3
  points: 1
  explain: "If the code cannot confirm the user is allowed, the safe answer is no. Failing open (allowing on error) turns any crash into a bypass, and attackers deliberately trigger errors to find such paths. Logging is good, but only alongside denial."
- id: q4
  type: short
  prompt: Name the principle that says application processes and database connections should run with only the minimum access they need to function.
  accept:
  - least privilege
  - principle of least privilege
  points: 1
  explain: Least privilege applies to running code and service accounts, not just human user accounts.
- id: q5
  type: mcq
  prompt: Why is pinning and patching third-party dependency versions considered a secure-coding practice, not just a maintenance task?
  options:
  - "A vulnerability in any dependency becomes a vulnerability in the whole application, so unpatched dependencies are unpatched attack surface"
  - "Pinning versions makes the app download faster"
  - "Unpinned dependencies are blocked by most firewalls"
  - "Dependencies run in a sandbox, so only their bugs that crash the app matter"
  answer: 0
  points: 1
  explain: "Your app runs your dependencies' code with your app's permissions, so their bugs are your bugs (Log4Shell in 2021 hit thousands of apps through one logging library). Pinning means you know exactly which versions you ship, and patching means you update them when fixes appear. Dependencies are not sandboxed."
- id: q6
  type: code
  prompt: Implement the secure-coding configuration auditor in problem/ (graded automatically).
  grader: problem
  points: 3
