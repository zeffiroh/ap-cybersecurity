atom: 5.4.c
title: Digital signatures
lo:
- 5.4.B
items:
- id: q1
  type: mcq
  prompt: Bob wants to digitally sign a document so others can verify it came from him. Which key does he sign with, and which key do verifiers use?
  options:
  - Sign with his public key; verify with his private key
  - Sign and verify both use a shared secret key
  - Sign and verify both use his private key
  - Sign with his private key; verify with his public key
  answer: 3
  points: 1
  explain: Only Bob holds his private key, so signing with it is what lets anyone with his public key confirm the signature came from him.
- id: q2
  type: mcq
  prompt: Why do real signature schemes hash the message first instead of running RSA directly on the full message?
  options:
  - Hashing makes the message secret so only the signer can read it
  - It produces a fixed-size input, is much faster than signing large data directly, and avoids structural attacks possible when signing raw messages
  - RSA cannot process any input longer than 256 bits under any circumstance
  - Hashing is required so the signature can later be decrypted back into the original message
  answer: 1
  points: 1
  explain: Hash-then-sign keeps the expensive RSA operation to a single fixed-size digest, which is both faster and avoids algebraic forgery attacks possible when signing arbitrary raw messages directly.
- id: q3
  type: multi
  prompt: A message was signed, and verification against the signer's correct public key returns True. Select ALL guarantees this gives the verifier.
  options:
  - Authenticity, only the private-key holder could have produced this signature
  - Integrity, the message was not altered after signing
  - Confidentiality, no one else could have read the message in transit
  - Non-repudiation, the signer cannot credibly deny having signed it
  answer:
  - 0
  - 1
  - 3
  points: 2
  explain: A valid signature proves authenticity, integrity, and non-repudiation, but not confidentiality, the message itself is not encrypted by the signing process.
- id: q4
  type: short
  prompt: In one sentence, explain why HMAC (5.3.c) cannot provide non-repudiation the way a digital signature can.
  accept:
  - shared secret
  - shared key
  - both parties know the key
  - either party could have produced it
  - symmetric key
  points: 1
  explain: HMAC uses one shared secret key that both parties hold, so a valid tag proves only that 'someone with the key' produced it, either party could have, so neither can be singled out as the signer. A digital signature uses a private key only the signer holds, which removes that ambiguity.
- id: q5
  type: mcq
  prompt: Alice receives a message and a claimed signature. She verifies using Mallory's public key by mistake, and verification succeeds. What does this tell Alice?
  options:
  - Nothing trustworthy about the intended sender, she has only confirmed Mallory's private key produced this signature, not the sender she meant to check
  - The message definitely came from the person she intended and was not tampered with
  - The message was encrypted and only she can read it
  - The signature is invalid and she should reject the message
  answer: 0
  points: 1
  explain: Verification only proves a signature matches whichever public key you check it against. Using the wrong public key means a successful verification tells you nothing about the sender you actually intended to authenticate.
- id: q6
  type: code
  prompt: Implement sign() and verify() in problem/ (graded automatically).
  grader: problem
  points: 3
