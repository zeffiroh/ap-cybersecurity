# Canonical item bank for atom 5.4.d (single source of truth).
# Used by the skill quiz page and the topic's practice questions.
atom: 5.4.d
title: PKI and digital certificates
lo:
- 5.4.B
- 5.4.C
items:
- id: q1
  type: mcq
  prompt: What does a Certificate Authority (CA) actually vouch for when it signs a certificate?
  options:
  - That the subject's public key really belongs to the identity named in the certificate
  - That the website's content is safe and free of malware
  - That the subject's private key is strong enough to resist brute-force attacks
  - That the website will remain online for the full validity period
  answer: 0
  points: 1
  explain: A certificate binds a public key to a claimed identity, verified and signed by the CA. It says nothing about the site's content or safety.
- id: q2
  type: mcq
  prompt: In a certificate chain leaf -> intermediate -> root, how is the leaf certificate's signature verified?
  options:
  - Using the intermediate CA's public key
  - Using the leaf's own public key
  - Using the root CA's public key directly, skipping the intermediate
  - Using a shared secret between the leaf and the browser
  answer: 0
  points: 1
  explain: Each certificate's signature is verified with the public key of whoever issued (signed) it -- for the leaf, that's the intermediate CA.
- id: q3
  type: multi
  prompt: Select ALL statements that are true about root CAs and trust stores.
  options:
  - A root CA's certificate is self-signed (issuer equals subject).
  - A browser trusts a root CA because the root's certificate says so.
  - The set of trusted root public keys is curated by the OS/browser vendor, not derived from the chain itself.
  - Root CAs typically sign end-entity (leaf) certificates directly rather than delegating to intermediates.
  answer:
  - 0
  - 2
  points: 2
  explain: Roots are self-signed, and trust in them comes from being pre-installed in the OS/browser trust store -- never from anything inside the certificate chain itself. Roots typically delegate signing to intermediate CAs rather than signing leaves directly.
- id: q4
  type: short
  prompt: In one or two sentences, explain the difference between certificate expiration and certificate revocation.
  accept:
  - scheduled
  - before the expiration date
  - compromise
  - private key compromise
  - unscheduled
  - crl
  - ocsp
  points: 1
  explain: Expiration is a scheduled, built-in end to a certificate's validity window (not_after). Revocation is an unscheduled, active withdrawal of trust before that date -- typically because the private key was compromised -- checked via a CRL or OCSP.
- id: q5
  type: mcq
  prompt: A server presents a self-signed certificate that is not present in your browser's trust store. The certificate's own signature verifies correctly. What should happen?
  options:
  - Trust it -- a verifying signature is sufficient
  - Trust it, but only for encrypted traffic, not for identity
  - Trust it automatically since it is the root of its own chain
  - Reject it -- no independent third party vouches for the binding, regardless of whether the self-signature verifies
  answer: 3
  points: 1
  explain: A self-signed certificate can have a perfectly valid signature (it signed itself) and still be untrustworthy -- trust requires being anchored in a trust store the client already relies on, not just a passing signature check.
- id: q6
  type: code
  prompt: Implement compute_digest(), rsa_sign(), rsa_verify(), and validate_chain() in problem/ (graded automatically).
  grader: problem
  points: 4
