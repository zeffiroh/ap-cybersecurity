items:
- id: q1
  type: mcq
  prompt: Which formula is the RSA encryption operation?
  options:
  - c = m * e mod n
  - c = m^d mod n
  - c = m^e mod n
  - c = e^m mod n
  answer: 2
  points: 1
  explain: 'Encryption raises the message to the power e (the public exponent) and reduces mod n: c = m^e mod n.'
- id: q2
  type: mcq
  prompt: Given p = 3, q = 11, e = 7, what is the private exponent d?
  options:
  - '7'
  - '3'
  - '13'
  - '20'
  answer: 1
  points: 1
  explain: 'phi(n) = (3-1)(11-1) = 20. d is the modular inverse of 7 mod 20: (7*3) mod 20 = 21 mod 20 = 1, so d = 3.'
- id: q3
  type: multi
  prompt: Using n = 33, e = 7, d = 3 (from p=3, q=11), select ALL true statements.
  options:
  - Encrypting m = 5 gives c = 14
  - Decrypting c = 14 with d = 3 gives back m = 5
  - The message m must satisfy 0 <= m < 33
  - d can be any integer as long as it differs from e
  answer:
  - 0
  - 1
  - 2
  points: 2
  explain: 5^7 mod 33 = 14, and 14^3 mod 33 = 5, confirming the round trip. m must be < n. d is not arbitrary, it must satisfy e*d ≡ 1 (mod phi(n)).
- id: q4
  type: short
  prompt: In one sentence, why is e = 65537 the near-universal choice for the public exponent in real RSA implementations?
  accept:
  - prime
  - fast
  - efficient
  - low-exponent attack
  - 1 bit
  - few bits set
  - small attack
  points: 1
  explain: It is prime (so it is coprime with phi(n) for essentially any p, q), its binary form makes modular exponentiation fast via repeated squaring, and it is large enough to resist low-exponent attacks that break very small e values.
- id: q5
  type: code
  prompt: Implement rsa_keygen(), encrypt(), and decrypt() in problem/ (graded automatically).
  grader: problem
