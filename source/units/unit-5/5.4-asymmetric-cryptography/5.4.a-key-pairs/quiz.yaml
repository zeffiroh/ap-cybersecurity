atom: 5.4.a
title: Public/private key pairs
lo:
- 5.4.A
items:
- id: q1
  type: mcq
  prompt: Alice wants to send Bob a message that only Bob can read. Which key does Alice use to encrypt the message?
  options:
  - Bob's public key
  - Alice's public key
  - Alice's private key
  - Bob's private key
  answer: 0
  points: 1
  explain: Encrypt with the recipient's public key; only the matching private key (held by Bob) can decrypt it.
- id: q2
  type: mcq
  prompt: Bob wants to prove a document came from him. Which key does he use to sign it, and which key does a verifier use to check the signature?
  options:
  - Sign with his public key; verify with his private key
  - Sign with his private key; verify with his public key
  - Sign and verify both use his private key
  - Sign and verify both use his public key
  answer: 1
  points: 1
  explain: Signing uses the private key (only Bob holds it); verification uses the corresponding public key, which anyone can have.
- id: q3
  type: multi
  prompt: Given primes p = 3 and q = 11, select ALL statements that are true about the resulting RSA parameters.
  options:
  - n = p * q = 33
  - phi(n) = (p-1)(q-1) = 20
  - n = 20
  - phi(n) = 33
  answer:
  - 0
  - 1
  points: 2
  explain: n = 3*11 = 33, and phi(n) = (3-1)*(11-1) = 2*10 = 20.
- id: q4
  type: short
  prompt: In one sentence, explain why an attacker cannot derive the private key just by knowing the public key (e, n).
  accept:
  - factor
  - factoring
  - hard to factor
  - cannot factor n
  - computationally infeasible to factor
  points: 1
  explain: Recovering d requires knowing phi(n), which requires factoring n back into p and q, computationally infeasible for large n.
- id: q5
  type: code
  prompt: Implement rsa_params() and is_valid_keypair() in problem/ (graded automatically).
  grader: problem
  points: 3
