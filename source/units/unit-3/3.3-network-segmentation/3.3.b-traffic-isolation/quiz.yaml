atom: 3.3.b
title: Traffic isolation and zero-trust segmentation
lo:
- 3.3.B
- 3.3.C
items:
- id: q1
  type: mcq
  prompt: What is the core paradigm of a Zero Trust Architecture (ZTA)?
  options:
  - Never trust, always verify, regardless of where the connection request originates
  - Implicit trust is granted once a device successfully authenticates to the VPN
  - Trust but verify internal hosts based on their physical network connection
  - Trust all devices connected to the internal Management VLAN
  answer: 0
  points: 1
  explain: Zero Trust assumes that all network traffic is untrusted by default, whether it originates from outside the perimeter or inside the local network. It requires explicit, continuous verification.
- id: q2
  type: multi
  prompt: Which of the following are core practices of a Zero Trust Network Architecture? Select ALL that apply.
  options:
  - Verifying device health and compliance posture before granting resource access
  - Permitting unlimited lateral movement within the server VLAN
  - Using microsegmentation to limit the blast radius of a breach
  - Granting broad access privileges based on physical location in the office
  answer:
  - 0
  - 2
  points: 2
  explain: Zero Trust relies on explicit posture verification and microsegmentation. It removes implicit trust based on network location or physical presence, and blocks unrestricted lateral movement.
- id: q3
  type: mcq
  prompt: In a Private VLAN (PVLAN) setup, what type of port is completely blocked from communicating with any other ports in the same PVLAN, except for promiscuous ports?
  options:
  - Community port
  - Isolated port
  - Trunk port
  - Secondary port
  answer: 1
  points: 1
  explain: Isolated ports in a Private VLAN cannot communicate with other isolated ports or community ports. They can only send and receive traffic from promiscuous ports (typically routers or gateways).
- id: q4
  type: short
  prompt: Name the security technique that applies fine-grained security policies to individual hosts or workloads, treating each device as its own isolated boundary to limit lateral movement.
  accept:
  - microsegmentation
  - micro-segmentation
  - micro segmentation
  points: 1
  explain: Microsegmentation divides the network into fine-grained zones, down to individual hosts or application containers, to prevent unauthorized east-west (lateral) traffic.
- id: q5
  type: code
  prompt: Implement the Zero Trust Access Proxy filter in problem/ (graded automatically).
  grader: problem
  points: 3
