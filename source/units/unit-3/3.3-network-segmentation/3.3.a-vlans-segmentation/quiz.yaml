# Canonical item bank for atom 3.3.a (single source of truth).
# Used by the skill quiz page and the topic's practice questions.
atom: 3.3.a
title: VLANs and network segmentation
lo:
- 3.3.A
items:
- id: q1
  type: mcq
  prompt: A host on VLAN 10 wants to send data to a host on VLAN 20. What device must the traffic pass through?
  options:
  - A hub
  - A router or layer-3 switch
  - Another VLAN-tagged host
  - The same switch port
  answer: 1
  points: 1
  explain: VLANs are separate broadcast domains. Traffic crossing VLANs must pass through a router (inter-VLAN routing) where firewall rules are applied.
- id: q2
  type: multi
  prompt: Which of the following are TRUE about VLANs? Select ALL that apply.
  options:
  - VLANs are logical, not physical, separations
  - A single switch can host multiple VLANs simultaneously
  - VLANs prevent all forms of attack with no additional configuration
  - Broadcast traffic on one VLAN is not visible to hosts on a different VLAN
  answer:
  - 0
  - 1
  - 3
  points: 3
  explain: VLANs are logical, one switch supports many, and broadcasts are confined per VLAN. VLANs alone do not prevent attacks, firewall rules at the routing boundary are also required.
- id: q3
  type: mcq
  prompt: An attacker compromises a guest device on the visitor VLAN. The corporate file server is on the server VLAN. Assuming correct VLAN configuration and restrictive firewall rules, what can the attacker reach from the guest device?
  options:
  - The file server and all other internal servers
  - Only trunk ports
  - Any device on any VLAN because they share the same switch
  - Only devices on the same guest VLAN; the file server is unreachable
  answer: 3
  points: 1
  explain: Segmentation confines the attacker to their VLAN. The file server is in a different VLAN and the router/firewall blocks cross-VLAN access to internal servers from the guest VLAN.
- id: q4
  type: mcq
  prompt: What is the purpose of a trunk port?
  options:
  - To block all VLAN traffic
  - To carry 802.1Q-tagged frames for multiple VLANs on a single physical link
  - To connect an end-user workstation to exactly one VLAN
  - To assign IP addresses to hosts
  answer: 1
  points: 1
  explain: Trunk ports carry frames tagged with VLAN IDs (802.1Q), allowing multiple VLANs to share an uplink between a switch and a router.
- id: q5
  type: short
  prompt: Name the attack technique where an intruder who has compromised one host attempts to reach additional hosts deeper in the network.
  accept:
  - lateral movement
  - lateral
  - pivoting
  - hopping
  points: 1
  explain: Lateral movement (also called pivoting) is the technique of moving from one compromised host to another. Segmentation limits it by requiring the attacker to break through a new access control boundary at each VLAN boundary.
- id: q6
  type: code
  prompt: Implement the VLAN flow filter in problem/ (graded automatically).
  grader: problem
  points: 3
