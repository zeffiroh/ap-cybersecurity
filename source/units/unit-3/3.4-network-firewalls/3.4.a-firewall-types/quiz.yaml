atom: 3.4.a
title: Firewall types (stateful vs. stateless)
lo:
- 3.4.A
items:
- id: q1
  type: mcq
  prompt: A firewall examines each packet independently without remembering previous packets. Which type is this?
  options:
  - Stateful firewall
  - Stateless (packet-filter) firewall
  - Application-layer firewall
  - Intrusion detection system
  answer: 1
  points: 1
  explain: A stateless (packet-filter) firewall evaluates each packet in isolation using only header fields, with no memory of prior packets or connections.
- id: q2
  type: mcq
  prompt: Which data structure does a stateful firewall use to recognize legitimate return traffic?
  options:
  - Routing table
  - ARP cache
  - MAC address table
  - Connection-tracking table
  answer: 3
  points: 1
  explain: The connection-tracking table records active sessions (source/destination IP, ports, protocol, state). Return packets matching an established entry are automatically permitted.
- id: q3
  type: multi
  prompt: Select ALL fields a stateless packet-filter firewall can use in its rules.
  options:
  - Source IP address
  - Destination port number
  - TCP connection state (ESTABLISHED)
  - Protocol (TCP/UDP)
  answer:
  - 0
  - 1
  - 3
  points: 3
  explain: 'Stateless firewalls operate on header fields: source/destination IP, port numbers, and protocol. They cannot inspect TCP connection state because they track no state.'
- id: q4
  type: mcq
  prompt: 'An attacker sends a TCP packet with the ACK flag set, spoofing a session that was never established. A stateful firewall will:'
  options:
  - Forward it because ACK packets are always allowed
  - Drop it because no matching session exists in the connection-tracking table
  - Forward it because the destination port matches a permit rule
  - Drop it because ACK packets are never allowed inbound
  answer: 1
  points: 1
  explain: A stateful firewall checks whether the packet belongs to a tracked session. An ACK for a session not in the table is dropped as an unsolicited or spoofed packet.
- id: q5
  type: short
  prompt: Name the three-packet exchange that a stateful firewall uses to detect the start of a legitimate TCP connection.
  accept:
  - three-way handshake
  - SYN SYN-ACK ACK
  - TCP handshake
  - syn synack ack
  points: 1
  explain: The TCP three-way handshake (SYN, SYN-ACK, ACK) establishes a connection. Stateful firewalls track this sequence to know when a session is legitimately open.
- id: q6
  type: mcq
  prompt: Which scenario BEST justifies using a stateless firewall instead of a stateful one?
  options:
  - High-throughput edge router where simple IP/port rules and raw speed are the priority
  - Protecting an internal database server from spoofed packets
  - Filtering encrypted HTTPS traffic for malware
  - Tracking which users are currently logged in to the network
  answer: 0
  points: 1
  explain: Stateless firewalls excel where raw throughput matters and simple permit/deny rules are sufficient, such as high-speed edge routers. Richer inspection requires stateful or application-layer firewalls.
