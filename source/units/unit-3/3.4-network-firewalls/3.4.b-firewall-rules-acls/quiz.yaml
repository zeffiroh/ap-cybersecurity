atom: 3.4.b
title: Firewall rules and access control lists (ACLs)
lo:
- 3.4.B
- 3.4.C
items:
- id: q1
  type: mcq
  prompt: A firewall ACL evaluates a packet against its rule list. Which rule's action is applied?
  options:
  - The last rule that matches
  - The rule with the most specific source address
  - All matching rules, combined
  - The first rule (top to bottom) that matches
  answer: 3
  points: 1
  explain: 'ACLs use first-match-wins: evaluation stops at the first rule whose conditions match the packet, regardless of any later rules that might also match.'
- id: q2
  type: mcq
  prompt: A packet reaches the bottom of an ACL without matching any explicit rule. What happens?
  options:
  - It is allowed by default
  - The firewall crashes
  - It is dropped by the implicit deny
  - It is queued for manual review
  answer: 2
  points: 1
  explain: A well-formed ACL ends with an implicit (or explicit) deny-all rule. Unmatched traffic is dropped by default.
- id: q3
  type: multi
  prompt: Select ALL fields a typical ACL rule matches on.
  options:
  - Source IP/subnet
  - Destination port
  - Protocol (TCP/UDP)
  - The packet's payload text
  answer:
  - 0
  - 1
  - 2
  points: 3
  explain: 'ACL rules match header fields: source, destination, port, and protocol. Inspecting payload content is beyond a basic ACL (that is application-layer inspection).'
- id: q4
  type: mcq
  prompt: An admin places 'allow TCP any any port 22' as rule 1, then 'deny TCP 203.0.113.0 to 10.0.1.10 port 22' as rule 4. What happens to traffic from 203.0.113.0 to port 22?
  options:
  - It is denied, because rule 4 is more specific
  - The firewall evaluates both rules and denies since deny takes priority
  - It is allowed, because rule 1 matches first and rule 4 is shadowed
  - It depends on which rule was written most recently
  answer: 2
  points: 1
  explain: Rule 1 is broader and matches first, so its allow action applies. Rule 4 is unreachable (shadowed) for that traffic, specificity does not override rule order.
- id: q5
  type: short
  prompt: Name the anomaly where a broad rule earlier in an ACL makes a more specific rule below it unreachable.
  accept:
  - shadowing
  - rule shadowing
  - shadowed rule
  points: 1
  explain: 'Rule shadowing: an earlier, broader-matching rule prevents a later, more specific rule from ever being evaluated.'
- id: q6
  type: mcq
  prompt: What is the safest general pattern for ordering ACL rules?
  options:
  - Broadest allow rules first, specific denies last
  - Alphabetical order by source IP
  - Most specific rules (denies/exceptions) first, general allows next, implicit deny-all last
  - Order does not matter if the rule set is small
  answer: 2
  points: 1
  explain: Placing specific exceptions and denies before general allow rules prevents shadowing and keeps the default-deny posture intact.
- id: q7
  type: code
  prompt: Implement the ACL evaluator in problem/ (graded automatically by tests.py).
  grader: problem
  points: 3
