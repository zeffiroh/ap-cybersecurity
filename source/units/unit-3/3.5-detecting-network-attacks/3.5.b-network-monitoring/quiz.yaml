# Canonical item bank for atom 3.5.b (single source of truth).
# Used by the skill quiz page and the topic's practice questions.
atom: 3.5.b
title: Network monitoring and traffic analysis
lo:
- 3.5.B
items:
- id: q1
  type: mcq
  prompt: Which data source summarizes a conversation (endpoints, ports, protocol, byte counts) WITHOUT storing packet payload?
  options:
  - A flow record (NetFlow)
  - Full packet capture (pcap)
  - A signature database
  - A connection-tracking table
  answer: 0
  points: 1
  explain: Flow records summarize a conversation's metadata without payload, making them far cheaper to store and query at scale than full packet capture.
- id: q2
  type: mcq
  prompt: 'A host normally sends a few MB per day and suddenly uploads several GB to an external server overnight. This is a classic indicator of:'
  options:
  - Beaconing
  - Rule shadowing
  - Data exfiltration
  - A false positive
  answer: 2
  points: 1
  explain: An abnormal spike in outbound data volume, especially to an external destination, is a strong exfiltration indicator, volume alone is the signal, no payload inspection required.
- id: q3
  type: mcq
  prompt: 'Malware checking in with a command-and-control server at exact 60-second intervals is exhibiting:'
  options:
  - Baselining
  - Beaconing
  - Rule shadowing
  - A true negative
  answer: 1
  points: 1
  explain: Regular, machine-precise timing (as opposed to irregular human-driven traffic) is the hallmark of beaconing malware.
- id: q4
  type: multi
  prompt: Select ALL indicators that traffic analysis (not signature matching) is well suited to catch.
  options:
  - Unusual destination port for a host
  - A known malware file hash
  - A data-volume spike outside business hours
  - Beaconing at regular intervals
  answer:
  - 0
  - 2
  - 3
  points: 3
  explain: Port anomalies, volume spikes, and beaconing are all traffic-pattern indicators. A known file hash match is signature-based detection, not traffic analysis.
- id: q5
  type: short
  prompt: Name the process of recording a host's typical traffic pattern (volume, ports, timing) so deviations can later be detected.
  accept:
  - baselining
  - baseline
  - establishing a baseline
  points: 1
  explain: Baselining establishes the 'normal' profile that anomaly detection compares current traffic against.
- id: q6
  type: mcq
  prompt: Why do most enterprise monitoring pipelines rely on flow records rather than full packet capture for day-to-day analysis?
  options:
  - Flow records are more secure than packet captures
  - Flow records are far cheaper to store and query at scale
  - Packet capture cannot see TCP ports
  - Flow records include the full payload, which is more useful
  answer: 1
  points: 1
  explain: Full packet capture is precise but storage- and search-expensive at scale; flow records trade payload detail for cost efficiency, which suits continuous monitoring.
- id: q7
  type: code
  prompt: Implement the traffic-anomaly detector in problem/ (graded automatically by tests.py).
  grader: problem
  points: 3
