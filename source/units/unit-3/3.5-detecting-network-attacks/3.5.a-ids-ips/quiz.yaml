# Canonical item bank for atom 3.5.a (single source of truth).
# Used by the skill quiz page and the topic's practice questions.
atom: 3.5.a
title: Intrusion detection and prevention systems (IDS/IPS)
lo:
- 3.5.A
items:
- id: q1
  type: mcq
  prompt: 'An IDS raises an alert on a packet that turns out to be a legitimate network scanner run by the IT team. This outcome is called a:'
  options:
  - True positive
  - False positive
  - False negative
  - True negative
  answer: 1
  points: 1
  explain: The sensor fired (positive) but the traffic was benign (false). That is a false positive, wasted analyst effort but no missed attack.
- id: q2
  type: mcq
  prompt: Which statement BEST distinguishes an IPS from an IDS?
  options:
  - An IPS uses anomaly detection; an IDS uses signatures.
  - An IDS monitors host logs; an IPS monitors network traffic.
  - An IPS can drop malicious packets in real time; an IDS only generates alerts.
  - An IPS is deployed outside the firewall; an IDS is deployed inside.
  answer: 2
  points: 1
  explain: 'The defining difference is action: IDS is passive (alerts only); IPS is inline and can block traffic before it reaches the target.'
- id: q3
  type: multi
  prompt: Select ALL true statements about signature-based detection.
  options:
  - It can detect zero-day exploits that have no known signature.
  - It requires the signature database to be kept current.
  - It matches traffic against patterns of known attacks.
  - It typically has a lower false-positive rate than anomaly detection for known attacks.
  answer:
  - 1
  - 2
  - 3
  points: 3
  explain: Signatures must be updated (1), work by pattern matching (2), and are precise for known attacks (3). Zero-days have no signature, so option 0 is false.
- id: q4
  type: mcq
  prompt: 'A real attack passes through the IDS without triggering any alert. This is called a:'
  options:
  - False negative
  - False positive
  - True negative
  - True positive
  answer: 0
  points: 1
  explain: The sensor said benign (negative) but the traffic was an attack (false), a false negative, the most dangerous outcome.
- id: q5
  type: short
  prompt: Name the detection method that builds a behavioral baseline of normal activity and alerts on deviations, even for attacks with no known signature.
  accept:
  - anomaly
  - anomaly-based
  - anomaly based
  - behavior
  - behavioral
  - heuristic
  points: 1
  explain: Anomaly-based (behavioral) detection learns a normal baseline and flags statistical deviations, making it capable of catching novel attacks.
- id: q6
  type: code
  prompt: Implement the IDS signature matcher in problem/ (graded automatically by tests.py).
  grader: problem
  points: 3
