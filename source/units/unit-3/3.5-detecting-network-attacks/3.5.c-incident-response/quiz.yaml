# Canonical item bank for atom 3.5.c (single source of truth).
# Used by the skill quiz page and the topic's practice questions.
atom: 3.5.c
title: Incident response sequence
lo:
- 3.5.C
items:
- id: q1
  type: mcq
  prompt: Which NIST SP 800-61 phase involves isolating an infected host from the network WITHOUT yet removing the malware?
  options:
  - Identification
  - Eradication
  - Containment
  - Recovery
  answer: 2
  points: 1
  explain: Containment stops the incident from spreading (e.g., isolating a host) before the root cause is removed in Eradication.
- id: q2
  type: mcq
  prompt: 'Put in order: which phase comes immediately AFTER Containment?'
  options:
  - Eradication
  - Identification
  - Preparation
  - Lessons Learned
  answer: 0
  points: 1
  explain: The canonical order is Preparation, Identification, Containment, Eradication, Recovery, Lessons Learned, Eradication follows Containment.
- id: q3
  type: multi
  prompt: Select ALL reasons eradicating malware BEFORE containment is a mistake.
  options:
  - It can tip off the attacker before the host is isolated
  - The host may be immediately reinfected from another compromised host on the same network
  - It skips the Preparation phase entirely
  - It removes the root cause before the spread is stopped
  answer:
  - 0
  - 1
  - 3
  points: 3
  explain: Eradicating before containing risks tipping off the attacker, reinfection from the still-connected network, and generally removes the cause before the spread is controlled. It has nothing to do with skipping Preparation.
- id: q4
  type: mcq
  prompt: A team documents a full incident timeline and updates its response plan afterward. Which phase is this?
  options:
  - Lessons Learned
  - Eradication
  - Recovery
  - Identification
  answer: 0
  points: 1
  explain: 'Lessons Learned (Post-Incident Activity) is the closing phase: documenting what happened and updating the plan/tools/training.'
- id: q5
  type: short
  prompt: Name the NIST publication that defines the six-phase incident response lifecycle used in this course.
  accept:
  - nist sp 800-61
  - 800-61
  - sp 800-61
  - nist 800-61
  points: 1
  explain: NIST Special Publication 800-61, 'Computer Security Incident Handling Guide,' defines the standard IR lifecycle.
- id: q6
  type: mcq
  prompt: Which phase happens continuously BEFORE any incident occurs, and includes writing the IR plan and running tabletop exercises?
  options:
  - Identification
  - Preparation
  - Containment
  - Recovery
  answer: 1
  points: 1
  explain: Preparation is ongoing readiness work done before any incident, plans, roles, tooling, and rehearsal.
- id: q7
  type: code
  prompt: Implement the incident-response phase sorter in problem/ (graded automatically by tests.py).
  grader: problem
  points: 3
