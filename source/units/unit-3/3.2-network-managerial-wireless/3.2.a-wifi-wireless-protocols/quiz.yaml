# Canonical item bank for atom 3.2.a (single source of truth).
# Used by the skill quiz page and the topic's practice questions.
atom: 3.2.a
title: Wi-Fi basics and wireless security protocols (WPA2/WPA3)
lo:
- 3.2.A
items:
- id: q1
  type: mcq
  prompt: Which cipher suite does WPA2 use to provide both confidentiality and data integrity?
  options:
  - RC4-TKIP
  - AES-CCMP
  - DES-CBC
  - 3DES-ECB
  answer: 1
  points: 1
  explain: WPA2 uses AES in Counter Mode with CBC-MAC (CCMP), replacing the broken RC4-based WEP and TKIP.
- id: q2
  type: mcq
  prompt: What is the primary security advantage of WPA3-SAE over WPA2-PSK?
  options:
  - "WPA3-SAE prevents offline dictionary attacks against captured handshakes"
  - "WPA3 requires passwords of at least 20 characters"
  - "WPA3 hides the network name from scanners"
  - "WPA3 encrypts traffic with WEP for backward compatibility"
  answer: 0
  points: 1
  explain: "With WPA2-PSK, an attacker who captures the 4-way handshake can guess passwords offline, as fast as their hardware allows. WPA3's SAE (Dragonfly) handshake forces every guess to be an interactive attempt against the access point, so offline cracking does not work. It does not change password length rules or hide the SSID, and WEP is long broken."
- id: q3
  type: mcq
  prompt: A student says 'I hid my SSID so attackers cannot find my network.' What is wrong with this reasoning?
  options:
  - "Nothing; a hidden SSID is a strong control on its own"
  - "Hidden networks are illegal to operate in most countries"
  - "Hidden SSIDs still appear in probe responses and any passive scanner reveals them"
  - "Hiding the SSID turns off WPA2 encryption"
  answer: 2
  points: 1
  explain: "A hidden network still transmits; devices that know it shout its name in probe requests wherever they go, and the access point answers. Any passive scanner recovers the name within seconds. It is obscurity, not security, and can even make client devices leak the name in public. Encryption is unaffected."
- id: q4
  type: multi
  prompt: Select ALL configuration choices that represent best practice for a school Wi-Fi network.
  options:
  - Use WPA2-AES or WPA3 for the student SSID
  - Use WEP for legacy device compatibility
  - Isolate guest devices on a separate VLAN
  - Keep AP firmware updated to patch protocol vulnerabilities
  answer:
  - 0
  - 2
  - 3
  points: 3
  explain: WPA2-AES/WPA3, VLAN isolation, and firmware updates are best practice. WEP is completely broken and must not be used.
- id: q5
  type: mcq
  prompt: Which WPA2 mode requires individual credentials via a RADIUS server and is preferred for corporate environments?
  options:
  - WPA2-PSK (Personal)
  - WPA2-OWE
  - WPA2-TKIP
  - WPA2-EAP (Enterprise)
  answer: 3
  points: 1
  explain: WPA2-Enterprise uses 802.1X and a RADIUS server so each user or device has individual credentials and accountability.
- id: q6
  type: short
  prompt: Name the WPA3 property that ensures compromising today's session key cannot decrypt previously captured sessions.
  accept:
  - forward secrecy
  - perfect forward secrecy
  - pfs
  - forward secret
  points: 1
  explain: Forward secrecy ensures each session derives fresh keys; past captured sessions remain protected even if the current key is exposed.
- id: q7
  type: code
  prompt: Implement the Wi-Fi configuration evaluator in problem/ (graded automatically).
  grader: problem
  points: 3
