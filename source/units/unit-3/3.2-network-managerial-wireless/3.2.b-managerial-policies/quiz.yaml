atom: 3.2.b
title: Managerial controls and security policies
lo:
- 3.2.A
- 3.2.B
items:
- id: q1
  type: mcq
  prompt: What distinguishes a managerial (administrative) control from a technical control?
  options:
  - Managerial controls are policies/procedures enforced through training and process, not automatically by hardware or software
  - Managerial controls are always more expensive
  - Managerial controls only apply to physical security
  - There is no meaningful difference
  answer: 0
  points: 1
  explain: Managerial controls are documented policies and processes governing human behavior, backed by training and review, rather than something enforced automatically by a technical mechanism.
- id: q2
  type: mcq
  prompt: An organization requires new employees to sign a document defining permitted and prohibited use of company systems. What is this document called?
  options:
  - Firewall configuration
  - Acceptable Use Policy (AUP)
  - Access control list
  - Badge access log
  answer: 1
  points: 1
  explain: An Acceptable Use Policy (AUP) defines what employees are and are not permitted to do with organizational systems and data.
- id: q3
  type: multi
  prompt: Which of the following are examples of managerial controls? Select ALL that apply.
  options:
  - A documented least-privilege access review process
  - A locked server room door
  - Annual security awareness training
  - A firewall rule blocking a malicious IP
  answer:
  - 0
  - 2
  points: 2
  explain: A documented access-review process and awareness training are both policy/process-driven managerial controls. The locked door is a physical control, and the firewall rule is a technical control.
- id: q4
  type: mcq
  prompt: Why is 'privilege creep' a problem that a least-privilege policy specifically addresses?
  options:
  - It refers to accounts gradually accumulating unnecessary access rights over time without review
  - It refers to passwords getting weaker over time
  - It only affects physical badge access, not digital accounts
  - It is a technical vulnerability in firewalls
  answer: 0
  points: 1
  explain: Privilege creep happens when access rights accumulate as employees change roles without being revoked; a documented least-privilege review policy catches and corrects this over time.
- id: q5
  type: short
  prompt: Name the recurring managerial control that teaches employees to recognize social engineering and follow security policy, often including simulated phishing emails.
  accept:
  - security awareness training
  - awareness training
  - security training
  points: 1
  explain: Security awareness training is a recurring program (often annual, with phishing simulations) that changes employee behavior through education and reinforcement.
- id: q6
  type: mcq
  prompt: A badge reader that requires a PIN and physical badge to open a data center door, is this a technical or physical control?
  options:
  - Physical, it restricts physical access to a space, regardless of using electronic components
  - Technical, anything involving electronics is automatically technical
  - Managerial, it requires an employee to remember a PIN
  - None of the above
  answer: 0
  points: 1
  explain: Classification depends on what the control restricts (physical access to a space), not on whether it involves electronic components, this is a physical control.
- id: q7
  type: code
  prompt: Implement the control-type classifier in problem/ (graded automatically).
  grader: problem
