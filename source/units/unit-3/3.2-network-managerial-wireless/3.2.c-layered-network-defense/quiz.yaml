atom: 3.2.c
title: Layered network defense overview
lo:
- 3.2.B
- 3.2.C
items:
- id: q1
  type: mcq
  prompt: What is the core justification for defense in depth (layered defense)?
  options:
  - It is required by law in every jurisdiction
  - It reduces the total number of controls an organization needs
  - Every individual control has weaknesses or can be misconfigured, so no single control should be relied on alone
  - It guarantees an attacker can never succeed
  answer: 2
  points: 1
  explain: Because every control has known or undiscovered weaknesses, or can be misconfigured, defense in depth ensures a single failure does not cause a full compromise.
- id: q2
  type: mcq
  prompt: Endpoint antivirus/EDR software installed on individual employee laptops belongs to which defense-in-depth layer?
  options:
  - Perimeter
  - Human
  - Data
  - Host
  answer: 3
  points: 1
  explain: Host-layer controls protect the individual device itself, assuming outer layers (perimeter, network) may fail.
- id: q3
  type: multi
  prompt: Which of the following are examples of network-layer controls (as distinct from perimeter or host)? Select ALL that apply.
  options:
  - VLAN segmentation separating departments
  - WPA3 wireless security protocol
  - A border firewall at the internet gateway
  - Full-disk encryption on a laptop
  answer:
  - 0
  - 1
  points: 2
  explain: VLAN segmentation and WPA3 both operate inside the internal network to limit lateral movement and secure the wireless segment. The border firewall is perimeter-layer, and full-disk encryption is data-layer.
- id: q4
  type: mcq
  prompt: Why does the human/managerial layer 'span' all the other layers rather than sitting at one specific point?
  options:
  - It only applies to physical security
  - It only matters during an active breach
  - It replaces the need for any technical controls
  - It keeps every technical layer correctly configured, monitored, and improved, and catches what automated controls miss
  answer: 3
  points: 1
  explain: Policy, training, and process (the human/managerial layer) reinforce and maintain every technical layer, and often catch things automated tools miss, such as an employee reporting a phishing email.
- id: q5
  type: short
  prompt: Name the layer that protects data itself (e.g., via encryption) regardless of which device or network segment it is currently on.
  accept:
  - data layer
  - data
  points: 1
  explain: The data layer is the innermost layer, even if every outer layer fails, strong data-layer controls like encryption can still prevent stolen data from being usable.
- id: q6
  type: mcq
  prompt: An organization deploys only a single, very strong perimeter firewall and no other controls. What is the main risk of this approach?
  options:
  - None, a strong enough single control is always sufficient
  - Firewalls are technically incapable of stopping any attacks
  - Different attack vectors (e.g., ARP spoofing on the internal network, phishing) bypass the perimeter entirely, so a single control leaves other layers completely undefended
  - It costs more than layered defenses
  answer: 2
  points: 1
  explain: A single control, however strong, only addresses the attack vectors it specifically covers; other vectors (internal MITM, social engineering, compromised devices) require controls at other layers entirely.
- id: q7
  type: code
  prompt: Implement the defense-in-depth layer classifier in problem/ (graded automatically).
  grader: problem
  points: 3
