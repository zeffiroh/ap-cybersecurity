# Canonical item bank for atom 3.2.c (single source of truth).
# Used by the skill quiz page and the topic's practice questions.
atom: 3.2.c
title: Layered network defense overview
lo:
- 3.2.B
- 3.2.C
items:
- id: q1
  type: mcq
  prompt: What is the core justification for defense in depth (layered defense)?
  options:
  - "Using many vendors means at least one product will be good"
  - "Layers let each control be configured more loosely, since others will catch mistakes"
  - "Every individual control has weaknesses or can be misconfigured, so no single control should be relied on alone"
  - "Attackers give up after the first layer, so layering mostly adds deterrence"
  answer: 2
  points: 1
  explain: "Any single control can fail, be bypassed, or be misconfigured, so independent layers mean one failure does not lead straight to a breach. Layering is not an excuse to weaken each layer, and determined attackers do not stop at the first one. Vendor diversity can help but is not the core idea."
- id: q2
  type: mcq
  prompt: Endpoint antivirus/EDR software installed on individual employee laptops belongs to which defense-in-depth layer?
  options:
  - Perimeter
  - Human
  - Data
  - Host
  answer: 3
  points: 1
  explain: Host-layer controls protect the individual device itself, assuming outer layers (perimeter, network) may fail.
- id: q3
  type: multi
  prompt: Which of the following are examples of network-layer controls (as distinct from perimeter or host)? Select ALL that apply.
  options:
  - VLAN segmentation separating departments
  - WPA3 wireless security protocol
  - A border firewall at the internet gateway
  - Full-disk encryption on a laptop
  answer:
  - 0
  - 1
  points: 2
  explain: VLAN segmentation and WPA3 both operate inside the internal network to limit lateral movement and secure the wireless segment. The border firewall is perimeter-layer, and full-disk encryption is data-layer.
- id: q4
  type: mcq
  prompt: Why does the human/managerial layer 'span' all the other layers rather than sitting at one specific point?
  options:
  - "Because training is the cheapest layer, so it is applied everywhere"
  - "Because only humans can make policy, so it sits above the technical layers"
  - "Because human error only happens at the perimeter"
  - "It keeps every technical layer correctly configured, monitored, and improved, and catches what automated controls miss"
  answer: 3
  points: 1
  explain: "Every technical layer is configured, reviewed and responded to by people, and people also face attacks directly (phishing). So policies, training and procedures affect the perimeter, network, host and data layers alike. Human error can happen at any layer, not just the edge."
- id: q5
  type: short
  prompt: Name the layer that protects data itself (e.g., via encryption) regardless of which device or network segment it is currently on.
  accept:
  - data layer
  - data
  points: 1
  explain: The data layer is the innermost layer, even if every outer layer fails, strong data-layer controls like encryption can still prevent stolen data from being usable.
- id: q6
  type: mcq
  prompt: An organization deploys only a single, very strong perimeter firewall and no other controls. What is the main risk of this approach?
  options:
  - "Internal traffic is slower when it passes through a strong firewall"
  - "Strong firewalls generate too many false positives to be useful"
  - "Different attack vectors (e.g., ARP spoofing on the internal network, phishing) bypass the perimeter entirely, so a single control leaves other layers completely unprotected"
  - "A single firewall cannot inspect encrypted traffic, so it blocks nothing"
  answer: 2
  points: 1
  explain: "A perimeter firewall only sees traffic crossing the perimeter. Phishing delivered through allowed email, a malicious insider, or an attacker already inside doing ARP spoofing never meets it. Without host, network and human layers, one bypass leaves everything exposed. Firewalls do block plenty; the issue is coverage, not strength."
- id: q7
  type: code
  prompt: Implement the defense-in-depth layer classifier in problem/ (graded automatically).
  grader: problem
  points: 3
