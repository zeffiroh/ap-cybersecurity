atom: 3.1.a
title: TCP/IP fundamentals and network topology flaws
lo:
- 3.1.A
items:
- id: q1
  type: mcq
  prompt: Which TCP/IP layer is responsible for routing packets between networks using IP addresses?
  options:
  - Application layer
  - Transport layer
  - Internet layer
  - Network access layer
  answer: 2
  points: 1
  explain: The internet layer (IP) assigns addresses and routes packets between networks. The transport layer manages ports and reliability; the network access layer handles local delivery using MAC addresses.
- id: q2
  type: multi
  prompt: Which of the following are structural weaknesses built into TCP/IP that attackers exploit? Select ALL that apply.
  options:
  - IP addresses are not authenticated
  - DNS caches can accept forged replies
  - TCP uses encrypted sequence numbers by default
  - ARP operates on trust with no authentication
  answer:
  - 0
  - 1
  - 3
  points: 3
  explain: IP has no source-address verification (spoofing), DNS caches forgeable replies (poisoning), and ARP trusts any reply broadcast (ARP spoofing). TCP sequence numbers are NOT encrypted by default, that is a weakness, not a safeguard.
- id: q3
  type: mcq
  prompt: An attacker floods a switch with thousands of fake MAC addresses until it begins broadcasting all frames to every port. What attack is this?
  options:
  - MAC flooding
  - IP spoofing
  - ARP poisoning
  - DNS spoofing
  answer: 0
  points: 1
  explain: MAC flooding exhausts the switch's CAM table, forcing it to broadcast like a hub, enabling passive sniffing of all frames.
- id: q4
  type: short
  prompt: What network design practice limits how far an attacker can move laterally after compromising a single internal host?
  accept:
  - segmentation
  - network segmentation
  - vlan
  - subnetting
  - subnet
  points: 1
  explain: Network segmentation (VLANs, subnets with controlled routing) contains a breach to one zone, preventing a compromised host from reaching all others.
- id: q5
  type: mcq
  prompt: During a TCP three-way handshake, what is the correct order of messages?
  options:
  - ACK, SYN, SYN-ACK
  - SYN, ACK, SYN-ACK
  - SYN-ACK, SYN, ACK
  - SYN, SYN-ACK, ACK
  answer: 3
  points: 1
  explain: The client sends SYN, the server replies SYN-ACK, the client completes with ACK. Early implementations used predictable sequence numbers, enabling session hijacking.
- id: q6
  type: mcq
  prompt: Which layer of the TCP/IP stack does IP spoofing primarily target?
  options:
  - Application layer
  - Transport layer
  - Internet layer
  - Network access layer
  answer: 2
  points: 1
  explain: IP spoofing forges the source address field in the IP header, which lives at the internet layer. Defenses (ingress filtering) also operate at this layer.
- id: q7
  type: code
  prompt: Implement the IP spoofing detector in problem/ (graded automatically).
  grader: problem
