# Canonical item bank for atom 3.1.c (single source of truth).
# Used by the skill quiz page and the topic's practice questions.
atom: 3.1.c
title: Man-in-the-middle and ARP spoofing
lo:
- 3.1.B
items:
- id: q1
  type: mcq
  prompt: Why does ARP allow spoofing so easily?
  options:
  - ARP requires a password for every reply
  - ARP replies must be digitally signed by the gateway
  - ARP only works over encrypted channels
  - ARP has no built-in authentication, so any device can send a reply and it will be trusted
  answer: 3
  points: 1
  explain: ARP was designed for a small trusted network in 1982 and has no cryptographic authentication, any host can send a reply (even unsolicited) and receiving hosts will update their ARP table.
- id: q2
  type: mcq
  prompt: An attacker wants to intercept all of a victim's internet-bound traffic on a LAN using ARP spoofing. Which two devices' ARP tables does the attacker typically poison?
  options:
  - Two random unrelated hosts on the network
  - The victim's and the default gateway's
  - Only the DNS server's
  - Only the victim's web browser cache
  answer: 1
  points: 1
  explain: To intercept traffic between the victim and the internet, the attacker poisons the victim's ARP table (to point 'gateway' at the attacker) and the gateway's ARP table (to point 'victim' at the attacker), placing itself in the middle of that path.
- id: q3
  type: multi
  prompt: Which of the following are effective technical controls against ARP spoofing? Select ALL that apply.
  options:
  - Dynamic ARP Inspection (DAI) on switches
  - Static ARP entries for critical hosts like the gateway
  - Renaming the Wi-Fi network's SSID
  - Network segmentation with VLANs
  answer:
  - 0
  - 1
  - 3
  points: 2
  explain: DAI validates ARP against a trusted binding table, static entries prevent the OS from accepting a forged update for a specific IP, and VLAN segmentation limits which hosts share a broadcast domain (and thus can spoof each other). Renaming an SSID has no effect on ARP spoofing.
- id: q4
  type: mcq
  prompt: Does HTTPS fully prevent damage from a successful ARP-spoofing man-in-the-middle position?
  options:
  - Yes, HTTPS makes MITM positioning impossible
  - No, HTTPS provides no protection at all against MITM
  - No, HTTPS protects the confidentiality/integrity of the payload, but the attacker can still see which servers are contacted and can attempt downgrade or certificate-warning attacks
  - Yes, once ARP is poisoned, HTTPS automatically re-routes traffic safely
  answer: 2
  points: 1
  explain: HTTPS does not stop the attacker from occupying the MITM position via ARP spoofing; it limits what the attacker can do with that position (cannot read/alter the encrypted payload without detection), but metadata like destination server and connection timing remain visible, and downgrade/certificate attacks are still possible against unwary users.
- id: q5
  type: short
  prompt: Name the switch-level feature that validates ARP packets against a trusted IP-to-MAC binding table and drops forged ones.
  accept:
  - dynamic arp inspection
  - dai
  points: 1
  explain: Dynamic ARP Inspection (DAI) uses a trusted binding table (often built from DHCP snooping records) to validate and drop ARP packets that don't match a legitimate binding.
- id: q6
  type: mcq
  prompt: An ARP-watch tool observes IP 192.168.1.1 first bound to MAC aa:11, then 40 seconds later sees a reply claiming 192.168.1.1 is at MAC bb:22. How should this be classified?
  options:
  - SPOOFED, a different MAC now claims an IP that was already bound to a different MAC
  - LEGIT, ARP bindings change routinely
  - Cannot be determined without a packet capture
  - LEGIT, only DNS bindings can be spoofed, not ARP
  answer: 0
  points: 1
  explain: A second, different MAC claiming an already-bound IP is exactly the ARP spoofing signature that arpwatch-style tools flag.
- id: q7
  type: code
  prompt: Implement the ARP spoofing detector in problem/ (graded automatically).
  grader: problem
  points: 3
