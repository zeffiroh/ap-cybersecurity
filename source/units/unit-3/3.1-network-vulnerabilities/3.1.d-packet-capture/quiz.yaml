# Canonical item bank for atom 3.1.d (single source of truth).
# Used by the skill quiz page and the topic's practice questions.
atom: 3.1.d
title: Packet capture and traffic sniffing
lo:
- 3.1.B
- 3.1.C
items:
- id: q1
  type: mcq
  prompt: What NIC setting must a capture tool typically use to see traffic not addressed to its own MAC address?
  options:
  - DHCP mode
  - Airplane mode
  - Promiscuous mode
  - Bridge mode
  answer: 2
  points: 1
  explain: Promiscuous mode tells the network stack to accept and process every frame the NIC physically receives, not just frames addressed to its own MAC, necessary for a capture tool to see traffic beyond its own.
- id: q2
  type: mcq
  prompt: What is the difference between a capture filter and a display filter in a tool like Wireshark?
  options:
  - "A capture filter hides packets on screen, while a display filter deletes them from the file"
  - "A capture filter determines what is recorded at all; a display filter narrows the view of what was already captured"
  - "Display filters run on the network card, while capture filters run in Wireshark"
  - "Capture filters can match payload text, while display filters can only match addresses"
  answer: 1
  points: 1
  explain: "Capture filters decide what gets saved in the first place (anything filtered out is gone for good), so they keep files small but risk missing evidence. Display filters only hide packets from view, and you can change them at any time without losing data. That is why analysts often capture broadly and filter the display."
- id: q3
  type: multi
  prompt: Which of the following protocols send credentials in plaintext, making them fully readable in a packet capture? Select ALL that apply.
  options:
  - Telnet
  - HTTPS
  - FTP (control channel)
  - SSH
  answer:
  - 0
  - 2
  points: 2
  explain: Telnet and FTP's control channel send authentication data in cleartext. HTTPS and SSH both encrypt the connection, so credentials are not readable in a capture.
- id: q4
  type: mcq
  prompt: On a fully switched (non-hub) network, which technique lets an attacker still see another host's traffic without physical access to a SPAN port?
  options:
  - Renaming their hostname
  - Simply plugging into any switch port
  - Changing their own IP address
  - ARP spoofing to redirect the victim's traffic through the attacker's machine
  answer: 3
  points: 1
  explain: A switch normally isolates traffic to the correct destination port; ARP spoofing (3.1.c) tricks two hosts into routing traffic through the attacker, restoring visibility that switching would otherwise prevent.
- id: q5
  type: short
  prompt: Name the legitimate switch feature, intended for monitoring tools, that copies traffic from one or more ports to a monitoring port, and which becomes a risk if granted to the wrong party.
  accept:
  - port mirroring
  - span port
  - span
  - mirror port
  points: 1
  explain: Port mirroring (a SPAN port) duplicates traffic to a monitoring port for legitimate analysis; if misconfigured or given to an unauthorized party, it enables unauthorized sniffing.
- id: q6
  type: mcq
  prompt: A capture log entry shows TCP port 443 traffic to a banking site with payload described only as encrypted binary data. What should an analyst conclude?
  options:
  - "No credential can be extracted from this capture because TLS encrypts the payload"
  - "The credential can be recovered by converting the binary payload to text"
  - "The capture proves the site is safe, because the traffic is encrypted"
  - "The analyst should look at the TCP header, where TLS stores the username"
  answer: 0
  points: 1
  explain: "TLS encrypts the application data, so the password is unreadable without the session keys. The capture still shows metadata (IP addresses, ports, the server name in the handshake, timing and sizes). Encryption says nothing about whether the site itself is legitimate; a phishing site can use HTTPS too."
- id: q7
  type: code
  prompt: Implement the packet capture credential-leak detector in problem/ (graded automatically).
  grader: problem
  points: 3
