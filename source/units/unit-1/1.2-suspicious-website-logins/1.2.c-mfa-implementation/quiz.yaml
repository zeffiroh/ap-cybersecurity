# Canonical item bank for atom 1.2.c (single source of truth).
# Used by the skill quiz page and the topic's practice questions.
atom: 1.2.c
title: 'Strengthening authentication: length/complexity, randomness, MFA'
lo:
- 1.2.C
items:
- id: q1
  type: mcq
  prompt: According to NIST SP 800-63B, what is the primary driver of password strength?
  options:
  - Mandatory symbol requirements
  - Mandatory uppercase + digit rules
  - Frequency of rotation
  - Password length
  answer: 3
  points: 1
  explain: NIST SP 800-63B explicitly moved away from mandatory complexity rules. Length is the primary driver because each additional character multiplies the search space by the alphabet size, while adding a new character class only multiplies it once.
- id: q2
  type: multi
  prompt: Which of the following are factors in a TOTP (Time-based One-Time Password) computation? Select ALL that apply.
  options:
  - A shared secret key K
  - The current Unix timestamp
  - The user's password
  - A 30-second time step window
  answer:
  - 0
  - 1
  - 3
  points: 3
  explain: 'TOTP uses: (1) the shared secret K, (2) the current timestamp divided by the step to get the time step counter, (3) the 30-second step size. The user''s password is a separate first factor and is NOT part of the TOTP computation.'
- id: q3
  type: mcq
  prompt: An attacker intercepts a valid TOTP code and tries to use it 45 seconds later. What happens?
  options:
  - The code still works because TOTP has a 60-second window
  - The server cannot tell the difference
  - The code works once more then expires
  - The code is rejected because the time step has changed
  answer: 3
  points: 1
  explain: TOTP codes are only valid for the 30-second step in which they were generated. After 30 seconds the step counter changes and the server computes a different expected code. The intercepted code is permanently invalid.
- id: q4
  type: short
  prompt: Name the two factors that MFA combines to protect a Wi-Fi login. Use the 'something you know / something you have' framework.
  accept:
  - password
  - know and have
  - something you know and something you have
  - password and totp
  - password and one-time
  points: 1
  explain: MFA combines something you know (the password) with something you have (the authenticator app generating TOTP codes). An attacker needs both to succeed.
- id: q5
  type: mcq
  prompt: In the TOTP algorithm, what is the 'time step' T for a Unix timestamp of 1700000075?
  options:
  - '1700000075'
  - '30'
  - '56666002'
  - '56666669'
  answer: 3
  points: 1
  explain: T = floor(1700000075 / 30) = floor(56666669.166...) = 56666669.
- id: q6
  type: code
  prompt: Implement the TOTP verifier in problem/ (graded automatically).
  grader: problem
  points: 3
