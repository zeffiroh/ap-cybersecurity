<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1.2.a - VPN Auth Log Triage</title>
<style>
:root{
  --bg:#fff;--fg:#000;
  --win-face:#c0c0c0;--win-light:#fff;--win-dark:#000;
  --win-title:#000080;--win-title-fg:#fff;
  --ui:"MS Sans Serif",Tahoma,system-ui,sans-serif;
  --mono:"Consolas","Lucida Console","DejaVu Sans Mono",monospace;
}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);margin:0}
.wrap{max-width:820px;margin:16px auto;padding:0 12px}
.window{background:var(--win-face);padding:2px;border:2px solid;border-color:var(--win-light) var(--win-dark) var(--win-dark) var(--win-light)}
.titlebar{background:var(--win-title);color:var(--win-title-fg);font-weight:bold;padding:3px 6px;display:flex;justify-content:space-between}
.body{background:#fff;padding:12px}
.term{background:#000;color:#0f0;font-family:var(--mono);padding:10px;white-space:pre;max-height:300px;overflow:auto}
.btn{font-family:var(--ui);background:var(--win-face);padding:4px 12px;border:2px solid;border-color:var(--win-light) var(--win-dark) var(--win-dark) var(--win-light);cursor:pointer}
input{font-family:var(--mono);padding:3px}
.ok{color:#008000;font-weight:bold}.bad{color:#a00;font-weight:bold}
</style>
</head>
<body>
<div class="wrap"><div class="window">
<div class="titlebar"><span>Lab 1.2.a - VPN Auth Log Triage</span><span>[_][^][X]</span></div>
<div class="body">
<p>A Wi-Fi/VPN account is under attack. Inspect the log and submit the <b>attacking source IP</b>.</p>
<div class="term" id="log"></div>
<form id="check" style="margin-top:10px">
  Attacker source IP: <input id="ip" placeholder="e.g. 10.20.5.10" size="20">
  <button class="btn" type="submit">Submit</button>
</form>
<p id="result"></p>
</div></div></div>
<script>
(function () {
  var USERS = ["mara.nguyen", "devin.foster", "priya.patel", "sam.reyes", "lena.brooks"];
  var ATTACKER_IP = "198.51.100.77";
  var seed = 1337;
  function rnd() {
    seed = (seed + 0x6D2B79F5) | 0;
    var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  function between(a, b) { return a + Math.floor(rnd() * (b - a + 1)); }
  function pick(list) { return list[Math.floor(rnd() * list.length)]; }

  var log = [], ts = 1750000000, i;
  for (i = 0; i < 40; i++) {
    log.push({ ts: ts, user: pick(USERS), src: "10.20.5." + between(2, 200), ok: rnd() > 0.06 });
    ts += between(20, 90);
  }
  for (i = 0; i < 30; i++) {
    log.push({ ts: ts, user: pick(USERS), src: ATTACKER_IP, ok: false });
    ts += 7;
  }
  function pad(s, n) { s = String(s); while (s.length < n) s += " "; return s; }
  document.getElementById("log").textContent = log.map(function (e) {
    return e.ts + "  " + pad(e.user, 14) + " " + pad(e.src, 16) + " " + (e.ok ? "OK" : "FAIL");
  }).join("\n");

  document.getElementById("check").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var out = document.getElementById("result");
    if (document.getElementById("ip").value.trim() === ATTACKER_IP) {
      out.innerHTML = '<span class="ok">PASS - correct. Sustained failures from one external IP across the account = brute force. Mitigate: lockout + MFA (skill 1.2.c).</span>';
    } else {
      out.innerHTML = '<span class="bad">Not correct. Look for many FAIL events from one source IP in a tight time window.</span>';
    }
  });
})();
</script>
</body>
</html>
