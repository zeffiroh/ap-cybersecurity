# Canonical item bank for atom 1.2.a (single source of truth).
# Used by the skill quiz page and the topic's practice questions.
atom: 1.2.a
title: Password-attack signs
lo:
- 1.2.A
items:
- id: q1
  type: mcq
  prompt: An authentication log shows 47 failed logins for the same account over 90 seconds, then a success. What type of attack does this pattern indicate?
  options:
  - Phishing
  - Brute-force / dictionary attack
  - SQL injection
  - Man-in-the-middle
  answer: 1
  points: 1
  explain: Rapid automated failures followed by a success is the signature of a brute-force or dictionary attack, not a human typing incorrectly.
- id: q2
  type: mcq
  prompt: A defender sets an alert for '5 failed logins within 60 seconds for the same user.' Why is the TIME WINDOW included in the rule, not just the raw count?
  options:
  - "To distinguish slow manual mistakes from fast automated guessing, reducing false positives"
  - "So the alert ignores failures that come from the user's usual device"
  - "Because logs only keep the last 60 seconds of events"
  - "So that attackers who guess slowly are also caught"
  answer: 0
  points: 1
  explain: "Real users mistype occasionally over hours; scripts fail many times in seconds. Counting within a short window separates the two and keeps false positives down. The trade-off is the last option's opposite: a short window can MISS slow attackers who spread guesses out, which is why some systems also track failures over hours or days."
- id: q3
  type: multi
  prompt: Which of the following are recognized PASSWORD-ATTACK SIGNALS in an authentication log? Select ALL that apply.
  options:
  - Many failed logins for one account in a short time
  - A login from a device never seen before
  - A successful login at 3 a.m. when the user normally works 9-5
  - A user changing their display name in their profile settings
  answer:
  - 0
  - 1
  - 2
  points: 3
  explain: Failed-attempt spikes, unknown devices, and anomalous login times are the three key password-attack signals. Profile changes are not.
- id: q4
  type: mcq
  prompt: 'Credential stuffing differs from a classic dictionary attack because:'
  options:
  - It tries every possible character combination
  - It uses real username/password pairs stolen from a different service's breach
  - It requires physical access to the target device
  - It only targets administrator accounts
  answer: 1
  points: 1
  explain: Credential stuffing reuses breach data from other sites, exploiting password reuse across services. It does not try random combinations.
- id: q5
  type: short
  prompt: An account lockout fires AFTER five failures. A defender notices the log has a SUCCESS before the lockout triggered. What should they conclude?
  accept:
  - account may already be compromised
  - compromised before lockout
  - attacker succeeded
  - login succeeded before threshold
  - already compromised
  points: 1
  explain: A success before lockout means the attacker found the correct password; the account is compromised and a full incident response is needed.
- id: q6
  type: code
  prompt: Implement solve(events) in problem/ — detect brute-force targets using the 5-failures-in-60s sliding window rule (graded automatically).
  grader: problem
  points: 3
