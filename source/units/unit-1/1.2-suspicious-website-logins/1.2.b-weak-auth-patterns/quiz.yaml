atom: 1.2.b
title: Weak authentication patterns; adversary dictionary construction
lo:
- 1.2.B
items:
- id: q1
  type: mcq
  prompt: An attacker has a 14-million-entry wordlist from a known breach. What type of attack does this enable?
  options:
  - Brute-force (exhaustive)
  - SQL injection
  - Replay attack
  - Dictionary attack
  answer: 3
  points: 1
  explain: A dictionary attack uses a prebuilt wordlist of likely passwords rather than trying every possible combination. Breach wordlists (e.g., rockyou.txt) contain the most common real-world passwords.
- id: q2
  type: multi
  prompt: Which of the following make a password MORE vulnerable to a dictionary attack? Select ALL that apply.
  options:
  - Using a common word as the base
  - Substituting 'a' with '@'
  - Length of 20+ random characters
  - Appending '1' to a common word
  answer:
  - 0
  - 1
  - 3
  points: 3
  explain: Common base words appear in wordlists. Simple substitutions (a->@) and common appendages (word+'1') are covered by mangling rules. Long random strings resist dictionary attacks because they do not appear in any wordlist.
- id: q3
  type: mcq
  prompt: 'Under NIST SP 800-63B-4 (2025), the minimum length for a password used on its own, without MFA, is:'
  options:
  - 6 characters
  - 8 characters
  - 12 characters
  - 15 characters
  answer: 3
  points: 1
  explain: NIST SP 800-63B-4 sets 15 characters for a password used on its own and 8 when it is one factor of MFA. Every extra character multiplies the search space exponentially.
- id: q4
  type: mcq
  prompt: A password 'HelloWorld111' passes a complexity check (has uppercase, lowercase, digits). Which weakness flag does the automated checker still raise?
  options:
  - too_short
  - in_dictionary
  - sequential_or_repeated
  - only_lowercase
  answer: 2
  points: 1
  explain: '''111'' is a run of 3 identical characters, triggering the sequential_or_repeated rule regardless of other complexity passing.'
- id: q5
  type: short
  prompt: Name the technique attackers use to automatically generate hundreds of variants from a single wordlist entry (e.g., 'password' -> 'P@ssw0rd', 'password1', 'PASSWORD').
  accept:
  - mangling
  - mangling rules
  - rule-based mangling
  - transformation rules
  - rules
  points: 1
  explain: Mangling rules (also called rule-based transformations) apply capitalization, substitution, and appendage patterns to each wordlist entry, expanding coverage without new creativity.
- id: q6
  type: code
  prompt: Implement the password weakness reporter in problem/ (graded automatically).
  grader: problem
  points: 3
