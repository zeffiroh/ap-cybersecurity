# Canonical item bank for atom 1.3.c (single source of truth).
# Used by the skill quiz page and the topic's practice questions.
atom: 1.3.c
title: Jamming / denial-of-service attack
lo:
- 1.3.B
items:
- id: q1
  type: mcq
  prompt: Which Wi-Fi access mechanism does RF jamming exploit to deny service?
  options:
  - WPA3 handshake, jamming corrupts the 4-way handshake
  - CSMA/CA, devices back off when they detect channel noise, including deliberate jamming
  - DHCP, jamming prevents IP address assignment
  - DNS, jamming reroutes domain lookups
  answer: 1
  points: 1
  explain: 'Wi-Fi uses CSMA/CA: devices listen before transmitting and back off when they detect noise. A jammer floods the channel with noise, causing all devices to wait indefinitely.'
- id: q2
  type: mcq
  prompt: What distinguishes RF jamming from ordinary transient interference (e.g. a nearby microwave)?
  options:
  - Jamming always operates on 5 GHz; microwaves only affect 2.4 GHz
  - Only jamming uses radio waves; interference uses wired signals
  - Jamming raises RSSI; interference lowers it
  - Jamming produces sustained, high-level noise across many consecutive samples; interference is typically brief
  answer: 3
  points: 1
  explain: 'The detection key is duration: a jammer maintains elevated noise over many consecutive readings, while household interference (microwave, Bluetooth) causes momentary spikes.'
- id: q3
  type: multi
  prompt: Select ALL defenses that can help a network survive or detect a jamming attack.
  options:
  - Switch to a different Wi-Fi channel not targeted by the jammer
  - Enable WPA3 encryption
  - Deploy a WIDS configured to alert on sustained noise-floor anomalies
  - Move from 2.4 GHz to 5 GHz or 6 GHz to use channels with shorter jammer range
  answer:
  - 0
  - 2
  - 3
  points: 3
  explain: Channel switching and frequency-band migration reduce exposure to a narrow-band jammer. A WIDS can detect sustained noise anomalies. WPA3 encrypts data but provides no protection against RF jamming, which operates at the physical layer below encryption.
- id: q4
  type: mcq
  prompt: In the coding problem, solve(samples) returns True when noise samples indicate jamming. Which rule does it apply?
  options:
  - Any single sample exceeds the threshold
  - The average of all samples exceeds the threshold
  - More than half the samples exceed the threshold
  - At least N consecutive samples all exceed threshold T
  answer: 3
  points: 1
  explain: The consecutive-sample rule (N or more samples in a row above T) detects sustained interference while ignoring brief transient spikes.
- id: q5
  type: short
  prompt: Name the metric, always a negative number, that wireless monitors use to measure signal power.
  accept:
  - rssi
  - received signal strength
  - dbm
  - signal strength indicator
  points: 1
  explain: RSSI (Received Signal Strength Indicator), measured in dBm (always negative for Wi-Fi; e.g. -55 dBm).
- id: q6
  type: code
  prompt: Implement solve(samples) in problem/ — detect sustained jamming from a noise-floor sample list (auto-graded by tests).
  grader: problem
  points: 3
