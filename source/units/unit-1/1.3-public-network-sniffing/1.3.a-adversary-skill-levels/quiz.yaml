# Canonical item bank for atom 1.3.a (single source of truth).
# Used by the skill quiz page and the topic's practice questions.
atom: 1.3.a
title: Adversary skill levels (low-skilled vs high-skilled / zero-days); motivation
lo:
- 1.3.A
items:
- id: q1
  type: mcq
  prompt: An attacker at a coffee shop runs a freely downloaded packet-capture script without understanding how it works. Which tier best describes this adversary?
  options:
  - "High-skilled, because packet capture is an advanced technique"
  - "High-skilled, because the attack targets a public network"
  - "Low-skilled"
  - "It cannot be judged until the attacker succeeds"
  answer: 2
  points: 1
  explain: "Using a downloaded tool without understanding it, with no custom code, zero-day or adaptation, is the low-skilled (script kiddie) profile. Skill is judged by capability and behavior, not by how technical the tool sounds or whether the attack works."
- id: q2
  type: mcq
  prompt: 'A zero-day vulnerability is dangerous primarily because:'
  options:
  - "It has been publicly announced, so many attackers know about it at once"
  - "It only affects systems that have not installed the latest updates"
  - "Antivirus signatures for it are released on day zero"
  - "The vendor has not yet released a patch, so defenders have no fix available"
  answer: 3
  points: 1
  explain: "\"Zero-day\" means defenders have had zero days to fix it: no patch exists, and usually no signature either. That is why even fully updated systems are exposed. A flaw that only affects unpatched systems is a known (n-day) vulnerability, not a zero-day."
- id: q3
  type: multi
  prompt: Which of the following motivations would lead an attacker to target a SPECIFIC high-value individual rather than sweeping widely? (Select ALL that apply.)
  options:
  - Financial gain (bulk credential resale)
  - Espionage (stealing trade secrets)
  - Curiosity / learning
  - Targeted corporate sabotage
  answer:
  - 1
  - 3
  points: 2
  explain: Espionage and targeted sabotage require a specific victim. Bulk credential resale and curiosity are typically opportunistic and sweep broadly.
- id: q4
  type: short
  prompt: Name ONE observable behavior that would place an attacker firmly in the high-skilled tier.
  accept:
  - zero-day
  - custom tool
  - writes own tool
  - modifies tool
  - adapts to defenses
  - exploit development
  points: 1
  explain: High-skill markers include zero-day exploitation, custom tool development, and the ability to adapt when initial attacks fail.
- id: q5
  type: mcq
  prompt: Why does the skill tier of an adversary matter for a risk assessment?
  options:
  - "Higher-skilled attackers are easier to detect because they use more advanced tools"
  - "Skill tier determines the breadth and precision of possible attacks, shaping both likelihood and severity"
  - "Low-skilled attackers can be ignored because their tools never work"
  - "Skill tier matters for law enforcement but not for choosing defenses"
  answer: 1
  points: 1
  explain: "A risk assessment asks who could attack and what they could do. Low-skilled attackers are numerous (high likelihood) but are stopped by basic controls; high-skilled attackers are rarer but can defeat patched systems and adapt. Their public tools still work against unpatched systems, and advanced attackers are usually HARDER to detect."
- id: q6
  type: code
  prompt: Implement the adversary classifier in problem/ (graded automatically by tests.py).
  grader: problem
  points: 3
