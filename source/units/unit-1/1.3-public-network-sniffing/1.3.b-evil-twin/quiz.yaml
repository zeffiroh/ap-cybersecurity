# Canonical item bank for atom 1.3.b (single source of truth).
# Used by the skill quiz page and the topic's practice questions.
atom: 1.3.b
title: Evil twin attack
lo:
- 1.3.B
items:
- id: q1
  type: mcq
  prompt: What does BSSID stand for and why is it relevant to detecting an evil twin?
  options:
  - Broadband Service Signal ID, it tells you the ISP providing the connection
  - Basic Security Standard ID, it encodes the encryption type in use
  - Broadcast SSID, it is the human-readable name the user sees in the network list
  - Basic Service Set Identifier, it is the hardware MAC address of the AP radio, unique per physical device
  answer: 3
  points: 1
  explain: BSSID is the MAC address of the physical radio broadcasting the network. Two APs cannot share the same BSSID legitimately; an evil twin will have a different BSSID from the real AP even if the SSID matches.
- id: q2
  type: multi
  prompt: 'A wireless scan shows two entries: both broadcast SSID ''AirportFree'', one with security WPA2 and one with OPEN. Select ALL indicators that suggest an evil twin is present.'
  options:
  - The same SSID is advertised by more than one BSSID
  - One entry has weaker (or no) security than the other for the same SSID
  - Both entries have the same signal strength
  - The network name contains the word 'Free'
  answer:
  - 0
  - 1
  points: 2
  explain: Duplicate SSID across multiple BSSIDs is a primary evil-twin indicator. A security downgrade (WPA2 vs. OPEN) for the same SSID is a secondary indicator. Signal strength and network name alone are not definitive.
- id: q3
  type: mcq
  prompt: Which attack does an evil twin primarily enable once the victim connects?
  options:
  - SQL injection against the victim's database
  - Man-in-the-middle, the attacker relays and can read or alter all victim traffic
  - Distributed denial-of-service against a remote server
  - Brute-force of the victim's Wi-Fi password
  answer: 1
  points: 1
  explain: Once connected to the evil twin, all victim traffic flows through the attacker's hardware, enabling a man-in-the-middle position.
- id: q4
  type: mcq
  prompt: An enterprise legitimately deploys three access points all broadcasting SSID 'CorpNet' with three different BSSIDs. A fourth entry appears with SSID 'CorpNet' and a BSSID not on the approved list. What does this indicate?
  options:
  - Normal, any AP can join a corporate SSID
  - The network is using WPA3, which always shows extra BSSIDs
  - A misconfigured legitimate AP that should be rebooted
  - A potential evil twin; the unknown BSSID is not an approved radio
  answer: 3
  points: 1
  explain: An unapproved BSSID broadcasting an authorized SSID is the classic WIDS alert for an evil twin. Multiple BSSIDs per SSID are normal in enterprise deployments, but each BSSID must be on the approved list.
- id: q5
  type: short
  prompt: Name two defenses an END USER (not an administrator) can use to reduce evil-twin risk.
  accept:
  - vpn
  - https
  - avoid auto-connect
  - verify ssid
  - ask staff
  - cellular data
  - check certificate
  points: 2
  explain: 'End-user defenses include: using a VPN to encrypt all traffic regardless of the network, always checking for HTTPS, disabling auto-connect to open networks, and confirming the correct SSID with venue staff before connecting.'
- id: q6
  type: code
  prompt: Implement solve(aps) in problem/ — detect evil-twin BSSIDs from a wireless scan (auto-graded by tests).
  grader: problem
  points: 3
