# Canonical item bank for atom 1.3.d (single source of truth).
# Used by the skill quiz page and the topic's practice questions.
atom: 1.3.d
title: War driving; protecting yourself (verify SSIDs, avoid open networks, VPN)
lo:
- 1.3.B
- 1.3.C
items:
- id: q1
  type: mcq
  prompt: What does a war driver primarily collect about nearby Wi-Fi networks?
  options:
  - User passwords transmitted over the networks
  - SSIDs, BSSIDs, security types, signal strengths, and GPS locations
  - The names of devices connected to each network
  - The browsing history of users on each network
  answer: 1
  points: 1
  explain: 'War driving collects network-level metadata: SSID (name), BSSID (hardware address), security protocol, signal strength, and location. Passwords and browsing history require active attacks beyond passive scanning.'
- id: q2
  type: multi
  prompt: Select ALL factors that a personal risk-assessment protocol should check before connecting to a public Wi-Fi network.
  options:
  - Whether the SSID has been verified with venue staff
  - Whether the network is open (no password)
  - The brand of the router hardware
  - Whether you have an active VPN
  answer:
  - 0
  - 1
  - 3
  points: 3
  explain: 'The three-step protocol: (1) verify the SSID, (2) avoid open networks, (3) use a VPN. Router brand is not a user-accessible or reliable risk indicator.'
- id: q3
  type: mcq
  prompt: Why does SSID verification come FIRST in the personal Wi-Fi safety protocol, before VPN activation?
  options:
  - VPNs are slower than SSID checks
  - Venue staff can configure the VPN for you
  - Connecting to the wrong network (evil twin) sends traffic to an adversary before the VPN tunnel is established
  - Open networks cannot run VPN software
  answer: 2
  points: 1
  explain: If you connect to a rogue network first, even a brief unencrypted window before the VPN activates can leak credentials. Verification prevents the initial connection from being adversarial.
- id: q4
  type: mcq
  prompt: An attacker uses a public war-driving database to learn a corporation's SSID, then includes it in a phishing email. Which attack combination does this illustrate?
  options:
  - SQL injection combined with brute-force
  - Physical-layer reconnaissance combined with social engineering
  - Jamming combined with man-in-the-middle
  - Port scanning combined with evil twin
  answer: 1
  points: 1
  explain: War driving provides physical-layer intelligence (SSID) that increases the plausibility of a social-engineering attack, illustrating how passive reconnaissance feeds active attacks.
- id: q5
  type: short
  prompt: Name the one protection that defends you against interception even if the public Wi-Fi network is legitimate but compromised.
  accept:
  - vpn
  - virtual private network
  - encrypted tunnel
  - tunnel
  points: 1
  explain: A VPN encrypts traffic before it leaves your device, so even a compromised or malicious access point sees only ciphertext.
- id: q6
  type: code
  prompt: Implement solve(network) in problem/ — return sorted risk flags for a Wi-Fi network dict (auto-graded by tests).
  grader: problem
  points: 3
