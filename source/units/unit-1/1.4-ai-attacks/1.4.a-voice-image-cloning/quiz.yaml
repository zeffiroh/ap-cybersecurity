# Canonical item bank for atom 1.4.a (single source of truth).
# Used by the skill quiz page and the topic's practice questions.
atom: 1.4.a
title: Voice/image cloning for impersonation
lo:
- 1.4.A
items:
- id: q1
  type: mcq
  prompt: How much audio is typically needed to clone someone's voice with a modern synthesis model?
  options:
  - At least 30 minutes of clean recording
  - A full conversation of at least 5 minutes
  - 3-10 seconds of audio
  - Audio cloning is not yet possible with consumer tools
  answer: 2
  points: 1
  explain: Modern voice-cloning models can be fine-tuned on 3-10 seconds of audio, such as a voicemail greeting or short public video clip.
- id: q2
  type: multi
  prompt: Which of the following are procedural defenses against voice-cloning attacks? Select ALL that apply.
  options:
  - Use a pre-agreed shared secret (code word)
  - Trust the call if the voice sounds exactly right
  - Hang up and call back on the official directory number
  - Confirm high-value requests over a separate channel
  answer:
  - 0
  - 2
  - 3
  points: 3
  explain: Shared secrets, callback verification, and out-of-band confirmation defeat cloning. Trusting a familiar-sounding voice alone is not a reliable control as cloning quality improves.
- id: q3
  type: mcq
  prompt: An attacker combines a cloned CEO voice with an urgent wire-transfer request. Which TWO cognitive shortcuts are being exploited simultaneously?
  options:
  - Reciprocity and curiosity
  - Scarcity and authority
  - Intimidation and scarcity
  - Recognition and urgency
  answer: 3
  points: 1
  explain: The cloned voice triggers recognition ('I know this person'), while the urgent request suppresses the verification step urgency would otherwise trigger.
- id: q4
  type: short
  prompt: Why is relying on employees to spot audio artifacts in cloned voice calls not a sustainable long-term defense strategy?
  accept:
  - models improve
  - quality improves
  - detection gets harder
  - AI gets better
  - not reliable
  points: 1
  explain: Cloning models improve continuously, so perceptual detection becomes unreliable over time. Procedural controls (shared secrets, callbacks) do not depend on cloning quality.
- id: q5
  type: mcq
  prompt: A video call recipient notices the caller's face has inconsistent lighting compared to the background. What type of attack does this suggest?
  options:
  - Real-time deepfake video
  - SQL injection
  - Credential stuffing
  - Evil-twin Wi-Fi
  answer: 0
  points: 1
  explain: Lighting inconsistency between a face and background is a known artifact of face-swap/deepfake technology used in real-time video impersonation.
- id: q6
  type: code
  prompt: Implement the clone-call classifier in problem/ — given a dict of observable signals, return 'suspect' or 'ok' per the documented rules (graded automatically).
  grader: problem
  points: 3
