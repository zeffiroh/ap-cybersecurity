atom: 1.4.d
title: False information in LLM training sets
lo:
- 1.4.A
items:
- id: q1
  type: mcq
  prompt: A training sample has label='positive' and content='Worst product ever, total garbage.' What type of poisoning indicator is this?
  options:
  - Outlier marker
  - Distribution anomaly
  - Label/content mismatch
  - Backdoor trigger
  answer: 2
  points: 1
  explain: The label directly contradicts the content's sentiment -- this is a label/content mismatch, the simplest poisoning indicator.
- id: q2
  type: mcq
  prompt: Which attack goal does a backdoor poisoning attack achieve?
  options:
  - Causing the model to misclassify only inputs containing a specific trigger, while behaving normally otherwise
  - Reducing overall model accuracy on all inputs
  - Increasing model training time indefinitely
  - Preventing the model from being fine-tuned
  answer: 0
  points: 1
  explain: 'A backdoor is targeted: normal inputs produce normal outputs; only inputs with the trigger pattern are misclassified.'
- id: q3
  type: multi
  prompt: Select ALL valid indicators that a training sample may be poisoned.
  options:
  - Label directly contradicts the content
  - Sample length is within one standard deviation of the mean
  - Sample contains repeated unusual tokens or phrases
  - A sudden cluster of identical labels from a new data source
  answer:
  - 0
  - 2
  - 3
  points: 2
  explain: Normal length is not suspicious. Mismatch, unusual tokens, and sudden clusters are all poisoning indicators.
- id: q4
  type: short
  prompt: Why can a backdoor attack succeed with less than 1 percent poisoning rate?
  accept:
  - targeted
  - specific trigger
  - normal inputs unaffected
  - hard to detect
  - small fraction
  points: 1
  explain: 'Backdoor attacks are highly targeted: only trigger-containing inputs are affected, so the overall model appears normal and a small fraction of poisoned samples is sufficient.'
- id: q5
  type: code
  prompt: Implement solve() in problem/ to detect poisoned rows (graded automatically).
  grader: problem
  points: 3
