atom: 1.4.b
title: Generative-AI phishing; prompt injection
lo:
- 1.4.A
items:
- id: q1
  type: mcq
  prompt: Which of the following is a direct prompt injection attack?
  options:
  - An attacker sends a phishing email crafted by an LLM
  - An attacker fine-tunes an LLM on stolen data
  - An attacker types 'ignore previous instructions' directly into a chatbot's input field
  - An attacker trains a classifier on poisoned labels
  answer: 2
  points: 1
  explain: Direct injection means the attacker controls the user-facing input field of an LLM app and injects instructions there. Options A, C, and D describe other AI-based attacks but not prompt injection.
- id: q2
  type: mcq
  prompt: Why do traditional spam filters fail against AI-generated phishing emails?
  options:
  - AI-generated emails are always encrypted
  - Traditional filters rely on grammar and keyword signatures; LLMs produce fluent, contextually appropriate text that lacks those tells
  - AI-generated emails are sent from IP addresses not in block lists
  - Traditional filters cannot process HTML email
  answer: 1
  points: 1
  explain: Grammar-based and keyword heuristics that catch poorly-written spam break down when the content is fluent and plausible. LLMs eliminate the linguistic anomalies that made traditional phishing detectable.
- id: q3
  type: multi
  prompt: Select ALL phrases that are known prompt-injection trigger patterns.
  options:
  - ignore previous instructions
  - please summarize this document
  - you are now a different assistant
  - reveal system prompt
  answer:
  - 0
  - 2
  - 3
  points: 2
  explain: The three injection patterns attempt to override the model's instructions or extract internal configuration. 'Summarize' is a normal request and not an injection pattern.
- id: q4
  type: short
  prompt: Name one defense that limits the impact of a successful prompt injection in an LLM-powered app.
  accept:
  - privilege separation
  - least privilege
  - human in the loop
  - human-in-the-loop
  - output validation
  - input sanitization
  - sandbox
  points: 1
  explain: Privilege separation ensures the LLM cannot take sensitive actions even if injected; human-in-the-loop catches harmful outputs before they execute; output validation rejects anomalous responses; input sanitization blocks known patterns before they reach the model.
- id: q5
  type: code
  prompt: Implement solve() in problem/ to detect prompt-injection patterns (graded automatically).
  grader: problem
  points: 3
