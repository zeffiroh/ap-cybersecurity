atom: 1.5.b
title: AI analyzing code for vulnerabilities
lo:
- 1.5.A
items:
- id: q1
  type: mcq
  prompt: Why is `eval(user_input)` flagged as dangerous by a static code scanner?
  options:
  - "eval() is slower than normal code, which lets attackers cause a denial of service"
  - "eval() executes an arbitrary string as Python code, letting an attacker run any code on the server"
  - "eval() prints its input to the server logs, leaking user data"
  - "eval() turns off Python's error handling for the rest of the program"
  answer: 1
  points: 1
  explain: "eval() runs whatever text it is given as Python, so input like __import__('os').system('...') runs operating-system commands. That is remote code execution, the most severe class of bug; speed and logging are not the issue."
- id: q2
  type: multi
  prompt: Which of the following Python patterns would an AI code scanner flag as causing OS command injection risk? Select ALL that apply.
  options:
  - os.system(cmd)
  - subprocess.run(args, shell=False)
  - subprocess.run(cmd, shell=True)
  - os.path.join(base, filename)
  answer:
  - 0
  - 2
  points: 2
  explain: os.system() always passes commands to a shell. subprocess with shell=True restores the same injection risk. subprocess with shell=False (a list of args) is safe. os.path.join is not a command execution function.
- id: q3
  type: mcq
  prompt: A developer stores `password = 'Admin@2024'` directly in source code. What is the PRIMARY security risk?
  options:
  - "The password is too short to meet the 12-character minimum"
  - "Anyone who runs the program can see the password on screen"
  - "The password will expire and break the program in 90 days"
  - "The password is visible to anyone with access to the source code or version history, making it a leaked credential"
  answer: 3
  points: 1
  explain: "Source code is copied to developers' laptops, build servers, backups and sometimes public repositories, and version control keeps the secret forever even after it is deleted. Secrets belong in environment variables or a secrets manager. The program does not display the variable, and length is a separate issue."
- id: q4
  type: mcq
  prompt: Why is `pickle.loads(data)` dangerous when `data` comes from an untrusted source?
  options:
  - "pickle is slower than JSON, so large untrusted inputs can freeze the server"
  - "Deserialization of a maliciously crafted pickle can execute arbitrary code without any additional exploit"
  - "pickle stores data unencrypted, so attackers can read it in transit"
  - "pickle files can contain viruses that antivirus software misses"
  answer: 1
  points: 1
  explain: "Unpickling rebuilds objects by calling functions named inside the data, so a crafted pickle can call os.system the moment it is loaded: no extra bug needed. Use a data-only format like JSON for anything untrusted. Encryption and speed are separate concerns."
- id: q5
  type: short
  prompt: Name the key difference between STATIC analysis and DYNAMIC analysis of source code.
  accept:
  - static does not run
  - without executing
  - without running
  - examines without execution
  - no execution
  points: 1
  explain: Static analysis reads code without executing it. Dynamic analysis runs the code and observes behavior. Static is fast and catches pattern-based bugs; dynamic finds runtime-dependent bugs.
- id: q6
  type: code
  prompt: Implement the code vulnerability scanner in problem/ (graded automatically by tests.py).
  grader: problem
  points: 3
