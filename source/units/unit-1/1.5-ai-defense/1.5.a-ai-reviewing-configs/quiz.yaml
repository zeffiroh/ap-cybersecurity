# Canonical item bank for atom 1.5.a (single source of truth).
# Used by the skill quiz page and the topic's practice questions.
atom: 1.5.a
title: AI reviewing security configurations
lo:
- 1.5.A
items:
- id: q1
  type: mcq
  prompt: A config file contains 'PermitRootLogin yes'. What is the DIRECT security risk?
  options:
  - The SSH port becomes publicly visible
  - An attacker who cracks the root password has immediate full system access
  - The system disables all password authentication
  - TLS encryption is bypassed
  answer: 1
  points: 1
  explain: PermitRootLogin yes allows the root account to authenticate directly over SSH. Root compromise = total system control with no need to escalate privileges.
- id: q2
  type: multi
  prompt: Which of the following settings in an SSH config file would an AI auditor flag as insecure? Select ALL that apply.
  options:
  - PasswordAuthentication yes
  - Port 22
  - PermitRootLogin yes
  - X11Forwarding yes
  answer:
  - 0
  - 2
  - 3
  points: 3
  explain: PasswordAuthentication yes enables brute-force attacks; PermitRootLogin yes allows direct root access; X11Forwarding yes exposes unnecessary attack surface. Port 22 is the standard SSH port and is not itself insecure.
- id: q3
  type: mcq
  prompt: Why does an AI config auditor emit a FINDING rather than automatically changing the insecure setting?
  options:
  - AI tools cannot read configuration files
  - Configuration files are encrypted
  - The setting may have a compensating control or documented exception that the human reviewer must evaluate
  - Audit findings are only used for compliance reports, not remediation
  answer: 2
  points: 1
  explain: A finding is a question, not a verdict. The human reviews whether a compensating control exists or the exception is documented. The AI handles mechanical pattern matching; the engineer provides context.
- id: q4
  type: mcq
  prompt: A config line reads 'port 23'. Why does an AI auditor flag this?
  options:
  - Port 23 is reserved and cannot be opened
  - Port 23 is Telnet, which transmits credentials in cleartext
  - Ports below 1024 are always insecure
  - Port 23 conflicts with HTTP traffic on port 80
  answer: 1
  points: 1
  explain: Port 23 is the Telnet protocol, which sends all data including passwords unencrypted. SSH (port 22) replaced it specifically because of this vulnerability.
- id: q5
  type: short
  prompt: Name the security lifecycle stage where config review runs inside a CI/CD pipeline to block insecure settings BEFORE they reach production.
  accept:
  - shift-left
  - shift left
  - pre-deployment
  - pre deployment
  - before deployment
  points: 1
  explain: Shift-left security means moving checks earlier in the development cycle. Running a config auditor on a pull request catches misconfigurations before any server is affected.
- id: q6
  type: code
  prompt: Implement the config auditor in problem/ (graded automatically by tests.py).
  grader: problem
  points: 3
