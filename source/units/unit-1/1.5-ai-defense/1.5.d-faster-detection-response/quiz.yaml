atom: 1.5.d
title: Faster, more accurate threat detection and response
lo:
- 1.5.B
items:
- id: q1
  type: mcq
  prompt: MTTR stands for Mean Time to Respond. Which formula correctly defines it for a set of N incidents?
  options:
  - The sum of all response times divided by the number of incidents
  - The time the fastest incident took to resolve
  - The number of auto-resolved incidents divided by total incidents
  - The longest response time in the dataset
  answer: 0
  points: 1
  explain: MTTR = sum(resolved_at - detected_at) / N. It is the arithmetic mean of individual response times across all incidents.
- id: q2
  type: mcq
  prompt: Which type of incident is MOST appropriate for automated (no-human) resolution?
  options:
  - A novel ransomware variant with no known decryption key
  - A high-confidence known-malicious IP blocked at the firewall with a reversible action
  - An alert involving a critical business partner's IP address
  - An incident requiring communication with law enforcement
  answer: 1
  points: 1
  explain: Auto-resolution is safe only for high-confidence, reversible actions. Novel patterns, business-partner IPs, and law-enforcement cases require human judgment.
- id: q3
  type: multi
  prompt: AI-assisted triage scoring considers which of the following signals? Select ALL that apply.
  options:
  - Type of event (e.g., ransomware behavior vs. single failed login)
  - Criticality of the affected asset (e.g., domain controller vs. developer laptop)
  - The analyst's personal preference for ticket order
  - Historical false-positive rate for similar alert types
  answer:
  - 0
  - 1
  - 3
  points: 3
  explain: AI triage weighs event type, asset criticality, threat-intelligence reputation, and historical FP rates. Analyst preference is not an AI signal.
- id: q4
  type: short
  prompt: Name ONE sub-component of MTTR that AI improves by continuously monitoring telemetry without attention lapses.
  accept:
  - time to detect
  - ttd
  - detection time
  points: 1
  explain: TTD (Time to Detect) shrinks because AI monitors telemetry 24/7 without fatigue, catching events that a tired analyst might miss during overnight shifts.
- id: q5
  type: mcq
  prompt: A SOC processes incidents in arrival order instead of severity order. What is the PRIMARY risk?
  options:
  - "Analysts will spend more time on each incident"
  - "Low-severity incidents will never be closed"
  - "Critical incidents may wait behind low-severity noise, giving attackers more dwell time"
  - "Auto-resolution rules will stop running"
  answer: 2
  points: 1
  explain: "Dwell time (how long an attacker stays undetected or uncontained) drives damage. Working in arrival order means a ransomware beacon can sit behind a dozen low-risk alerts. Severity-first triage puts the dangerous ones at the front."
- id: q6
  type: code
  prompt: Implement solve(incidents) in problem/ to compute MTTR and auto-resolved count from incident records (graded automatically).
  grader: problem
  points: 3
