# Canonical item bank for atom 1.5.c (single source of truth).
# Used by the skill quiz page and the topic's practice questions.
atom: 1.5.c
title: AI suggesting detection rules
lo:
- 1.5.A
items:
- id: q1
  type: mcq
  prompt: A detection rule fires when the same source IP generates 5 failed logins within 60 seconds. What is the name for the numeric limit (5) in this rule?
  options:
  - Signature
  - Baseline
  - Threshold
  - Precision
  answer: 2
  points: 1
  explain: The minimum event count required to trigger a rule is called the threshold. Tuning it balances false positives against missed detections.
- id: q2
  type: mcq
  prompt: An analyst sets the brute-force threshold to 1 failed login. What is the MOST LIKELY consequence?
  options:
  - Attackers will never be detected
  - The SIEM will run out of storage
  - Alert fatigue -- analysts are overwhelmed by normal mistyped passwords
  - The network will block all traffic
  answer: 2
  points: 1
  explain: A threshold of 1 flags every mistyped password, generating far more alerts than analysts can investigate -- a classic alert fatigue scenario.
- id: q3
  type: multi
  prompt: Which of the following are components of a well-formed detection rule? Select ALL that apply.
  options:
  - A condition (what pattern to match)
  - A threshold (how many events)
  - An action (what to do when triggered)
  - A list of attacker names
  answer:
  - 0
  - 1
  - 2
  points: 3
  explain: 'Rules have three parts: condition, threshold, and action. Attacker names are not part of the rule structure.'
- id: q4
  type: short
  prompt: What does SIEM stand for, and what is its primary function in a SOC?
  accept:
  - security information and event management
  - aggregate logs
  - correlate logs
  - apply detection rules
  points: 1
  explain: SIEM = Security Information and Event Management. It aggregates logs from many sources, applies detection rules, and surfaces alerts to analysts.
- id: q5
  type: mcq
  prompt: An AI tool proposes a new detection rule based on historical log analysis. What should happen BEFORE the rule is deployed to production?
  options:
  - Deploy it immediately -- AI rules are always correct
  - Delete it -- AI-generated rules are unreliable
  - Run it for one second and check if any alerts fire
  - A human analyst reviews it for precision, context, and compliance
  answer: 3
  points: 1
  explain: AI generates rule candidates; humans approve. Analyst review checks precision, legal/privacy compliance, and whether the IP might be a trusted partner.
- id: q6
  type: code
  prompt: Implement solve(logs) in problem/ to generate brute-force detection rules from a log stream (graded automatically).
  grader: problem
  points: 3
