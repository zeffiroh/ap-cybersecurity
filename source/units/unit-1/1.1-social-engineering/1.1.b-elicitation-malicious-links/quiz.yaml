# Canonical item bank for atom 1.1.b (single source of truth).
# Used by the skill quiz page and the topic's practice questions.
atom: 1.1.b
title: Elicitation; malicious links and files
lo:
- 1.1.A
- 1.1.C
items:
- id: q1
  type: mcq
  prompt: An attacker tells a receptionist 'I heard your VPN uses port 1433, or was it 443?' hoping the receptionist corrects them. Which elicitation gambit is this?
  options:
  - Deliberate incorrect statement
  - Flattery / appeal to expertise
  - Mutual disclosure
  - Third-party reference
  answer: 0
  points: 1
  explain: Stating something wrong to provoke a correction is the deliberate-incorrect-statement gambit. The target volunteers the accurate detail to fix the error.
- id: q2
  type: multi
  prompt: "Which of the following are malicious indicators in the URL http://paypa1.com/verify.exe ? Select ALL that apply."
  options:
  - "lookalike-domain (paypa1.com imitates paypal.com)"
  - "mismatched-link (the link text differs from where it really goes)"
  - "dangerous-extension (.exe)"
  - "ip-url (the host is a numeric address)"
  answer:
  - 0
  - 2
  points: 2
  explain: "paypa1.com swaps the letter l for the digit 1, so it is a lookalike domain, and verify.exe downloads a program. There is no separate link text shown here to compare against, so mismatched-link cannot be judged, and the host is a name, not an IP address."
- id: q3
  type: mcq
  prompt: A filename shows as 'invoice.pdf' in Windows Explorer. When you look at the true name it is 'invoice.pdf.exe'. What technique does this use?
  options:
  - Typosquatting
  - Double extension
  - Homograph attack
  - URL shortening
  answer: 1
  points: 1
  explain: A double extension exploits Windows hiding known extensions by default, making .exe appear as .pdf in the file browser.
- id: q4
  type: short
  prompt: Why does HTTPS in a URL NOT prove that a website is safe?
  accept:
  - encrypted
  - encryption only
  - certificate
  - tls only
  - attacker can get certificate
  - certificate does not verify legitimacy
  points: 1
  explain: HTTPS only proves the connection is encrypted. Attackers freely obtain TLS certificates for malicious domains; the padlock does not mean the site is legitimate.
- id: q5
  type: mcq
  prompt: Which action BEST defends against elicitation when someone you do not recognize asks detailed questions about your network?
  options:
  - "Answer only general questions and refuse anything specific"
  - "Ask them a security question only a real employee would know"
  - "Verify their identity through official channels before sharing any operational details"
  - "Share only details that are already on the company website"
  answer: 2
  points: 1
  explain: "Elicitation works by collecting small, harmless-seeming pieces, so \"general\" or \"public\" answers still help the attacker build a picture, and a quiz question can be researched or guessed. Verifying identity through an official channel (a directory number, the security team) before sharing anything is the reliable defense."
- id: q6
  type: code
  prompt: Implement the URL/filename indicator detector in problem/ (graded automatically).
  grader: problem
  points: 3
