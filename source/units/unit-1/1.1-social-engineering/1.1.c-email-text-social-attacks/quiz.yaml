# Canonical item bank for atom 1.1.c (single source of truth).
# Used by the skill quiz page and the topic's practice questions.
atom: 1.1.c
title: Email, text, and social media attacks
lo:
- 1.1.A
- 1.1.C
items:
- id: q1
  type: mcq
  prompt: An attacker registers 'paypa1.com' (digit 1 replacing the letter l) and sends password-reset emails from that domain. Which technique does this PRIMARILY represent?
  options:
  - Domain lookalike / homograph attack
  - Spear phishing
  - Smishing
  - Watering-hole attack
  answer: 0
  points: 1
  explain: Substituting visually similar characters in a domain name to impersonate a trusted brand is a lookalike (homograph) domain attack, the core technique behind most phishing sender spoofing.
- id: q2
  type: mcq
  prompt: 'A text message says: ''UPS: Your package is held. Reschedule at http://bit.ly/upsdel.'' What makes SMS (smishing) especially effective for this type of attack?'
  options:
  - SMS messages cannot be filtered by spam engines
  - Limited screen real estate hides full URLs; people trust texts on personal devices
  - Phones display URLs in full without truncation
  - SMS is encrypted end-to-end so attackers can bypass firewalls
  answer: 1
  points: 1
  explain: Smishing exploits the fact that phone screens show truncated or shortened URLs and that people have higher baseline trust in SMS messages received on personal devices.
- id: q3
  type: multi
  prompt: 'A social media DM says: ''Your account expires tonight. Verify at http://192.168.5.1/login to avoid losing access.'' Select ALL phishing indicators present.'
  options:
  - Shortened link / bare IP address URL
  - Urgency (account expiring tonight)
  - Credential request (verify to avoid losing access)
  - Legitimate organizational sender
  answer:
  - 0
  - 1
  - 2
  points: 3
  explain: The bare IP address URL triggers the shortened-link indicator, 'expires tonight' is urgency, and 'verify to avoid losing access' is a credential request. A legitimate organization does not send you to a bare IP address.
- id: q4
  type: mcq
  prompt: What distinguishes spear phishing from generic phishing?
  options:
  - Spear phishing always uses SMS; phishing uses email
  - Spear phishing is illegal; phishing is not
  - Spear phishing installs malware directly; phishing only harvests credentials
  - Spear phishing uses pre-researched details about a specific target to increase believability
  answer: 3
  points: 1
  explain: 'Spear phishing is targeted: the attacker researches the victim (job role, colleagues, projects) before crafting a tailored message. Generic phishing casts a wide net with a generic message.'
- id: q5
  type: short
  prompt: Name the one defensive action that works across email, SMS, and social media phishing when you suspect a message is fraudulent.
  accept:
  - verify through a separate channel
  - verify independently
  - contact the organization directly
  - call the organization
  - look up the real contact
  - use a trusted contact method
  - verify out of band
  points: 1
  explain: Verify through an independent channel, look up the organization's real contact information separately and reach out that way, rather than using any link, number, or address in the suspicious message.
- id: q6
  type: code
  prompt: Implement the phishing indicator extractor in problem/ (graded automatically). Given a message dict with keys channel, sender, text, and link, return a sorted list of indicator labels that apply.
  grader: problem
  points: 3
