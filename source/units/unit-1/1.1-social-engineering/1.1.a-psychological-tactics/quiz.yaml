atom: 1.1.a
title: Psychological tactics
lo:
- 1.1.A
- 1.1.B
items:
- id: q1
  type: mcq
  prompt: An email says 'Your account closes in 1 hour unless you verify now.' Which tactic is this PRIMARILY using?
  options:
  - Scarcity
  - Reciprocity
  - Authority
  - Urgency
  answer: 3
  points: 1
  explain: "Manufactured time pressure ('1 hour', 'now') is urgency; it pushes you to act before verifying. It is not scarcity, because nothing is described as limited in supply, and nobody claims special authority."
- id: q2
  type: multi
  prompt: 'A message reads: ''This is the IRS. Pay the penalty within 24 hours or face arrest.'' Select ALL tactics present.'
  options:
  - Authority
  - Urgency
  - Intimidation
  - Scarcity
  answer:
  - 0
  - 1
  - 2
  points: 3
  explain: IRS = authority, '24 hours' = urgency, 'penalty'/'arrest' = intimidation. No scarcity.
- id: q3
  type: mcq
  prompt: Why is recognizing the underlying TACTIC more useful than memorizing specific scam templates?
  options:
  - "Scam templates are copyrighted, so security training cannot show real examples"
  - "Tactics stay constant even when attackers change the brand, wording, or channel"
  - "Spam filters already catch every known template, so only tactics are left to learn"
  - "Each tactic appears in only one kind of scam, so naming it identifies the scam"
  answer: 1
  points: 1
  explain: "Surface details (brand, wording, channel, even AI-written text) change constantly, but the psychological levers do not, so recognizing the lever generalizes to messages you have never seen. Filters do not catch every template, and tactics are not tied to one scam type: urgency shows up in bank, IRS and CEO scams alike."
- id: q4
  type: short
  prompt: Name the single best defensive response when you notice manufactured emotional pressure in a message.
  accept:
  - slow down
  - verify
  - separate channel
  - verify through a trusted channel
  - stop and verify
  points: 1
  explain: Slow down and verify the request through a separate, trusted channel.
- id: q5
  type: code
  prompt: Implement the tactic detector in problem/ (graded automatically).
  grader: problem
  points: 3
