atom: 4.3.b
title: Antivirus and endpoint protection
lo:
- 4.3.A
- 4.3.B
items:
- id: q1
  type: mcq
  prompt: An administrator wants to detect a brand-new, customized piece of malware that does not match any known virus definition database. Which detection method is MOST likely to identify this threat?
  options:
  - Signature-based detection
  - Heuristic or behavioral analysis
  - Hashing-based verification
  - Passive packet sniffing
  answer: 1
  points: 1
  explain: Behavioral and heuristic analysis look at the program's actions or structure to identify anomalies rather than matching static byte sequences.
- id: q2
  type: mcq
  prompt: What is a primary drawback of relying heavily on behavioral analysis for malware detection?
  options:
  - It cannot detect zero-day exploits.
  - It requires a constantly updated signature database to function.
  - It only operates when the computer is disconnected from the network.
  - It may generate a higher rate of false positives on legitimate administrative software.
  answer: 3
  points: 1
  explain: Behavioral monitoring can flag benign administrative tools that perform system-level operations (like registry edits or process injections) as suspicious, raising false alarms.
- id: q3
  type: multi
  prompt: Select ALL functions that a host-based firewall typically performs. (Choose all that apply.)
  options:
  - Blocking unauthorized inbound connections to local services
  - Preventing unauthorized outbound connections from local malware to command servers
  - Scanning local files for known virus signatures
  - Filtering traffic specifically for the device on which it is installed
  answer:
  - 0
  - 1
  - 3
  points: 3
  explain: Host firewalls block unauthorized incoming and outgoing connections for a single endpoint. Scanning files for signatures is the job of antivirus software.
- id: q4
  type: short
  prompt: What is the term for a security alert that incorrectly flags a harmless file or action as malicious?
  accept:
  - false positive
  - false-positive
  points: 1
  explain: A false positive occurs when normal activity is misidentified as a threat.
- id: q5
  type: mcq
  prompt: An attacker abuses PowerShell, a legitimate pre-installed Windows tool, to download and run malicious code instead of using custom malware. What is this technique called?
  options:
  - Living-off-the-land
  - Signature spoofing
  - Polymorphic encoding
  - Heuristic bypass
  answer: 0
  points: 1
  explain: Living-off-the-land attacks abuse legitimate, pre-installed system tools, making them harder for both signature and behavioral engines to distinguish from normal administrative activity.
- id: q6
  type: mcq
  prompt: How does Endpoint Detection and Response (EDR) primarily differ from traditional antivirus?
  options:
  - EDR only works on servers, never on laptops or desktops
  - EDR continuously records endpoint activity and gives responders tools to investigate and contain threats retroactively, beyond just blocking at scan time
  - EDR replaces the need for any signature-based scanning
  - EDR requires no central console and runs independently on each device
  answer: 1
  points: 1
  explain: EDR builds a searchable history of endpoint activity and adds response tools like remote isolation, going beyond antivirus's block-at-scan-time model.
- id: q7
  type: code
  prompt: Implement the endpoint detection engine in problem/ (graded automatically).
  grader: problem
  points: 3
