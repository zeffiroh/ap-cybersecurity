atom: 4.3.a
title: Device hardening
lo:
- 4.3.A
items:
- id: q1
  type: mcq
  prompt: A network administrator sets up a new router and immediately connects it to the internet without changing any settings. What is the PRIMARY security risk?
  options:
  - "The router will advertise its network name to neighbors"
  - "The router's firmware is probably out of date, which is the only real risk"
  - "Attackers will be able to see the router's MAC address"
  - "Default credentials allow any attacker to log in as administrator"
  answer: 3
  points: 1
  explain: "Factory defaults like admin/admin are published in manuals and built into attack tools and botnets (Mirai). Anyone who can reach the login page owns the router. Outdated firmware is also a risk, which is why hardening includes updating it, but the default password is the immediate, trivially exploited one."
- id: q2
  type: mcq
  prompt: Which action BEST describes the principle of least privilege when hardening a workstation?
  options:
  - "Giving users admin rights only on their own workstation"
  - "Removing all user accounts and using one shared admin account that IT controls"
  - "Letting users request admin rights, granted automatically for 24 hours"
  - "Granting each user account only the permissions needed for their job functions"
  answer: 3
  points: 1
  explain: "Least privilege means each account gets only what its work requires. Local admin rights let malware a user runs install itself system-wide; a shared admin account destroys accountability; and automatic temporary admin is still unreviewed admin."
- id: q3
  type: multi
  prompt: Select ALL items that are part of device hardening. (Choose all that apply.)
  options:
  - Change default passwords
  - Disable services not needed for the device's function
  - Enable full-disk encryption
  - Enable Telnet for easy remote access
  answer:
  - 0
  - 1
  - 2
  points: 3
  explain: Changing defaults, disabling unneeded services, and enabling encryption are all hardening steps. Telnet is an unencrypted protocol that increases attack surface.
- id: q4
  type: mcq
  prompt: What is 'configuration drift' in the context of device hardening?
  options:
  - When a device physically moves to a new network location
  - The gradual accumulation of unauthorized or unintended configuration changes over time
  - The planned update of firmware to a new version
  - The process of migrating from one security baseline to another
  answer: 1
  points: 1
  explain: Configuration drift occurs when small changes accumulate and unknowingly re-open attack surface that was previously closed.
- id: q5
  type: short
  prompt: Name the term for the total set of ways an attacker could interact with or exploit a device.
  accept:
  - attack surface
  - attack surface area
  - surface area
  points: 1
  explain: The attack surface is what hardening aims to reduce by removing unnecessary entry points.
- id: q6
  type: code
  prompt: Implement the hardening-baseline checker in problem/ (graded automatically).
  grader: problem
  points: 3
