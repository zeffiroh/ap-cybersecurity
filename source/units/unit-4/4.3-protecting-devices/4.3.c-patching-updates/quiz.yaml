# Canonical item bank for atom 4.3.c (single source of truth).
# Used by the skill quiz page and the topic's practice questions.
atom: 4.3.c
title: Patching and regular updates
lo:
- 4.3.B
- 4.3.C
items:
- id: q1
  type: mcq
  prompt: What is a 'zero-day' vulnerability?
  options:
  - A vulnerability that has been patched for zero days, meaning it was just fixed
  - A vulnerability with a CVSS score of exactly zero
  - A vulnerability being actively exploited before any patch exists
  - A vulnerability that only affects devices zero days old
  answer: 2
  points: 1
  explain: A zero-day is exploited in the wild before a patch is available, meaning defenders have had zero days of protection.
- id: q2
  type: mcq
  prompt: Most real-world breaches exploit which type of vulnerability?
  options:
  - Zero-days, because no patch can stop them
  - N-days, because a patch exists but the target has not yet applied it
  - Vulnerabilities with a CVSS score below 1.0
  - Only vulnerabilities in end-of-life software
  answer: 1
  points: 1
  explain: 'The overwhelming majority of breaches exploit n-day vulnerabilities: a patch already exists, but the target system has not applied it yet.'
- id: q3
  type: multi
  prompt: Select ALL legitimate reasons an organization might delay applying a patch immediately. (Choose all that apply.)
  options:
  - The patch has not yet been tested and could break a business-critical application
  - Applying the patch requires a scheduled reboot that must avoid business hours
  - The vulnerability does not actually exist and was invented by the vendor
  - The organization has thousands of endpoints requiring a staged rollout
  answer:
  - 0
  - 1
  - 3
  points: 3
  explain: Compatibility risk, downtime, and rollout scale at enterprise size are all real reasons for a tested, staged patch process rather than instant deployment.
- id: q4
  type: mcq
  prompt: A public-facing web server has a critical CVSS 9.1 vulnerability that CISA confirms is being actively exploited in the wild right now. What should happen?
  options:
  - Apply emergency out-of-cycle patching as urgently as possible
  - Ignore it since the server has worked fine so far
  - Schedule the patch for the next routine monthly maintenance window
  - Wait for an end user to report a problem before acting
  answer: 0
  points: 1
  explain: Critical severity plus internet-facing exposure plus confirmed active exploitation is the highest-urgency combination, justifying emergency out-of-cycle patching.
- id: q5
  type: short
  prompt: Name the term for software that no longer receives vendor security patches, requiring compensating controls instead of patching.
  accept:
  - end-of-life
  - end of life
  - eol
  - eol software
  points: 1
  explain: End-of-life (EOL) software receives no further vendor patches; organizations must rely on compensating controls like network isolation.
- id: q6
  type: mcq
  prompt: Why does publishing a patch increase urgency to apply it quickly?
  options:
  - Patches always contain new features attackers want to steal
  - Patches disable the antivirus on the system automatically
  - The patch itself (or its public disclosure) reveals details attackers can reverse-engineer into a working exploit
  - Publishing a patch has no effect on attacker behavior
  answer: 2
  points: 1
  explain: Once a patch ships, attackers can reverse-engineer the fix (or read the public CVE disclosure) to build exploit code, starting a race between defenders and attackers.
- id: q7
  type: code
  prompt: Implement the patch-prioritization engine in problem/ (graded automatically).
  grader: problem
  points: 3
