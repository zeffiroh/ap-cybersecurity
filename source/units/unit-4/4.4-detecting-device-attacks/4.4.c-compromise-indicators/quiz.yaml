# Canonical item bank for atom 4.4.c (single source of truth).
# Used by the skill quiz page and the topic's practice questions.
atom: 4.4.c
title: Identifying compromised devices (indicators of compromise)
lo:
- 4.4.B
- 4.4.C
items:
- id: q1
  type: mcq
  prompt: What is an indicator of compromise (IOC)?
  options:
  - A guaranteed proof that an attack is currently in progress
  - A firewall rule that blocks all inbound traffic
  - Forensic evidence (a file, connection, account, or behavior) suggesting a device has been breached
  - A password complexity requirement
  answer: 2
  points: 1
  explain: An IOC is a piece of forensic evidence suggesting compromise; it is a clue, not proof by itself.
- id: q2
  type: mcq
  prompt: Why is a single IOC usually not enough to confidently declare a device compromised?
  options:
  - IOCs are never reliable evidence
  - IOCs can only be observed by antivirus software
  - Only network-based IOCs count as real evidence
  - A single artifact often has an innocent explanation; confident verdicts come from combining multiple independent IOCs
  answer: 3
  points: 1
  explain: One IOC alone may have a benign cause. Combining multiple independent IOCs into a weighted score produces a much more confident verdict.
- id: q3
  type: multi
  prompt: Select ALL examples of host-based indicators of compromise. (Choose all that apply.)
  options:
  - A new administrator account nobody remembers creating
  - A registry run-key added for persistence
  - Antivirus/EDR protection silently disabled
  - A DNS lookup for an algorithmically generated domain name
  answer:
  - 0
  - 1
  - 2
  points: 3
  explain: New admin accounts, registry persistence, and disabled security tooling are host-based IOCs. Algorithmically generated domain lookups are a network-based IOC.
- id: q4
  type: mcq
  prompt: 'Using weight table: disabled AV = 5, new admin account = 4, thresholds clean<4, suspicious 4-7, compromised>=8. A device shows BOTH IOCs. What is the verdict?'
  options:
  - Clean, because neither IOC alone reaches 8
  - Suspicious, because two IOCs together should never be scored as fully compromised
  - Cannot be determined without more information
  - Compromised, because the combined score (9) is at or above the compromised threshold
  answer: 3
  points: 1
  explain: 5 + 4 = 9, which is >= 8, the compromised threshold. Weighted scores combine across multiple IOCs, not just the strongest single one.
- id: q5
  type: short
  prompt: Name the attacker technique of maintaining access to a compromised system even after the initial foothold is discovered or the system is rebooted.
  accept:
  - persistence
  points: 1
  explain: Persistence describes techniques (like a new admin account or a registry run key) that let an attacker regain access even after remediation attempts.
- id: q6
  type: mcq
  prompt: How does an indicator of attack (IOA) differ from an indicator of compromise (IOC)?
  options:
  - They are exactly the same concept with different names
  - IOAs only apply to network traffic, never to hosts
  - An IOA focuses on catching attacker technique/intent while an attack is in progress; an IOC is typically after-the-fact evidence
  - IOCs can only be detected by human analysts, never automated tools
  answer: 2
  points: 1
  explain: IOAs aim to catch an attack while it is happening (technique/intent); IOCs are typically evidence confirming something already occurred.
- id: q7
  type: code
  prompt: Implement the weighted IOC-scoring engine in problem/ (graded automatically).
  grader: problem
  points: 3
