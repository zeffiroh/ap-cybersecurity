atom: 4.4.a
title: Endpoint detection and response (EDR)
lo:
- 4.4.A
items:
- id: q1
  type: mcq
  prompt: What distinguishes EDR from traditional antivirus software?
  options:
  - EDR only checks files against known signatures at rest
  - EDR monitors continuous runtime behavior and can respond by isolating or killing processes
  - EDR runs only at the network perimeter, not on individual devices
  - EDR requires internet access to query a cloud threat database
  answer: 1
  points: 1
  explain: 'EDR goes beyond signature scanning: it watches live process, file, network, and registry events and can respond automatically (isolate, kill, quarantine), unlike antivirus which primarily scans static files.'
- id: q2
  type: multi
  prompt: Which of the following are telemetry streams that an EDR agent typically collects? Select ALL that apply.
  options:
  - Process creation and termination events
  - File system changes (writes, renames, deletes)
  - Physical room temperature from HVAC sensors
  - Network connections opened by each process
  answer:
  - 0
  - 1
  - 3
  points: 3
  explain: EDR collects process events, file-system events, registry events, and network connection events from each endpoint. HVAC sensors are not endpoint telemetry.
- id: q3
  type: mcq
  prompt: An attacker uses PowerShell (a legitimate Windows tool) to download and run malware. Which EDR capability is MOST likely to catch this, and why?
  options:
  - Signature matching, because PowerShell is on the known-bad list
  - Endpoint isolation, because PowerShell always triggers isolation
  - File quarantine, because the PowerShell binary itself is quarantined
  - Behavioral detection, because the unusual parent-child process relationship and outbound connection deviate from the baseline
  answer: 3
  points: 1
  explain: Living-off-the-land attacks use legitimate tools, so no signature fires. Behavioral detection flags the deviation from normal patterns (e.g., Office spawning PowerShell, PowerShell opening an outbound connection).
- id: q4
  type: mcq
  prompt: When an EDR platform 'isolates' an endpoint, what does that mean?
  options:
  - The device's hard drive is wiped immediately
  - All network connections are cut except the EDR management channel, stopping lateral movement
  - The user is logged out and their account is disabled permanently
  - The device is powered off remotely
  answer: 1
  points: 1
  explain: Isolation cuts all network access except the EDR console channel, preventing the attacker from moving to other systems while the analyst can still investigate remotely.
- id: q5
  type: short
  prompt: Name the attacker technique where legitimate operating-system tools like PowerShell or WMI are misused to carry out malicious actions.
  accept:
  - living off the land
  - living-off-the-land
  - lolbins
  - lol bins
  - lol-bins
  points: 1
  explain: Living off the land (also abbreviated LoLBins) describes using built-in OS tools for malicious purposes, making detection harder because no foreign malware binary appears on disk.
- id: q6
  type: mcq
  prompt: Why is it incorrect to assume a device is clean just because no EDR alert has fired?
  options:
  - "EDR only scans files when they are first downloaded"
  - "EDR alerts are hidden from analysts until they are confirmed"
  - "EDR detection relies on signatures and baselines that may not cover every possible attack"
  - "EDR stops monitoring a device once it has been scanned clean"
  answer: 2
  points: 1
  explain: "No detection tool sees everything: new techniques, careful attackers who blend in with normal activity, or gaps in what the agent records can all produce false negatives. \"No alert\" means \"nothing matched our detections\", not \"nothing happened\", which is why teams also do threat hunting."
- id: q7
  type: code
  prompt: Implement the EDR telemetry analyzer in problem/ (graded automatically).
  grader: problem
  points: 3
