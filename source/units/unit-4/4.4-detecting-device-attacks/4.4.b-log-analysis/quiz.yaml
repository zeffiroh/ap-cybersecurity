atom: 4.4.b
title: Log analysis
lo:
- 4.4.B
- 4.4.D
items:
- id: q1
  type: mcq
  prompt: Why is a single failed login log entry usually NOT enough evidence of an attack?
  options:
  - "Failed logins are only logged when the account is locked"
  - "Attackers never fail more than once because they use stolen passwords"
  - "A single failure is ordinary human error; attacks are recognized through correlated patterns across multiple entries"
  - "Single entries are compressed and cannot be read until more arrive"
  answer: 3
  points: 1
  explain: "Everyone mistypes passwords. One failure means almost nothing; what matters is the pattern: many failures, many accounts, unusual sources, or a failure streak followed by a success. That is why analysts correlate entries instead of reacting to each one."
- id: q2
  type: mcq
  prompt: What does 'correlation' mean in the context of log analysis?
  options:
  - "Comparing a log entry to a list of known-bad IP addresses"
  - "Linking multiple log entries together (by user, IP, or time) to reveal a pattern invisible in any single entry"
  - "Calculating the average number of log entries per hour"
  - "Sorting log entries by severity so the worst appear first"
  answer: 1
  points: 1
  explain: "Correlation connects events from different places or times: the same IP failing logins on three servers, or a VPN login followed by a new admin account. Each event alone looks routine; together they reveal an attack. Checking an IP against a blocklist is matching, not correlation."
- id: q3
  type: multi
  prompt: Select ALL statements that are TRUE about SIEM platforms.
  options:
  - They ingest logs from many systems across an organization
  - They apply correlation rules automatically at scale to raise alerts
  - They eliminate the need for any human security analyst
  - They can generate false positives if detection thresholds are set too sensitively
  answer:
  - 0
  - 1
  - 3
  points: 3
  explain: SIEMs centralize and correlate logs at scale, but still require analysts to investigate alerts; overly sensitive rules still cause false positives.
- id: q4
  type: mcq
  prompt: An authentication log shows 6 failed logins for the same user within 45 seconds, followed immediately by a success from the same IP. What does this pattern most likely indicate?
  options:
  - The user simply forgot their password and does not need investigation
  - A brute-force attack that guessed the password after repeated attempts
  - A hardware failure on the authentication server
  - Normal end-of-day login behavior
  answer: 1
  points: 1
  explain: Multiple rapid failed attempts followed by a success from the same source is the textbook signature of a brute-force attack succeeding.
- id: q5
  type: short
  prompt: Name the phenomenon where overly sensitive detection thresholds cause so many false alarms that analysts start ignoring alerts, potentially missing real attacks.
  accept:
  - alert fatigue
  - alert-fatigue
  points: 1
  explain: Alert fatigue occurs when detection rules are tuned too sensitively, generating excessive false positives that desensitize analysts.
- id: q6
  type: mcq
  prompt: Why are logs valuable even after an attacker has already left a compromised system?
  options:
  - "Logs let the team reverse the attacker's changes automatically"
  - "Logs are the record used for forensic reconstruction of what the attacker did"
  - "Logs prove the attacker's identity in court on their own"
  - "Logs show which antivirus product failed"
  answer: 1
  points: 1
  explain: "After an intrusion, logs are the timeline: when the attacker got in, which accounts they used, what they touched and where data went. That drives cleanup, notification and lessons learned. Logs support evidence but rarely prove identity alone, and they do not undo changes."
- id: q7
  type: code
  prompt: Implement the brute-force log correlator in problem/ (graded automatically).
  grader: problem
  points: 3
