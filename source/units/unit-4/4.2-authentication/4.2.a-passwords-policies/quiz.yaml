# Canonical item bank for atom 4.2.a (single source of truth).
# Used by the skill quiz page and the topic's practice questions.
atom: 4.2.a
title: Passwords and password policies
lo:
- 4.2.A
items:
- id: q1
  type: mcq
  prompt: According to NIST SP 800-63B, which practice is recommended when a user creates a new password?
  options:
  - Require at least one uppercase letter, one digit, and one symbol
  - Force the user to change the password every 90 days
  - Check the candidate against a list of known-compromised passwords and reject matches
  - Block copy-paste to prevent shoulder surfing
  answer: 2
  points: 1
  explain: NIST 800-63B dropped mandatory complexity rules and periodic rotation, but does require checking new passwords against known-breach lists.
- id: q2
  type: multi
  prompt: Which of the following are valid reasons an organization enforces an account lockout policy? (Select ALL that apply.)
  options:
  - Prevents automated online guessing attacks
  - Eliminates the need for password hashing
  - Forces attackers to slow down their credential testing
  - Makes brute-force infeasible in an interactive login scenario
  answer:
  - 0
  - 2
  - 3
  points: 2
  explain: Lockout blocks fast online guessing and slows credential testing. It does not replace hashing, which protects the stored credential database offline.
- id: q3
  type: mcq
  prompt: An attacker obtains a copy of a site's password database. The passwords are stored with bcrypt. Why does this algorithm make cracking harder than MD5?
  options:
  - Bcrypt produces longer hashes
  - Bcrypt hashes are reversible, allowing easier comparison
  - Bcrypt requires a network connection to verify
  - Bcrypt is intentionally slow, making each guess computationally expensive
  answer: 3
  points: 1
  explain: Bcrypt is a deliberately slow password-hashing algorithm; each guess takes orders of magnitude longer than with MD5, making large-scale offline cracking impractical.
- id: q4
  type: mcq
  prompt: What is the primary purpose of a cryptographic salt in password storage?
  options:
  - To make the password longer before the user sees it
  - To encrypt the password so it can be decrypted later
  - To ensure two users with the same password have different stored hashes
  - To enforce complexity rules automatically
  answer: 2
  points: 1
  explain: A salt is a unique random value per user. Two users with identical passwords produce different hashes, defeating precomputed rainbow-table attacks.
- id: q5
  type: short
  prompt: Name the two attack types that increasing password LENGTH most directly defends against.
  accept:
  - brute-force
  - brute force
  - dictionary
  - dictionary attack
  - brute-force and dictionary
  points: 1
  explain: Length exponentially expands the search space for brute-force attacks and reduces overlap with dictionary word lists.
- id: q6
  type: code
  prompt: Implement validate_password() in problem/ (graded automatically by tests.py).
  grader: problem
