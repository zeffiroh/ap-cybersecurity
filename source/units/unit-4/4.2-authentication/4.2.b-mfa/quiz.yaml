# Canonical item bank for atom 4.2.b (single source of truth).
# Used by the skill quiz page and the topic's practice questions.
atom: 4.2.b
title: Multi-factor authentication
lo:
- 4.2.A
- 4.2.B
items:
- id: q1
  type: mcq
  prompt: A user logs in with a password, then enters a memorized answer to a security question. Is this true multi-factor authentication?
  options:
  - No, both credentials are 'something you know', the same factor category
  - Yes, two credentials were entered
  - Yes, because a security question is a possession factor
  - No, security questions are never allowed in authentication
  answer: 0
  points: 1
  explain: A password and a security-question answer are both knowledge factors. True MFA requires two DIFFERENT factor categories, not just two credentials.
- id: q2
  type: mcq
  prompt: Which factor category does a hardware security key (like a FIDO2/YubiKey device) belong to?
  options:
  - Something you know
  - Something you have (possession)
  - Something you are (inherence)
  - It is not a factor at all
  answer: 1
  points: 1
  explain: A hardware key is a physical object the user possesses, the possession factor category.
- id: q3
  type: multi
  prompt: Select ALL statements that are TRUE about SMS-based one-time codes used for MFA.
  options:
  - They are vulnerable to SIM-swapping attacks
  - They are immune to phishing because the code changes every time
  - They can be intercepted or relayed by an adversary-in-the-middle phishing kit
  - They still combine a knowledge factor (password) with a possession factor (phone)
  answer:
  - 0
  - 2
  - 3
  points: 2
  explain: SMS codes are possession-factor evidence but are vulnerable to SIM swapping and real-time phishing relay; a changing code does not prevent an attacker from relaying it live to the real site.
- id: q4
  type: mcq
  prompt: An attacker who already has a victim's password sends them ten push-approval MFA prompts in a row until the victim taps Approve just to stop the notifications. What is this attack called?
  options:
  - SIM swapping
  - MFA fatigue (push bombing)
  - TOTP replay
  - Credential stuffing
  answer: 1
  points: 1
  explain: Repeatedly sending push prompts until an annoyed or confused user approves one is MFA fatigue, also called push bombing.
- id: q5
  type: mcq
  prompt: Why is FIDO2/WebAuthn considered phishing-resistant compared to a typed authenticator-app code?
  options:
  - It cryptographically binds the response to the legitimate site's exact domain, so a fake login page cannot obtain a valid response
  - It never requires a second device
  - It does not require a password at all, ever
  - It uses a longer numeric code than TOTP
  answer: 0
  points: 1
  explain: FIDO2/WebAuthn performs a domain-bound cryptographic challenge-response, so even a convincing fake site cannot capture a usable credential, unlike a typed code, which a user can be tricked into entering anywhere.
- id: q6
  type: short
  prompt: Name the attack in which an adversary tricks or bribes a mobile carrier into porting a victim's phone number to an attacker-controlled SIM card, in order to intercept SMS-based MFA codes.
  accept:
  - sim swap
  - sim swapping
  - sim-swap
  - sim swap attack
  - simjacking
  points: 1
  explain: SIM swapping transfers the victim's phone number to a SIM the attacker controls, letting the attacker receive SMS MFA codes intended for the victim.
- id: q7
  type: code
  prompt: Implement the MFA classifier in problem/ (graded automatically by tests.py).
  grader: problem
  points: 3
