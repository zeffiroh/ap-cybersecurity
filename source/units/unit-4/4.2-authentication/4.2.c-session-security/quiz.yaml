# Canonical item bank for atom 4.2.c (single source of truth).
# Used by the skill quiz page and the topic's practice questions.
atom: 4.2.c
title: Session security
lo:
- 4.2.B
items:
- id: q1
  type: mcq
  prompt: An attacker sends a victim a link containing a session ID the attacker already knows. The victim logs in and the server keeps using that same ID. Which attack is this?
  options:
  - Session hijacking
  - SQL injection
  - Session fixation
  - Brute force
  answer: 2
  points: 1
  explain: The attacker supplied the session ID BEFORE the victim authenticated, this is session fixation, distinct from hijacking a token that was already live.
- id: q2
  type: mcq
  prompt: Which cookie attribute prevents JavaScript (including injected XSS scripts) from reading the session cookie?
  options:
  - HttpOnly
  - Secure
  - SameSite
  - Max-Age
  answer: 0
  points: 1
  explain: The HttpOnly flag hides the cookie from JavaScript entirely, so even a successful XSS injection cannot read and exfiltrate it.
- id: q3
  type: multi
  prompt: Select ALL statements that are TRUE about session timeouts.
  options:
  - An idle timeout ends a session after a period of no activity
  - An absolute timeout ends a session after a fixed total duration regardless of activity
  - A session with no timeout configured poses no additional risk
  - Timeouts limit how long a stolen or fixated token remains useful
  answer:
  - 0
  - 1
  - 3
  points: 2
  explain: Idle and absolute timeouts are distinct expiration mechanisms, and both limit the damage a leaked token can do. A session with no timeout at all is a real risk, not a neutral choice.
- id: q4
  type: mcq
  prompt: A user clicks 'Log Out' and their browser cookie is deleted, but the server never marks the session record as invalid. What is the consequence?
  options:
  - No consequence; deleting the cookie is sufficient
  - The user's password is exposed
  - A token captured earlier by an attacker remains valid and usable
  - The session is automatically regenerated
  answer: 2
  points: 1
  explain: Logout must invalidate the session server-side. If it does not, any copy of the token an attacker already captured continues to work, regardless of the client-side cookie deletion.
- id: q5
  type: short
  prompt: Name the defensive technique of issuing a brand-new session ID at login (and at privilege change) that specifically defeats session fixation.
  accept:
  - session regeneration
  - regenerate session id
  - session id regeneration
  - regenerating the session id
  points: 1
  explain: Session regeneration discards any attacker-planted ID at the moment of login, so fixation fails even if the attacker set an ID on the victim's browser beforehand.
- id: q6
  type: mcq
  prompt: A session cookie is sent only over HTTPS due to one cookie flag, but is still readable by page JavaScript because a different flag is missing. Which flag is MISSING?
  options:
  - HttpOnly
  - Secure
  - Domain
  - Path
  answer: 0
  points: 1
  explain: Secure restricts transmission to HTTPS; HttpOnly is the separate flag that hides the cookie from JavaScript. HTTPS alone does not stop an XSS-based cookie read.
- id: q7
  type: code
  prompt: Implement the session-incident classifier in problem/ (graded automatically by tests.py).
  grader: problem
  points: 3
