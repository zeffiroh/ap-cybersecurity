atom: 4.2.d
title: Least privilege and access control models
lo:
- 4.2.B
- 4.2.C
items:
- id: q1
  type: mcq
  prompt: What does the principle of least privilege (PoLP) require?
  options:
  - A subject should be granted only the minimum access needed for its job function
  - Every account should have administrator access by default
  - All employees in the same department should share one account
  - Access should never be reviewed once granted
  answer: 0
  points: 1
  explain: PoLP means granting only the minimum access required to perform the current job function, nothing more.
- id: q2
  type: mcq
  prompt: A file's owner directly decides who else may read or write it, without any central authority involved. Which access control model is this?
  options:
  - MAC
  - RBAC
  - ABAC
  - DAC
  answer: 3
  points: 1
  explain: Discretionary Access Control (DAC) lets the resource owner grant or revoke access directly; classic Unix file permissions are the standard example.
- id: q3
  type: mcq
  prompt: A system grants access dynamically based on the user's department, the sensitivity label of the resource, and whether the request happens during business hours. Which model is this?
  options:
  - ABAC
  - MAC
  - RBAC
  - DAC
  answer: 0
  points: 1
  explain: Attribute-Based Access Control (ABAC) evaluates attributes of the user, resource, and environment at request time to make a dynamic access decision.
- id: q4
  type: multi
  prompt: Select ALL statements that are TRUE about over-privileged accounts.
  options:
  - They increase the blast radius if the account is compromised
  - They eliminate insider-threat risk because trusted employees hold them
  - Malware executed under an over-privileged session inherits that account's broad access
  - They make ransomware propagation to additional systems more likely
  answer:
  - 0
  - 2
  - 3
  points: 2
  explain: Over-provisioning expands blast radius, lets malware inherit broader privileges, and increases ransomware spread risk. Trust does not eliminate insider-threat or compromise risk.
- id: q5
  type: short
  prompt: Name the term for the silent accumulation of unnecessary access rights over time as an employee's role changes.
  accept:
  - privilege creep
  - access creep
  - permission creep
  points: 1
  explain: Privilege creep is the accumulation of unneeded access over time; it is mitigated by periodic access reviews/recertification.
- id: q6
  type: mcq
  prompt: Which statement correctly distinguishes RBAC from ABAC?
  options:
  - RBAC and ABAC are the same thing, just different names
  - RBAC assigns static permissions via roles; ABAC evaluates dynamic attributes at request time
  - RBAC is only used in government systems; ABAC is only used in enterprises
  - ABAC does not support access denial, only approval
  answer: 1
  points: 1
  explain: RBAC attaches fixed permissions to a role and users inherit that role's access. ABAC makes a dynamic, per-request decision based on attributes of user, resource, and environment.
