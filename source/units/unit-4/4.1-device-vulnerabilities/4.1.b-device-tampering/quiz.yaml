# Canonical item bank for atom 4.1.b (single source of truth).
# Used by the skill quiz page and the topic's practice questions.
atom: 4.1.b
title: Device tampering and physical compromise
lo:
- 4.1.B
items:
- id: q1
  type: mcq
  prompt: A security analyst discovers a small adapter connected between a desktop computer's USB port and the keyboard cable. No software alerts have been triggered. What type of physical attack is this?
  options:
  - USB Rubber Ducky
  - Cold boot attack
  - Hardware keylogger
  - BIOS malware
  answer: 2
  points: 1
  explain: A hardware keylogger sits between the keyboard and USB port to log typing physically without software detection.
- id: q2
  type: multi
  prompt: Which of the following mitigations specifically address threats arising from physical theft of a laptop hard drive?
  options:
  - Full Disk Encryption (FDE)
  - Strong operating system logon passwords
  - Trusted Platform Module (TPM) integration
  - Software-based firewalls
  answer:
  - 0
  - 2
  points: 2
  explain: Full Disk Encryption (FDE) prevents an attacker from reading data off a stolen drive, and TPM checks boot integrity before releasing keys. OS login passwords and local firewalls can be bypassed if the hard drive is physically removed and read on a different system.
- id: q3
  type: short
  prompt: Name the keystroke injection tool disguised as a standard USB flash drive that executes pre-programmed commands by mimicking a keyboard.
  accept:
  - usb rubber ducky
  - rubber ducky
  - keystroke injector
  - keystroke injection tool
  points: 1
  explain: A USB Rubber Ducky is a classic physical attack tool that mimics a keyboard to run commands at high speed.
- id: q4
  type: mcq
  prompt: An attacker sprays compressed air (upside down) on RAM chips immediately after a workstation is powered off, then quickly moves the modules to another machine to read their contents. What is this attack called?
  options:
  - Chassis intrusion
  - Hardware keylogger
  - USB Rubber Ducky
  - Cold boot attack
  answer: 3
  points: 1
  explain: A cold boot attack exploits the fact that RAM contents fade gradually rather than instantly; cooling the chips slows that decay long enough to extract recently-loaded keys or passwords.
- id: q5
  type: mcq
  prompt: A server room has a keypad lock on its door, but an attacker who is already an employee with legitimate badge access removes a hard drive and reads it on a personal laptop. Which control would have stopped this?
  options:
  - A stronger door lock
  - A longer OS login password
  - A security camera in the lobby
  - Full Disk Encryption (FDE)
  answer: 3
  points: 1
  explain: Room-level physical locks only stop people who lack access to the room. FDE protects the data itself so that even someone who can physically remove the drive cannot read it without the decryption key.
- id: q6
  type: short
  prompt: Name the term for a sticker or label on a device's case or port that visibly tears or changes color if removed, letting staff confirm at a glance that the device has not been opened.
  accept:
  - tamper-evident seal
  - tamper evident seal
  - tamper seal
  - tamper-proof seal
  points: 1
  explain: Tamper-evident seals provide a low-cost, visual way to detect physical tampering after the fact, commonly used on ATMs and point-of-sale terminals.
- id: q7
  type: code
  prompt: Implement the physical audit log parser in problem/ (graded automatically by tests.py).
  grader: problem
  points: 3
