# Canonical item bank for atom 4.1.c (single source of truth).
# Used by the skill quiz page and the topic's practice questions.
atom: 4.1.c
title: IoT device vulnerabilities
lo:
- 4.1.A
- 4.1.C
items:
- id: q1
  type: mcq
  prompt: A smart camera is still logging in with the username/password it shipped with from the factory. What is this vulnerability called?
  options:
  - Outdated firmware
  - Unauthenticated API
  - Shadow IoT
  - Default credentials
  answer: 3
  points: 1
  explain: Default credentials are factory-set login details that were never changed by the owner; attackers scan for and exploit them automatically.
- id: q2
  type: mcq
  prompt: Why is the 2016 Mirai botnet a significant example in IoT security?
  options:
  - It was the first computer virus ever discovered
  - It encrypted victim files and demanded a ransom
  - It only affected desktop computers, not IoT devices
  - It hijacked IoT devices via default Telnet credentials and used them to launch record-setting DDoS attacks
  answer: 3
  points: 1
  explain: Mirai scanned the internet for IoT devices still using default Telnet credentials, enlisted them into a botnet, and used the combined force for massive DDoS attacks.
- id: q3
  type: multi
  prompt: Select ALL statements that are TRUE about IoT device risk.
  options:
  - A device that isn't directly internet-facing can still be reached by other devices already on the same local network
  - Manufacturers always issue timely firmware updates for the life of the product
  - UPnP can automatically open a port on a router, exposing a device without the owner realizing it
  - Attackers often want IoT devices as botnet nodes or network pivot points, not for the device's own data
  answer:
  - 0
  - 2
  - 3
  points: 2
  explain: Devices on a shared network can attack each other regardless of internet exposure; UPnP can silently expose management interfaces; attackers value IoT devices mainly for scale (botnets) and as pivot points. Many manufacturers do NOT maintain updates for the full product lifetime, devices often become end-of-life (EOL).
- id: q4
  type: mcq
  prompt: Which property MOST distinguishes an EOL (end-of-life) IoT device's risk from a device with an exposed management port?
  options:
  - EOL devices no longer connect to Wi-Fi at all
  - EOL devices always use encrypted traffic by default
  - EOL devices no longer receive firmware updates, so any known vulnerability stays permanently unpatched, regardless of ports or credentials
  - EOL devices cannot be part of a botnet
  answer: 2
  points: 1
  explain: End-of-life status means the manufacturer has stopped issuing updates, so any vulnerability discovered in the firmware is never fixed for the rest of the device's life.
- id: q5
  type: short
  prompt: Name the term for devices connected to a network without IT's knowledge, approval, or security oversight.
  accept:
  - shadow iot
  - shadow it
  - shadow devices
  points: 1
  explain: Shadow IoT refers to unapproved, unmonitored devices on a network that silently expand the attack surface.
- id: q6
  type: mcq
  prompt: A device's mobile app sends commands to it over the local Wi-Fi network with no encryption at all. What is the MOST direct consequence?
  options:
  - The device automatically becomes part of a botnet
  - The device's firmware will stop receiving updates
  - Anyone else on the same network segment can read or alter the traffic in transit
  - The manufacturer's cloud API becomes unauthenticated
  answer: 2
  points: 1
  explain: Unencrypted traffic can be intercepted (read) or tampered with (altered) by anyone who can observe the same network segment.
- id: q7
  type: code
  prompt: Implement the IoT device audit classifier in problem/ (graded automatically by tests.py).
  grader: problem
  points: 3
