# Canonical item bank for atom 2.1.c (single source of truth).
atom: 2.1.c
title: 'Risk language: likelihood, impact, and security goals'
lo:
- 2.1.C
items:
- id: q1
  type: mcq
  prompt: An organization decides to buy cyber insurance to cover potential losses from ransomware attacks. Which risk treatment strategy does this represent?
  options:
  - Mitigation
  - Transfer
  - Acceptance
  - Avoidance
  answer: 1
  points: 1
  explain: Risk transference shifts the financial burden of a risk to a third party, such as an insurance company or outsourced provider.
- id: q2
  type: mcq
  prompt: A database containing public marketing materials is deemed to have a low risk score. The IT team decides not to install any additional security controls for it because the cost of controls exceeds the value of the database. What is this strategy?
  options:
  - Mitigation
  - Transfer
  - Acceptance
  - Avoidance
  answer: 2
  points: 1
  explain: Risk acceptance means acknowledging the risk but taking no active measures to reduce it, which is appropriate for low-value assets where controls are too costly.
- id: q3
  type: mcq
  prompt: To prevent unauthorized access to its payment system, a school decides to stop storing credit card data entirely, outsourcing all payment processing to a verified third-party website. What is this strategy?
  options:
  - Mitigation
  - Transfer
  - Acceptance
  - Avoidance
  answer: 3
  points: 1
  explain: Risk avoidance involves changing plans or processes to completely eliminate the activity that creates the risk, thereby removing the threat entirely.
- id: q4
  type: mcq
  prompt: If a security threat has a Likelihood score of 4 (High) and an Impact score of 3 (Medium), what is the calculated Risk Score?
  options:
  - '12'
  - '1'
  - '7'
  - '1.33'
  answer: 0
  points: 1
  explain: Risk Score is calculated by multiplying Likelihood by Impact. Here, 4 * 3 = 12.
- id: q5
  type: short
  prompt: What term is used to describe any security control that is implemented to reduce either the likelihood or the impact of a risk?
  accept:
  - mitigation
  - mitigate
  - risk mitigation
  points: 1
  explain: Mitigation (or risk reduction) is the practice of applying controls to lower the probability or consequences of an incident.
- id: q6
  type: code
  prompt: Implement the risk treatment calculator in problem/ (graded automatically by tests.py).
  grader: problem
  points: 3
