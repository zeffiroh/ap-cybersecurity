# Canonical item bank for atom 2.1.b (single source of truth).
atom: 2.1.b
title: Threat actors and their motivations
lo:
- 2.1.B
items:
- id: q1
  type: mcq
  prompt: An attacker deploys ransomware to encrypt university databases and demands a Bitcoin payment in exchange for the key. Which category of threat actor does this most likely represent?
  options:
  - Cybercriminal
  - Nation-state actor
  - Script kiddie
  - Hacktivist
  answer: 0
  points: 1
  explain: Cybercriminals are primarily motivated by financial gain. Ransomware attacks that demand payment are classic cybercriminal operations.
- id: q2
  type: mcq
  prompt: A quiet, long-duration network intrusion is discovered where custom malware has been slowly copying research emails over eight months. What style of campaign is this?
  options:
  - Script kiddie attack
  - Hacktivist defacement
  - Advanced Persistent Threat (APT)
  - Accidental insider leak
  answer: 2
  points: 1
  explain: An Advanced Persistent Threat (APT) is a stealthy, high-capability, long-term campaign typically conducted by state-sponsored actors to gather intelligence or exfiltrate data without detection.
- id: q3
  type: mcq
  prompt: Which threat actor group is most likely to target an organization's public-facing website with defacement to promote an ideological cause?
  options:
  - Nation-state actor
  - Script kiddie
  - Malicious insider
  - Hacktivist
  answer: 3
  points: 1
  explain: Hacktivists are motivated by ideological or political goals and often conduct loud, highly visible attacks (like website defacement) to generate publicity for their cause.
- id: q4
  type: multi
  prompt: Which of the following are recognized sub-types of insider threats? Select all that apply.
  options:
  - Script kiddies using shared credentials
  - Negligent employees who accidentally leak files
  - Disgruntled workers seeking revenge
  - Malicious employees acting for financial gain
  answer:
  - 1
  - 2
  - 3
  points: 3
  explain: Insider threats include malicious insiders (seeking financial or other gains), disgruntled employees (seeking revenge), and negligent insiders (who cause accidental leaks or security failures).
- id: q5
  type: short
  prompt: What term is used to describe a low-skilled attacker who relies on pre-built, publicly available tools and scripts to launch attacks?
  accept:
  - script kiddie
  - script kiddies
  - script-kiddie
  points: 1
  explain: A script kiddie is an attacker who lacks the skill to write custom exploits and instead runs pre-made scripts or software developed by others.
- id: q6
  type: code
  prompt: Implement the threat actor log classifier in problem/ (graded automatically by tests.py).
  grader: problem
  points: 3
