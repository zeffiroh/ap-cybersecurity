# Canonical item bank for atom 2.1.a (single source of truth).
# Used by the skill quiz page and the topic's practice questions.
atom: 2.1.a
title: 'CIA triad: confidentiality, integrity, availability'
lo:
- 2.1.A
items:
- id: q1
  type: mcq
  prompt: Which CIA pillar does encryption PRIMARILY protect?
  options:
  - Confidentiality
  - Integrity
  - Availability
  - Authentication
  answer: 0
  points: 1
  explain: Encryption transforms data so only authorized parties with the key can read it, this is confidentiality. It does not guarantee the data has not been modified (integrity) or that the system is reachable (availability).
- id: q2
  type: mcq
  prompt: A ransomware attack encrypts all files on a hospital network and demands payment before restoring access. Which CIA pillar does this PRIMARILY violate?
  options:
  - Confidentiality
  - Integrity
  - Availability
  - Non-repudiation
  answer: 2
  points: 1
  explain: The attack denies authorized users access to systems and data, that is an availability violation. The files are not leaked (confidentiality) or modified in content (integrity); they are simply made inaccessible.
- id: q3
  type: mcq
  prompt: An administrator notices that a financial report was silently edited after it was submitted. Which pillar was violated?
  options:
  - Availability
  - Integrity
  - Confidentiality
  - Redundancy
  answer: 1
  points: 1
  explain: Unauthorized modification of data is an integrity violation. Hashing and audit logs are the primary controls that would detect this.
- id: q4
  type: multi
  prompt: Which TWO controls are MOST directly used to protect integrity? Select all that apply.
  options:
  - Cryptographic hashing
  - DDoS mitigation
  - Access control / audit logs
  - Content-delivery network
  answer:
  - 0
  - 2
  points: 2
  explain: Hashing produces a fingerprint that changes if data is altered, detecting tampering. Audit logs and access control record who changed what and prevent unauthorized writes. DDoS mitigation and CDNs protect availability, not integrity.
- id: q5
  type: short
  prompt: Describe a scenario where strengthening confidentiality (e.g., full-disk encryption) creates an availability risk.
  accept:
  - key lost
  - lose the key
  - decryption fails
  - key management
  - forgotten key
  - lost key
  - inaccessible if key
  - can't decrypt
  points: 1
  explain: If the encryption key is lost or the key-management system fails, even authorized users cannot decrypt the data, a confidentiality control has caused an availability failure.
- id: q6
  type: code
  prompt: Implement the CIA classifier in problem/ (graded automatically by tests.py).
  grader: problem
  points: 3
