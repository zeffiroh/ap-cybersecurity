atom: 2.4.b
title: Alarm systems
lo:
- 2.4.B
items:
- id: q1
  type: mcq
  prompt: A homeowner arms their system in ARMED_AWAY mode and the front-door contact sensor trips 10 seconds later while they are still walking out. What should happen?
  options:
  - The panel immediately dispatches police
  - The siren sounds locally but the sensor is permanently disabled
  - The trip is treated as expected behavior because it falls within the exit delay
  - The system automatically switches to ARMED_STAY
  answer: 2
  points: 1
  explain: The exit delay gives the occupant a grace period to leave after arming; a trip inside that window is expected, not an intrusion.
- id: q2
  type: mcq
  prompt: Why is an armed alarm system classified as a detective control rather than a preventive control?
  options:
  - "It only works when someone is home to hear the siren"
  - "It notices and reports an intrusion in progress but cannot physically stop entry"
  - "It deters burglars, which makes it a deterrent control instead"
  - "It is only triggered after damage has been done"
  answer: 1
  points: 1
  explain: "An alarm senses an intrusion and raises the alarm; the door is still physically openable. That makes it detective, and its value depends on the response it triggers (monitoring center, police). It can also deter, but its main function is detection, and it triggers during the intrusion, not only after damage."
- id: q3
  type: multi
  prompt: Which of the following are true about panic/duress buttons? Select ALL that apply.
  options:
  - They are always triggered by a burglary in progress
  - They can be used for personal-safety emergencies unrelated to a break-in
  - They bypass normal arm-state checks
  - They typically escalate straight to dispatch without cross-zone verification
  answer:
  - 1
  - 2
  - 3
  points: 2
  explain: Panic buttons are general duress signals (medical emergency, threat, robbery, etc.), work regardless of arm state, and escalate directly to dispatch since a human deliberately triggered them.
- id: q4
  type: mcq
  prompt: What is the purpose of cross-zone verification in an alarm system?
  options:
  - To extend the exit delay automatically
  - To disable sensors that trip too often
  - To require two independent sensors/zones to trip within a short window before treating the event as high-confidence
  - To identify which employee armed the system
  answer: 2
  points: 1
  explain: Cross-zone verification reduces false dispatches by requiring corroboration from a second independent sensor or zone before an event is treated as a likely real intrusion.
- id: q5
  type: short
  prompt: Name the alarm system component that is a staffed facility receiving panel signals and deciding whether to contact police.
  accept:
  - monitoring center
  - central station
  - monitoring station
  - central monitoring station
  points: 1
  explain: The monitoring / central station receives the signal, attempts verification, and dispatches when warranted.
- id: q6
  type: mcq
  prompt: A door contact sensor trips 900 seconds after the system was armed, with no other zone corroborating the event within the verification window. How should this be classified?
  options:
  - LOCAL_ONLY
  - FALSE_ALARM
  - SUPPRESSED
  - DISPATCH
  answer: 0
  points: 1
  explain: Well past the exit delay, so it is a real trip, but with no cross-zone corroboration it stays LOCAL_ONLY rather than auto-escalating to dispatch.
- id: q7
  type: code
  prompt: Implement the alarm event classifier in problem/ (graded automatically).
  grader: problem
  points: 3
