atom: 2.4.c
title: Motion detectors and sensor-based detection
lo:
- 2.4.B
- 2.4.C
items:
- id: q1
  type: mcq
  prompt: What does a passive infrared (PIR) sensor actually detect?
  options:
  - A reflected microwave signal bounced off a moving object
  - The exact body temperature of anyone in the room
  - A change in infrared (heat) radiation across segments of its field of view
  - Sound waves generated by footsteps
  answer: 2
  points: 1
  explain: PIR sensors are passive; they emit no energy, and detect a change (delta) in infrared radiation as a heat source moves across detection segments, not an absolute temperature reading.
- id: q2
  type: mcq
  prompt: A microwave motion sensor detects movement using which underlying physics principle?
  options:
  - Infrared radiation change
  - Doppler shift in a reflected signal
  - Barometric pressure change
  - Capacitive touch sensing
  answer: 1
  points: 1
  explain: Microwave (and ultrasonic) sensors emit a signal and measure the frequency shift, Doppler shift, in the reflection caused by a moving object.
- id: q3
  type: mcq
  prompt: Why do dual-technology sensors (PIR + microwave) reduce false positives compared to a single-technology sensor?
  options:
  - "They require both technologies to indicate motion at roughly the same time (AND-logic), and the two technologies' false-trigger causes rarely overlap"
  - "They trigger when EITHER technology sees motion, which doubles the coverage"
  - "Microwave signals cancel out the heat noise that confuses PIR sensors"
  - "They only arm at night, when false triggers are rare"
  answer: 0
  points: 1
  explain: "Heat from vents or sunlight fools PIR; moving curtains or fans fool microwave. Requiring BOTH to agree (AND-logic) means one technology's false trigger is not enough. OR-logic would do the opposite: catch more motion but also MORE false alarms."
- id: q4
  type: multi
  prompt: Which of the following are known causes of motion-sensor false positives? Select ALL that apply.
  options:
  - Sunlight moving across a window
  - A person walking directly toward the sensor
  - HVAC vent airflow
  - A pet moving through the room
  answer:
  - 0
  - 2
  - 3
  points: 2
  explain: Sunlight, HVAC airflow, and pets are all classic false-positive causes for motion sensors. A person walking through the zone is exactly the true detection the sensor exists to catch.
- id: q5
  type: mcq
  prompt: 'A dual-technology sensor reports: PIR element cause = ''hvac_airflow'', microwave element cause = ''person''. What should the system conclude?'
  options:
  - TRUE DETECTION, because the microwave element saw a person
  - TRUE DETECTION, because at least one element always overrides the other
  - FALSE POSITIVE, because AND-logic requires both elements to independently indicate a person, and the PIR element's cause is a known false-positive
  - The event should be discarded and never logged
  answer: 2
  points: 1
  explain: Dual-tech AND-logic requires BOTH elements to agree the cause is a genuine person. Since the PIR element's cause is HVAC airflow (a known false-positive cause), the event is a false positive even though the microwave element reported a person.
- id: q6
  type: mcq
  prompt: What is the main risk of setting a motion sensor's sensitivity too low?
  options:
  - "It will trigger constantly on pets and insects"
  - "It may miss a genuine slow or partial intrusion, such as someone reaching through a cracked window"
  - "It will raise the false-positive rate from HVAC airflow"
  - "It will make cross-zone verification unnecessary"
  answer: 1
  points: 1
  explain: "Lower sensitivity reduces false alarms but creates false negatives: small or slow movements stop registering, and careful intruders move slowly on purpose. Constant triggering on pets and airflow is the problem of sensitivity set too HIGH. Tuning sensitivity is always a trade-off between the two errors."
- id: q7
  type: short
  prompt: Name the term for the limited field of view a motion sensor can actually observe, outside of which (or behind an obstruction) it cannot detect motion.
  accept:
  - detection cone
  - coverage pattern
  - field of view
  - coverage cone
  points: 1
  explain: A sensor's detection cone (or coverage pattern) is analogous to a camera's field of view, anything outside it is a blind spot.
- id: q8
  type: code
  prompt: Implement the motion-sensor event classifier in problem/ (graded automatically).
  grader: problem
