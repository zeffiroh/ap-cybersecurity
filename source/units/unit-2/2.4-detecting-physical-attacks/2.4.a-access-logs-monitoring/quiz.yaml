# Canonical item bank for atom 2.4.a (single source of truth).
# Used by the skill quiz page and the topic's practice questions.
atom: 2.4.a
title: Access logs and monitoring
lo:
- 2.4.A
items:
- id: q1
  type: mcq
  prompt: 'An access log shows badge #1042 granted entry to the server room at 02:17 on a Saturday. What is the PRIMARY concern?'
  options:
  - The badge reader malfunctioned overnight
  - Anti-passback was not enabled on that reader
  - The SIEM platform failed to generate an alert
  - After-hours access to a restricted area by a valid credential
  answer: 3
  points: 1
  explain: After-hours valid access to a restricted door is an alert-worthy anomaly regardless of credential validity, it may indicate a stolen or cloned badge.
- id: q2
  type: multi
  prompt: Which of the following log patterns are direct indicators of a potential physical security breach? Select ALL that apply.
  options:
  - 'Seven ACCESS DENIED events for badge #0099 within 45 seconds'
  - 'Badge #0210 granted at lobby at 08:32, then at server room at 08:34'
  - 'Badge #0210 granted at lobby at 08:32, then at data center 40 miles away at 08:45'
  - 'Badge #0055 granted at lobby at 09:05 on a Tuesday'
  answer:
  - 0
  - 2
  points: 2
  explain: Seven denials in 45 seconds is a repeated-denial burst (rule 0). The same badge appearing 40 miles away within 13 minutes is a location inconsistency (rule 2). The other events are normal.
- id: q3
  type: mcq
  prompt: What does the anti-passback feature in an access control system detect?
  options:
  - Intrusions through windows and emergency exits
  - After-hours access by cleaning staff
  - A credential being used to enter without a prior exit record, suggesting badge sharing
  - Repeated failed attempts on a single reader
  answer: 2
  points: 1
  explain: Anti-passback tracks entry/exit state per credential. A badge that enters twice without an exit in between triggers an alert, indicating the badge may have been passed to a second person.
- id: q4
  type: short
  prompt: Name the type of platform that aggregates access logs from multiple readers and applies detection rules in real time.
  accept:
  - siem
  - security information and event management
  - siem platform
  points: 1
  explain: A SIEM (Security Information and Event Management) platform centralizes log data and evaluates rules to generate alerts.
- id: q5
  type: mcq
  prompt: Why are physical access logs described as a detective control rather than a preventive control?
  options:
  - They require a human analyst to be watched at all times
  - They are only useful during forensic investigation, not real-time monitoring
  - They record events after they occur and help discover breaches rather than block them
  - They replace the need for badge readers and cameras
  answer: 2
  points: 1
  explain: Detective controls identify that something happened; preventive controls stop it from happening. Logs record events after the fact, limiting discovery time rather than preventing entry.
- id: q6
  type: code
  prompt: Implement the access log anomaly detector in problem/ (graded automatically).
  grader: problem
  points: 3
