atom: 2.3.a
title: Physical access controls (locks, badges, biometrics, mantraps)
lo:
- 2.3.A
items:
- id: q1
  type: mcq
  prompt: An administrator wants to prevent tailgating (where an unauthorized person follows an authorized person through a door). Which of the following physical access controls is the most effective solution for this specific threat?
  options:
  - A high-security biometric fingerprint scanner
  - A physical keyed deadbolt lock
  - A mantrap (access vestibule) with interlocked doors
  - An RFID badge reader with real-time audit logging
  answer: 2
  points: 1
  explain: A mantrap features two interlocked doors where the second door cannot open until the first door closes, ensuring that only one person (or one authenticated party) can pass through per cycle, directly preventing tailgating. Badge readers and biometrics authenticate identity but do not physically block tailgating.
- id: q2
  type: multi
  prompt: Which of the following are distinct security advantages of an electronic RFID badge system over traditional mechanical keyed locks? (Select all that apply)
  options:
  - The ability to instantly revoke a user's access credentials in a central database without replacing physical hardware.
  - Complete immunity to credential cloning and signal sniffing attacks.
  - Automatic generation of an audit trail showing the timestamp and identity associated with each entry.
  - Independence from electrical power sources and network connectivity.
  answer:
  - 0
  - 2
  points: 2
  explain: Electronic RFID badge systems allow administrators to revoke credentials instantly in a database, rendering the physical badge useless immediately. They also log each access event, creating a digital audit trail. However, they are vulnerable to signal cloning and generally rely on power and network connectivity.
- id: q3
  type: short
  prompt: What is the common biometric performance metric that measures the probability that a system will incorrectly grant access to an unauthorized user?
  accept:
  - false acceptance rate
  - far
  - false acceptance
  points: 1
  explain: The False Acceptance Rate (FAR) is the probability that a biometric security system will incorrectly authorize an unauthorized person.
- id: q4
  type: code
  prompt: 'Implement a function `solve(data: dict[str, bool]) -> list[str]` to detect physical security gaps.'
  grader: problem
  points: 3
