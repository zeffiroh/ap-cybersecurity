# Canonical item bank for atom 2.3.c (single source of truth).
# Used by the skill quiz page and the topic's practice questions.
atom: 2.3.c
title: Security guards and layered defense-in-depth
lo:
- 2.3.B
items:
- id: q1
  type: mcq
  prompt: A guard at the reception desk denies entry to a visitor whose credentials look valid but whose story about their visit does not hold together under questioning. Which guard function does this best illustrate?
  options:
  - Patrol
  - Response
  - Reception and access verification
  - Visitor logging
  answer: 2
  points: 1
  explain: Checking credentials and probing an inconsistent story at an entry point is the reception/access-verification role, something an automated badge reader cannot do.
- id: q2
  type: multi
  prompt: Which of the following are examples of a guard's response function? Select ALL that apply.
  options:
  - Physically investigating after a door sensor alarm fires
  - Walking a randomized route through the facility each shift
  - Responding in person when a camera detects motion in a restricted area after hours
  - Recording a visitor's name and sponsor in a log at the front desk
  answer:
  - 0
  - 2
  points: 2
  explain: Response means physically investigating triggered alarms or detected motion. Randomized patrol routes are the patrol function, and recording visitor names is visitor-log administration, not response.
- id: q3
  type: mcq
  prompt: A facility relies only on a badge reader at its single entrance. According to the defense-in-depth principle, what is the main weakness of this setup?
  options:
  - "An attacker only needs to defeat one control (a cloned or stolen badge) to succeed"
  - "A badge reader cannot tell which person used which badge, so logs are useless"
  - "Badge readers are preventive controls, and defense in depth requires only detective ones"
  - "One entrance means employees will prop the door open"
  answer: 0
  points: 1
  explain: "Defense in depth means several independent layers, so defeating one does not end the protection. With a single badge reader, one cloned or borrowed badge gets an attacker all the way in. Badge logs are still useful, and defense in depth mixes preventive, detective and corrective controls."
- id: q4
  type: mcq
  prompt: Why does adding a second security guard to the same reception desk NOT raise a facility's depth score?
  options:
  - Guards are never counted toward depth score
  - Two guards in the same personnel role duplicate an existing category rather than covering a new one
  - Depth score only counts electronic controls
  - A second guard actually lowers the depth score
  answer: 1
  points: 1
  explain: Depth score counts distinct control categories, not total layers. A redundant personnel layer adds cost without closing a new gap that a different category (e.g., electronic or barrier) would close.
- id: q5
  type: multi
  prompt: Which of the following are true about mantraps? Select ALL that apply.
  options:
  - A mantrap uses two interlocking doors to prevent more than one person entering at a time
  - A mantrap by itself eliminates the need for any guard verification
  - A mantrap is most effective when paired with a guard who verifies identity on the far side
  - A mantrap is a barrier-category control
  answer:
  - 0
  - 2
  - 3
  points: 2
  explain: Mantraps are physical barrier controls that stop piggybacking, but they still benefit from a guard verifying identity in case of system error or ambiguous cases, they do not eliminate the value of human verification.
- id: q6
  type: short
  prompt: Name the practice of following an authorized person through a controlled door without presenting your own credential.
  accept:
  - tailgating
  - piggybacking
  points: 1
  explain: Tailgating (also called piggybacking) is entering behind an authorized person without independently badging or verifying in.
- id: q7
  type: mcq
  prompt: A visitor log records who entered a facility, their sponsor, and their arrival/departure times. Why is a visitor log alone NOT sufficient physical security?
  options:
  - "Visitors can write false names, so logs should not be kept"
  - "It is a deterrent and audit tool, not a barrier that stops unauthorized access in the moment"
  - "Visitor logs are only useful when kept electronically"
  - "Visitor logs only record arrivals, not departures"
  answer: 1
  points: 1
  explain: "A log records who came in, which helps investigations and discourages misuse, but nothing about writing a name in a book stops an intruder. It needs to be paired with identity checks and escorts. False names are a reason to verify ID, not to stop logging."
- id: q8
  type: code
  prompt: Implement the defense-in-depth scorer in problem/ (graded automatically).
  grader: problem
  points: 3
