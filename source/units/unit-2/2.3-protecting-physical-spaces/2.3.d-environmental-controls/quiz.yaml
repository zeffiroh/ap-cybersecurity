atom: 2.3.d
title: Environmental controls (HVAC, fire suppression, power)
lo:
- 2.3.C
items:
- id: q1
  type: mcq
  prompt: Why do data centers use clean-agent fire suppression (such as FM-200) instead of standard water sprinklers?
  options:
  - Clean-agent systems are cheaper to install than sprinklers
  - Water sprinklers are illegal in commercial buildings
  - Clean-agent systems require no maintenance
  - Water sprinklers destroy electronics on contact, even during a false activation
  answer: 3
  points: 1
  explain: Water damages electronics immediately, and even a false sprinkler activation can write off an entire server room. Clean-agent systems extinguish fire without residue or equipment damage.
- id: q2
  type: mcq
  prompt: A total utility power outage occurs. Which device responds first, within milliseconds, to keep servers running?
  options:
  - Backup generator
  - UPS (Uninterruptible Power Supply)
  - Managed PDU
  - VESDA smoke detector
  answer: 1
  points: 1
  explain: A UPS is a battery bank that responds in milliseconds, far faster than a generator can start, bridging the gap until the generator stabilizes or power is restored.
- id: q3
  type: multi
  prompt: Which of the following are functions of a backup generator in a data center power design? Select ALL that apply.
  options:
  - Provides extended runtime (hours to days) once started and stabilized
  - Responds within milliseconds of an outage, faster than a UPS
  - Typically starts and stabilizes within about 10 to 30 seconds
  - Is sometimes deployed in N+1 or 2N redundant configurations
  answer:
  - 0
  - 2
  - 3
  points: 2
  explain: Generators provide long runtime after a 10-30 second start delay, and critical facilities often run them in N+1 or 2N redundant configurations. A UPS, not a generator, is the millisecond-response layer.
- id: q4
  type: mcq
  prompt: What is the purpose of hot aisle / cold aisle containment in a server room?
  options:
  - It reduces the noise level of HVAC equipment
  - It replaces the need for a fire suppression system
  - It prevents hot exhaust air from mixing with cool intake air, improving cooling efficiency and preventing hot spots
  - It increases humidity to prevent electrostatic discharge
  answer: 2
  points: 1
  explain: Physical containment (curtains, doors, or roof panels) keeps cool intake air and hot exhaust air separated so cooling equipment can work efficiently and hot spots do not form.
- id: q5
  type: mcq
  prompt: What does N+1 redundancy mean when applied to HVAC or power systems in a data center?
  options:
  - There is exactly enough capacity to meet current load with no margin
  - At least one extra unit of capacity exists beyond the minimum required, so a single unit failure does not cause an outage
  - Two completely separate, independently powered facilities are built
  - Redundant systems are tested once during initial installation only
  answer: 1
  points: 1
  explain: N+1 redundancy means one extra unit of critical capacity (a spare generator, UPS, or HVAC unit) exists beyond the minimum needed, so a single failure does not cause a service outage.
- id: q6
  type: short
  prompt: Name the early-warning smoke detection system that continuously samples air and can detect smoke particles well before a standard ionization detector would trigger.
  accept:
  - vesda
  - very early smoke detection apparatus
  - very early smoke detection
  points: 1
  explain: VESDA (Very Early Smoke Detection Apparatus) samples air continuously, giving operators minutes of warning instead of seconds.
- id: q7
  type: mcq
  prompt: A managed PDU (Power Distribution Unit) provides which capability that a basic power strip does not?
  options:
  - It generates its own backup power during an outage
  - It allows remote monitoring of per-outlet current and remote power cycling of individual devices
  - It cools the rack it is installed in
  - It suppresses fire at the rack level
  answer: 1
  points: 1
  explain: A managed PDU supports remote monitoring and per-outlet control, allowing staff to remotely reboot a locked-up device without physically entering the restricted room.
- id: q8
  type: code
  prompt: Implement the facility control-compliance checker in problem/ (graded automatically).
  grader: problem
  points: 3
