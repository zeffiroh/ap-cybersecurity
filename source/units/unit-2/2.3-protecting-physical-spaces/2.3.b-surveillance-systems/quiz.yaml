# Canonical item bank for atom 2.3.b (single source of truth).
# Used by the skill quiz page and the topic's practice questions.
atom: 2.3.b
title: Surveillance systems (CCTV, monitoring)
lo:
- 2.3.A
items:
- id: q1
  type: mcq
  prompt: A facility relies entirely on CCTV cameras with no guards, alarms, or locks. Which statement BEST describes the limitation of this setup?
  options:
  - CCTV cannot record video at night under any circumstances
  - CCTV signals cannot be viewed remotely without a VCR
  - CCTV is a detective control; it can record an intrusion but cannot physically stop it
  - CCTV always requires a dedicated coaxial cable to function
  answer: 2
  points: 1
  explain: Cameras document events (detective) but do not themselves prevent an intruder from breaching a fence or door; that requires preventive controls like locks and fencing plus a response process.
- id: q2
  type: mcq
  prompt: An organization replaces its analog coaxial CCTV system with networked IP cameras. What is the PRIMARY new risk introduced by this upgrade?
  options:
  - IP cameras are now exposed to network-based attacks such as credential stuffing or firmware exploits
  - IP cameras cannot record footage for later review
  - IP cameras require more physical cabling than analog systems
  - IP cameras cannot support motion detection or analytics
  answer: 0
  points: 1
  explain: Because IP cameras are addressable network devices, they inherit cyber risks (port scanning, default credentials, unencrypted RTSP sniffing, DoS) that an isolated analog coaxial loop is immune to.
- id: q3
  type: multi
  prompt: Which of the following are recommended mitigations for logical vulnerabilities in an IP camera network? Select ALL that apply.
  options:
  - Isolate cameras on a dedicated VLAN separate from general office traffic
  - Leave factory default admin credentials unchanged so support technicians can log in easily
  - Encrypt video streams in transit and at rest
  - Apply firmware updates to camera devices regularly
  answer:
  - 0
  - 2
  - 3
  points: 2
  explain: VLAN isolation, encryption, and firmware patching all reduce the attack surface. Leaving default credentials unchanged is the opposite of a mitigation, it is one of the most common ways attackers take over IP cameras.
- id: q4
  type: short
  prompt: Give the term for an area within or around a facility that is not visible to any surveillance camera.
  accept:
  - blind spot
  - blindspot
  points: 1
  explain: A blind spot is any unmonitored area; designers use overlapping fields of view between cameras to eliminate them.
- id: q5
  type: mcq
  prompt: 'A security team watches live CCTV feeds on a monitor wall and dispatches a guard the moment they see a fence breach in progress. This is an example of:'
  options:
  - Passive monitoring
  - Anti-passback
  - Thermal imaging
  - Active monitoring
  answer: 3
  points: 1
  explain: Active monitoring means personnel watch live feeds in real time and can respond to an incident as it happens, unlike passive monitoring, which only reviews recorded footage after the fact.
- id: q6
  type: mcq
  prompt: Why is passive-only monitoring (recording footage for later review, with no live viewing) considered insufficient on its own for stopping an attack in progress?
  options:
  - Passive monitoring uses more storage than active monitoring
  - Passive monitoring requires a live guard to be present at all times
  - Passive monitoring cannot be combined with thermal cameras
  - Passive monitoring only produces footage that is reviewed after an incident already occurred, so it cannot interrupt the attack itself
  answer: 3
  points: 1
  explain: Passive/recorded monitoring is valuable for forensic investigation after the fact, but because no one is watching in real time, it does nothing to interrupt or prevent an attack while it is happening.
- id: q7
  type: short
  prompt: Name the camera type that can be remotely swept across a wide area but temporarily creates a blind spot on the side it is not currently pointed toward.
  accept:
  - ptz
  - pan-tilt-zoom
  - pan tilt zoom camera
  points: 1
  explain: A Pan-Tilt-Zoom (PTZ) camera offers wide coverage over time but, at any given instant, is only pointed at part of its range, the rest is a temporary blind spot.
- id: q8
  type: code
  prompt: Implement the camera event log anomaly detector in problem/ (graded automatically).
  grader: problem
  points: 3
