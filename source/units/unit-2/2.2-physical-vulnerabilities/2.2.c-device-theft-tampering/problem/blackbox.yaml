# BLACKBOX CONTRACT, makes this coded part swappable (teacher can wire in student code).
id: "2.2.c-incident-triage"     # e.g. 1.2.a-authlog-parser
kind: problem                        # problem | sim-core | lab-service | toolkit-tool
language: python3
entry: "solve"                       # callable/module symbol implementations must expose
signature: "solve(data) -> result"  # human-readable contract (full detail in interface.md)
tests: "tests.py"                    # acceptance suite every implementation must pass
reference: "solution.py"             # default green implementation
allow_deps: []                       # vendored deps permitted (default: stdlib only)
swap:
  # how assemble.py runs a candidate: it sets IMPL=<path> and runs `pytest tests.py`
  impl_env: "IMPL"
  run: "python -m pytest tests.py -q"
