atom: 2.2.c
title: Device theft and tampering
lo:
- 2.2.B
- 2.2.C
items:
- id: q1
  type: mcq
  prompt: What is the single most effective control against data exposure from a STOLEN laptop?
  options:
  - A strong login password
  - Full-disk encryption
  - A Kensington cable lock
  - An asset tag
  answer: 1
  points: 1
  explain: A login password only protects the normal OS boot path; an attacker with physical possession can often boot from external media and read the disk directly. Full-disk encryption makes the drive's contents unreadable without the key even if removed.
- id: q2
  type: mcq
  prompt: What distinguishes an evil-maid attack from ordinary device theft?
  options:
  - The device is covertly tampered with and returned, so the owner does not know anything happened
  - It always involves a hotel employee specifically
  - It only targets mobile phones, not laptops
  - It requires no physical access at all
  answer: 0
  points: 1
  explain: The defining feature of an evil-maid attack is that the attacker briefly accesses the device, tampers with it (e.g., a fake boot loader that captures the disk-encryption password), and restores its appearance, the owner has no idea the device was compromised.
- id: q3
  type: multi
  prompt: Which TWO of the following are physical/behavioral signs that a device tampering incident may have occurred? Select all that apply.
  options:
  - A tamper-evident seal shows a torn or VOID pattern
  - The device's login password was recently changed by the owner
  - An unfamiliar dongle is found plugged into the keyboard port
  - The device was rebooted after a routine software update
  answer:
  - 0
  - 2
  points: 2
  explain: A broken tamper-evident seal is direct physical evidence of tampering, and an unfamiliar USB implant (like a keylogger dongle) is a classic hardware-tampering sign. A user-initiated password change or a routine update reboot are normal, expected activity.
- id: q4
  type: short
  prompt: Why can a tampering incident still be a risk even if the tamper-evident seal is intact?
  accept:
  - usb implant
  - does not require opening
  - external device
  - peripheral
  - doesn't require opening the case
  - rogue usb
  - without opening the enclosure
  points: 1
  explain: Some tampering, such as plugging in a rogue USB keylogger or malicious peripheral, does not require opening the device's enclosure at all, so an intact seal does not rule out tampering.
- id: q5
  type: mcq
  prompt: A stolen laptop was encrypted, contained sensitive data, and was not reported missing for 60 hours. Per this atom's triage rules, what risk level should this incident receive?
  options:
  - LOW
  - HIGH
  - MEDIUM
  - Cannot be determined
  answer: 2
  points: 1
  explain: Encrypted (not HIGH), but sensitive data plus more than 48 hours since the last check triggers the MEDIUM rule, the long detection delay raises risk even though the disk itself is protected.
- id: q6
  type: code
  prompt: Implement the device incident triage function in problem/ (graded automatically by tests.py).
  grader: problem
  points: 3
