atom: 2.2.b
title: Environmental vulnerabilities (power, HVAC, fire, water)
lo:
- 2.2.A
items:
- id: q1
  type: mcq
  prompt: Why do data centers use clean-agent fire suppression (e.g., FM-200, inert gas) instead of water sprinklers?
  options:
  - Water sprinklers would themselves destroy the electronics they are meant to protect
  - Clean-agent systems are cheaper to install
  - Clean-agent systems put out fires faster than water in all cases
  - Fire codes prohibit water sprinklers in any commercial building
  answer: 0
  points: 1
  explain: Water-based sprinklers short-circuit and corrode electronics, so they would cause the same loss the fire threatens. Clean-agent systems suppress fire by removing oxygen or interrupting combustion without wetting equipment.
- id: q2
  type: mcq
  prompt: A server room's temperature sensor and humidity sensor both cross their warning thresholds at the same time. What does this combined pattern most likely indicate?
  options:
  - A single faulty sensor
  - A tailgating attempt
  - A failing or overloaded HVAC (cooling) system
  - A power surge
  answer: 2
  points: 1
  explain: Rising temperature together with drifting humidity is the classic signature of an HVAC failure, since the same cooling system regulates both.
- id: q3
  type: multi
  prompt: Which TWO controls directly address power-related environmental risk? Select all that apply.
  options:
  - Uninterruptible power supply (UPS)
  - Clean-agent fire suppression
  - Backup generator with N+1 redundancy
  - Raised flooring
  answer:
  - 0
  - 2
  points: 2
  explain: A UPS bridges short outages/dips, and a redundant generator covers longer outages. Fire suppression addresses fire risk; raised flooring addresses water/flood risk.
- id: q4
  type: short
  prompt: Why is raised flooring used as a control against water/flood risk in a data center?
  accept:
  - elevate
  - elevates equipment
  - above the slab
  - keeps equipment off the floor
  - raises equipment above water level
  - above floor level
  points: 1
  explain: Raised flooring physically elevates equipment above the slab, so a shallow flood or leak does not immediately reach the hardware.
- id: q5
  type: mcq
  prompt: Why should environmental risks (power, HVAC, fire, water) be analyzed with the same rigor as a targeted cyberattack?
  options:
  - They are legally required to be reported the same way
  - They can produce the same availability or integrity loss as a targeted attack, even without an adversary
  - They are actually more common than cyberattacks in every organization
  - Insurance companies require it
  answer: 1
  points: 1
  explain: The CIA triad does not care whether the cause was malicious; a power failure, fire, or flood can take systems offline or corrupt data just as effectively as an attacker would.
