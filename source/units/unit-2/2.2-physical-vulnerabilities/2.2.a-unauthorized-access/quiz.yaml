# Canonical item bank for atom 2.2.a (single source of truth).
# Used by the skill quiz page and the topic's practice questions.
atom: 2.2.a
title: Unauthorized physical access (tailgating, piggybacking, lock bypass)
lo:
- 2.2.A
- 2.2.B
items:
- id: q1
  type: mcq
  prompt: 'An attacker carries boxes to appear busy and follows an employee through a badge-reader door without swiping. This is BEST described as:'
  options:
  - Piggybacking
  - Tailgating
  - RFID cloning
  - Bump keying
  answer: 1
  points: 1
  explain: Tailgating = following an authorized person through a secured entry without the authorized person's knowledge or consent. The employee did not knowingly allow entry.
- id: q2
  type: mcq
  prompt: Which physical attack leaves evidence in a badge-access log that looks identical to a legitimate single entry?
  options:
  - Lock picking
  - Bump keying
  - Tailgating
  - RFID jamming
  answer: 2
  points: 1
  explain: Both tailgating and piggybacking produce only one badge-swipe event in the log even though two people passed through. Lock picking and bump keying bypass the reader entirely.
- id: q3
  type: multi
  prompt: Select ALL techniques that can grant physical access WITHOUT the correct badge credential.
  options:
  - Tailgating
  - RFID badge cloning
  - Multi-factor authentication
  - Lock picking
  answer:
  - 0
  - 1
  - 3
  points: 3
  explain: Tailgating bypasses the reader socially; RFID cloning replays a copied credential; lock picking bypasses the lock mechanically. MFA is a defensive control, not an attack.
- id: q4
  type: short
  prompt: A building access log shows badge ID 1042 swiping door D1 at 09:00:02 and door D2 (40 meters away) at 09:00:05. Why is this record suspicious?
  accept:
  - impossible
  - too fast
  - three seconds
  - cannot walk
  - physically impossible
  - speed
  points: 1
  explain: Three seconds is insufficient to walk 40 meters; this suggests the badge was passed to a second person, a replay attack, or a log integrity issue.
- id: q5
  type: mcq
  prompt: Older 125 kHz HID proximity cards are especially vulnerable to which attack?
  options:
  - Bump keying
  - RFID cloning
  - Lock shimming
  - Tailgating
  answer: 1
  points: 1
  explain: 125 kHz proximity cards broadcast their ID without cryptographic protection; a hidden reader can capture and clone them in seconds.
- id: q6
  type: short
  prompt: Name the physical security control that uses two interlocked doors to prevent a second person from following through a secured entry.
  accept:
  - mantrap
  - man trap
  - airlock
  - sally port
  points: 1
  explain: A mantrap (also called an airlock or sally port) keeps one door locked until the first closes, eliminating the physical opportunity for tailgating.
- id: q7
  type: code
  prompt: Implement the access-log analyzer in problem/ (graded automatically).
  grader: problem
  points: 3
