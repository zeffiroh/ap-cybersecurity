<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teaching Desk</title>
<link rel="stylesheet" href="/ui/desk.css">
</head>
<body>
<aside class="shelf">
  <h1>Teaching Desk</h1>
  <button id="newBtn" class="go">New lesson</button>
  <nav id="list" aria-label="Your lessons"></nav>
</aside>
<main id="main" tabindex="-1"></main>
<p id="status" class="status" role="status" aria-live="polite" hidden></p>
<dialog id="newDlg">
  <form id="newForm" method="dialog">
    <h2>New lesson</h2>
    <label>Title<input id="nTitle" required placeholder="Log triage on a hacked web server"></label>
    <label>Start from<select id="nSource"><option value="">An empty folder</option></select></label>
    <label>Teach on<select id="nShell"></select></label>
    <p class="hint">Starting from a case or lesson copies its files and turns its steps into your plan.</p>
    <div class="row"><button id="nGo" type="submit" class="go">Open the studio</button><button type="button" id="nCancel">Cancel</button></div>
  </form>
</dialog>
<script src="/ui/desk.js"></script>
</body>
</html>
