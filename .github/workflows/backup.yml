name: Database backup

on:
  schedule:
    - cron: "17 2 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "psycopg[binary]==3.2.3" "cryptography==44.0.0"
      - run: python db/backup.py dump backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: db-backup
          path: backup/
          retention-days: 90
          if-no-files-found: error
