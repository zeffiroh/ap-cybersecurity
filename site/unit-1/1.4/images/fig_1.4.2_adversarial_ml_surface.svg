<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" role="img" aria-label="Adversarial machine learning attack surface across the model lifecycle">
  <title>Adversarial machine learning attack surface across the model lifecycle</title>
  <desc>A machine learning lifecycle runs left to right: data collection, training, the deployed model, and inference-time queries. Poisoning attacks target data collection and training. Evasion attacks target inference inputs. Privacy attacks, including model inversion and membership inference, target the deployed model through its query interface. Prompt injection targets a generative model's untrusted input context.</desc>
  <style>
    .bx { fill:#ffffff; stroke:#000000; stroke-width:1.4; }
    .atk { fill:#fdeceb; stroke:#800000; stroke-width:1.4; }
    .lbl { font-family:"Helvetica Neue",Arial,sans-serif; font-size:13px; font-weight:700; fill:#000000; }
    .albl { font-family:"Helvetica Neue",Arial,sans-serif; font-size:12px; font-weight:700; fill:#800000; }
    .sub { font-family:"Helvetica Neue",Arial,sans-serif; font-size:11px; fill:#555555; }
    .stage { font-family:"Helvetica Neue",Arial,sans-serif; font-size:10px; fill:#555555; letter-spacing:1px; }
    .ar { stroke:#000000; stroke-width:1.6; fill:none; marker-end:url(#bh); }
    .ara { stroke:#800000; stroke-width:1.3; fill:none; stroke-dasharray:5 4; marker-end:url(#bhr); }
  </style>
  <defs>
    <marker id="bh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000000"/>
    </marker>
    <marker id="bhr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#800000"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="879" height="379" fill="#ffffff" stroke="#dcdcd8"/>

  <text class="stage" x="24" y="30">MODEL LIFECYCLE</text>

  <rect class="bx" x="24" y="44" width="180" height="62" rx="3"/>
  <text class="lbl" x="36" y="68">1. Data collection</text>
  <text class="sub" x="36" y="86">Scraped web pages, user</text>
  <text class="sub" x="36" y="100">submissions, public corpora</text>

  <path class="ar" d="M208 75 H240"/>

  <rect class="bx" x="244" y="44" width="180" height="62" rx="3"/>
  <text class="lbl" x="256" y="68">2. Training</text>
  <text class="sub" x="256" y="86">Weights fitted to the</text>
  <text class="sub" x="256" y="100">collected distribution</text>

  <path class="ar" d="M428 75 H460"/>

  <rect class="bx" x="464" y="44" width="180" height="62" rx="3"/>
  <text class="lbl" x="476" y="68">3. Deployed model</text>
  <text class="sub" x="476" y="86">Query interface exposed</text>
  <text class="sub" x="476" y="100">to users or the public</text>

  <path class="ar" d="M648 75 H680"/>

  <rect class="bx" x="684" y="44" width="172" height="62" rx="3"/>
  <text class="lbl" x="696" y="68">4. Inference</text>
  <text class="sub" x="696" y="86">Untrusted input classified</text>
  <text class="sub" x="696" y="100">or summarised at runtime</text>

  <!-- attack arrows -->
  <path class="ara" d="M114 168 V110"/>
  <path class="ara" d="M334 168 V110"/>
  <path class="ara" d="M554 168 V110"/>
  <path class="ara" d="M770 168 V110"/>

  <text class="stage" x="24" y="190">ATTACK CLASSES</text>

  <rect class="atk" x="24" y="200" width="180" height="96" rx="3"/>
  <text class="albl" x="36" y="222">Poisoning</text>
  <text class="sub" x="36" y="242">Plant content the crawler will</text>
  <text class="sub" x="36" y="257">ingest, so the trained model</text>
  <text class="sub" x="36" y="272">repeats the planted claim or</text>
  <text class="sub" x="36" y="287">carries a hidden backdoor.</text>

  <rect class="atk" x="244" y="200" width="180" height="96" rx="3"/>
  <text class="albl" x="256" y="222">Backdoor triggers</text>
  <text class="sub" x="256" y="242">A rare pattern is bound during</text>
  <text class="sub" x="256" y="257">training to an attacker-chosen</text>
  <text class="sub" x="256" y="272">label. Accuracy on clean data</text>
  <text class="sub" x="256" y="287">stays normal, hiding the flaw.</text>

  <rect class="atk" x="464" y="200" width="180" height="96" rx="3"/>
  <text class="albl" x="476" y="222">Privacy extraction</text>
  <text class="sub" x="476" y="242">Model inversion and membership</text>
  <text class="sub" x="476" y="257">inference recover training data</text>
  <text class="sub" x="476" y="272">or confirm a record was used,</text>
  <text class="sub" x="476" y="287">using only query access.</text>

  <rect class="atk" x="684" y="200" width="172" height="96" rx="3"/>
  <text class="albl" x="696" y="222">Evasion &amp; injection</text>
  <text class="sub" x="696" y="242">A perturbed input crosses the</text>
  <text class="sub" x="696" y="257">decision boundary; or text in</text>
  <text class="sub" x="696" y="272">retrieved content is obeyed</text>
  <text class="sub" x="696" y="287">as if it were an instruction.</text>

  <text class="sub" x="24" y="330">Poisoning and backdoors are training-time attacks: the defect is baked into the weights and cannot be patched at the input layer.</text>
  <text class="sub" x="24" y="348">Evasion, injection and privacy extraction are inference-time attacks against a model that was trained correctly.</text>
  <text class="sub" x="24" y="366">Classification follows NIST AI 100-2 E2025, Adversarial Machine Learning: A Taxonomy and Terminology of Attacks and Mitigations.</text>
</svg>
