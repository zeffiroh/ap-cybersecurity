<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img" aria-label="Zero-shot voice cloning pipeline diagram">
  <title>Zero-shot voice cloning pipeline</title>
  <desc>A three-second reference recording is passed to a speaker encoder that produces a fixed-length speaker embedding. Attacker-supplied text is passed to an acoustic model, which is conditioned on that embedding to produce a mel spectrogram. A neural vocoder converts the spectrogram into a waveform delivered over a telephone or conferencing channel.</desc>
  <style>
    .bx { fill:#ffffff; stroke:#000000; stroke-width:1.4; }
    .bx-a { fill:#fdeceb; stroke:#800000; stroke-width:1.4; }
    .lbl { font-family:"Helvetica Neue",Arial,sans-serif; font-size:13px; font-weight:700; fill:#000000; }
    .sub { font-family:"Helvetica Neue",Arial,sans-serif; font-size:11px; fill:#555555; }
    .cap { font-family:"Helvetica Neue",Arial,sans-serif; font-size:11px; fill:#800000; font-weight:700; }
    .ar { stroke:#000000; stroke-width:1.4; fill:none; marker-end:url(#ah); }
    .ard { stroke:#800000; stroke-width:1.3; fill:none; stroke-dasharray:5 4; marker-end:url(#ahr); }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000000"/>
    </marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#800000"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="879" height="399" fill="#ffffff" stroke="#dcdcd8"/>

  <!-- Row 1: enrolment path -->
  <text class="cap" x="24" y="34">ENROLMENT — one short reference recording</text>

  <rect class="bx-a" x="24" y="48" width="170" height="66" rx="3"/>
  <text class="lbl" x="36" y="72">Public audio, ~3 s</text>
  <text class="sub" x="36" y="90">Conference talk, podcast,</text>
  <text class="sub" x="36" y="105">earnings call, social video</text>

  <path class="ar" d="M198 81 H246"/>

  <rect class="bx" x="250" y="48" width="170" height="66" rx="3"/>
  <text class="lbl" x="262" y="72">Speaker encoder</text>
  <text class="sub" x="262" y="90">Trained on thousands of</text>
  <text class="sub" x="262" y="105">speakers, not on the target</text>

  <path class="ar" d="M424 81 H472"/>

  <rect class="bx" x="476" y="48" width="190" height="66" rx="3"/>
  <text class="lbl" x="488" y="72">Speaker embedding</text>
  <text class="sub" x="488" y="90">Fixed-length vector encoding</text>
  <text class="sub" x="488" y="105">timbre and vocal-tract shape</text>

  <!-- Row 2: synthesis path -->
  <text class="cap" x="24" y="176">SYNTHESIS — arbitrary text, spoken in the target's voice</text>

  <rect class="bx-a" x="24" y="190" width="170" height="66" rx="3"/>
  <text class="lbl" x="36" y="214">Attacker's script</text>
  <text class="sub" x="36" y="232">&#8220;Approve the transfer</text>
  <text class="sub" x="36" y="247">before end of day.&#8221;</text>

  <path class="ar" d="M198 223 H246"/>

  <rect class="bx" x="250" y="190" width="170" height="66" rx="3"/>
  <text class="lbl" x="262" y="214">Acoustic model</text>
  <text class="sub" x="262" y="232">Text &#8594; mel spectrogram,</text>
  <text class="sub" x="262" y="247">conditioned on the embedding</text>

  <path class="ard" d="M571 118 V162 H335 V186"/>
  <text class="sub" x="345" y="156" fill="#800000">conditioning vector</text>

  <path class="ar" d="M424 223 H472"/>

  <rect class="bx" x="476" y="190" width="190" height="66" rx="3"/>
  <text class="lbl" x="488" y="214">Neural vocoder</text>
  <text class="sub" x="488" y="232">Spectrogram &#8594; waveform</text>
  <text class="sub" x="488" y="247">(HiFi-GAN, WaveRNN, codec)</text>

  <path class="ar" d="M670 223 H714"/>

  <rect class="bx-a" x="718" y="190" width="138" height="66" rx="3"/>
  <text class="lbl" x="730" y="214">Delivery channel</text>
  <text class="sub" x="730" y="232">Telephone or video</text>
  <text class="sub" x="730" y="247">conference audio</text>

  <!-- Footnote band -->
  <rect x="24" y="292" width="832" height="82" rx="3" fill="#f7f7f5" stroke="#dcdcd8"/>
  <text class="lbl" x="38" y="314">Why three seconds is enough</text>
  <text class="sub" x="38" y="334">The encoder is not learning the target's voice from scratch. It was pre-trained on a large multi-speaker corpus, so it already knows the</text>
  <text class="sub" x="38" y="350">shape of &#8220;voice space.&#8221; The reference clip only has to locate one point in that space. Narrowband telephone audio then discards most</text>
  <text class="sub" x="38" y="366">of the high-frequency detail that would betray a synthetic waveform, so the channel itself hides the remaining artefacts.</text>
</svg>
