<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" width="920" height="620" role="img"
     aria-label="Signature-based detection blocks known malware but lets a zero-day through, while anomaly-based Isolation Forest detection isolates the ransomware process in a short path; a timeline shows containment 15 seconds after patient zero.">
  <title>Signature-based versus anomaly-based detection, and Isolation Forest path length</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3F3F46"/>
    </marker>
    <marker id="arRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9B1C1C"/>
    </marker>
    <marker id="arMaroon" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#800000"/>
    </marker>
  </defs>

  <style>
    .ttl  { font:600 15px system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif; fill:#800000; }
    .lbl  { font:400 12.5px system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif; fill:#1F2937; }
    .sm   { font:400 11px system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif; fill:#52525B; }
    .mono { font:400 11.5px ui-monospace,"Cascadia Mono",Consolas,monospace; fill:#27272A; }
    .bad  { font:600 12px system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif; fill:#9B1C1C; }
    .good { font:600 12px system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif; fill:#166534; }
    .panel{ fill:#FFFFFF; stroke:#D4D4D8; }
    .box  { fill:#FAF9F6; stroke:#71717A; }
  </style>

  <!-- ============================ PANEL A ============================ -->
  <rect class="panel" x="8" y="8" width="440" height="392" rx="4"/>
  <text class="ttl" x="28" y="34">A. Signature-based detection</text>
  <text class="sm"  x="28" y="52">Matches a file against a database of known-bad fingerprints.</text>

  <!-- signature database -->
  <rect class="box" x="120" y="68" width="215" height="72" rx="3"/>
  <text class="lbl" x="227" y="86" text-anchor="middle">Signature database</text>
  <text class="mono" x="227" y="104" text-anchor="middle">5d41402a… known</text>
  <text class="mono" x="227" y="120" text-anchor="middle">7d793037… known</text>
  <text class="mono" x="227" y="136" text-anchor="middle">a9f0e61a… known</text>

  <!-- lane 1: known malware, blocked -->
  <rect class="box" x="28" y="188" width="104" height="34" rx="3"/>
  <text class="mono" x="80" y="209" text-anchor="middle">known.exe</text>
  <line x1="134" y1="205" x2="196" y2="205" stroke="#3F3F46" stroke-width="1.4" marker-end="url(#ar)"/>
  <text class="sm" x="165" y="197" text-anchor="middle">hash</text>
  <circle cx="216" cy="205" r="15" fill="#FEF2F2" stroke="#9B1C1C" stroke-width="1.4"/>
  <path d="M209,198 L223,212 M223,198 L209,212" stroke="#9B1C1C" stroke-width="2"/>
  <text class="bad" x="248" y="209">BLOCKED — fingerprint on file</text>

  <!-- lane 2: zero-day, passes -->
  <rect class="box" x="28" y="286" width="104" height="34" rx="3"/>
  <text class="mono" x="80" y="307" text-anchor="middle">zeroday.exe</text>
  <line x1="134" y1="303" x2="196" y2="303" stroke="#3F3F46" stroke-width="1.4" marker-end="url(#ar)"/>
  <text class="sm" x="165" y="295" text-anchor="middle">hash</text>
  <circle cx="216" cy="303" r="15" fill="#F0FDF4" stroke="#71717A" stroke-width="1.2" stroke-dasharray="3 2"/>
  <text class="sm" x="216" y="307" text-anchor="middle">?</text>
  <line x1="234" y1="303" x2="408" y2="303" stroke="#9B1C1C" stroke-width="1.6" marker-end="url(#arRed)"/>
  <text class="bad" x="321" y="295" text-anchor="middle">no match → ALLOWED</text>
  <text class="sm" x="28" y="352">A signature cannot exist for malware nobody has analysed yet, so a</text>
  <text class="sm" x="28" y="368">zero-day passes a perfectly functioning scanner. This is a structural</text>
  <text class="sm" x="28" y="384">limit of the method, not a tuning problem.</text>

  <!-- ============================ PANEL B ============================ -->
  <rect class="panel" x="472" y="8" width="440" height="392" rx="4"/>
  <text class="ttl" x="492" y="34">B. Anomaly-based detection (Isolation Forest)</text>
  <text class="sm"  x="492" y="52">Splits data at random. Outliers need fewer splits to isolate.</text>

  <!-- tree edges -->
  <g stroke="#71717A" stroke-width="1.3" fill="none">
    <path d="M692,86 L604,132"/>
    <path d="M692,86 L806,132"/>
    <path d="M604,132 L556,186"/>
    <path d="M604,132 L652,186"/>
    <path d="M652,186 L616,240"/>
    <path d="M652,186 L692,240"/>
    <path d="M692,240 L668,292"/>
    <path d="M692,240 L716,292"/>
  </g>

  <!-- nodes -->
  <g fill="#FAF9F6" stroke="#71717A" stroke-width="1.2">
    <circle cx="692" cy="86" r="13"/>
    <circle cx="604" cy="132" r="11"/>
    <circle cx="556" cy="186" r="10"/>
    <circle cx="652" cy="186" r="10"/>
    <circle cx="616" cy="240" r="10"/>
    <circle cx="692" cy="240" r="10"/>
    <circle cx="668" cy="292" r="10"/>
  </g>
  <text class="sm" x="692" y="90" text-anchor="middle">root</text>

  <!-- ransomware: isolated at depth 1 -->
  <circle cx="806" cy="132" r="15" fill="#FEF2F2" stroke="#9B1C1C" stroke-width="2"/>
  <text class="bad" x="806" y="166" text-anchor="middle">ransomware.exe</text>
  <text class="sm"  x="806" y="182" text-anchor="middle">isolated after 1 split</text>

  <!-- normal process leaf -->
  <circle cx="716" cy="292" r="11" fill="#F0FDF4" stroke="#166534" stroke-width="1.6"/>
  <text class="good" x="600" y="330">normal process — 4 splits to isolate</text>
  <line x1="716" y1="303" x2="700" y2="322" stroke="#166534" stroke-width="1.2"/>

  <text class="lbl" x="492" y="360">Short path → high anomaly score → automated containment.</text>
  <text class="sm"  x="492" y="378">Score ≈ 0.5 is indistinguishable from normal; &gt; 0.7 triggers investigation,</text>
  <text class="sm"  x="492" y="392">&gt; 0.9 triggers automated isolation.</text>

  <!-- ============================ TIMELINE ============================ -->
  <rect class="panel" x="8" y="416" width="904" height="196" rx="4"/>
  <text class="ttl" x="28" y="444">C. Why response has to be automated</text>
  <text class="sm"  x="28" y="462">Worm-propagating ransomware moves faster than a human analyst can read the first alert.</text>

  <line x1="60" y1="530" x2="860" y2="530" stroke="#3F3F46" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- t=0 -->
  <line x1="120" y1="522" x2="120" y2="538" stroke="#3F3F46" stroke-width="1.4"/>
  <text class="lbl" x="120" y="516" text-anchor="middle">t = 0 s</text>
  <text class="sm"  x="120" y="554" text-anchor="middle">patient zero</text>
  <text class="sm"  x="120" y="568" text-anchor="middle">begins encrypting</text>

  <!-- t=14 -->
  <line x1="470" y1="522" x2="470" y2="538" stroke="#3F3F46" stroke-width="1.4"/>
  <text class="lbl" x="470" y="516" text-anchor="middle">t = 14 s</text>
  <text class="sm"  x="470" y="554" text-anchor="middle">lateral movement reaches</text>
  <text class="sm"  x="470" y="568" text-anchor="middle">the file server</text>

  <!-- containment wall -->
  <line x1="640" y1="486" x2="640" y2="574" stroke="#800000" stroke-width="3"/>
  <text class="ttl" x="656" y="500">containment</text>
  <text class="sm"  x="656" y="516">host isolated automatically</text>
  <text class="sm"  x="656" y="556">Anything downstream of this line</text>
  <text class="sm"  x="656" y="570">is damage the model prevented.</text>

  <line x1="140" y1="530" x2="620" y2="530" stroke="#9B1C1C" stroke-width="4" opacity="0.28"/>
  <text class="bad" x="300" y="500">spread window — no human is in this loop</text>
  <line x1="296" y1="506" x2="260" y2="524" stroke="#9B1C1C" stroke-width="1.1" marker-end="url(#arRed)"/>
</svg>
