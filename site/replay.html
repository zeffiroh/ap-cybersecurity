<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="assets/config.js"></script>
<script src="assets/shared/neon.js"></script>
<script src="assets/shared/identity.js"></script>
<script src="assets/shared/paywall.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watch the recording · Aayat-AP-Prep</title>
<link rel="stylesheet" href="assets/vendor/xterm/xterm.css">
<style>*{box-sizing:border-box}body{margin:0;background:#0b0d10;color:#e6e6e6;font:15px/1.45 "Segoe UI",system-ui,sans-serif}header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 16px;background:#14171c;border-bottom:1px solid #2a2f37}h1{margin:0;font-size:18px}a{color:#ffd166}.main{display:grid;grid-template-columns:minmax(0,1fr) 300px;height:calc(100vh - 118px)}#term{background:#000;padding:6px;min-height:0;overflow:auto}aside{overflow:auto;border-left:1px solid #2a2f37;background:#101317;padding:10px}aside h2{margin:0 0 8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#a7afbb}aside button{display:block;width:100%;margin-bottom:6px;padding:7px 9px;text-align:left;background:#1e2229;color:#e6e6e6;border:1px solid #3a404a;font:inherit;cursor:pointer}aside button.on{border-color:#ffd166;color:#ffd166}footer{display:flex;gap:10px;align-items:center;padding:10px 16px;background:#14171c;border-top:1px solid #2a2f37}footer button,footer select{padding:6px 10px;background:#1e2229;color:#e6e6e6;border:1px solid #3a404a;font:inherit;cursor:pointer}footer input{flex:1;accent-color:#ffd166}#when{font-family:Consolas,monospace;min-width:92px;text-align:right}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #ffd166;outline-offset:1px}@media (max-width:800px){.main{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) 150px}aside{border-left:0;border-top:1px solid #2a2f37}}</style>
</head>
<body>
<header><h1 id="title">Loading the recording…</h1><a id="open" href="labs.html">Try it yourself</a></header>
<div class="main"><div id="term"></div><aside><h2>Steps</h2><div id="steps"></div></aside></div>
<footer>
  <button id="play">Play</button>
  <select id="speed" aria-label="Playback speed"><option value="1">1x</option><option value="1.5">1.5x</option><option value="2">2x</option><option value="4">4x</option></select>
  <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Position in the recording">
  <span id="when">0:00 / 0:00</span>
</footer>
<script src="assets/vendor/xterm/xterm.js"></script>
<script src="assets/theme/replay.js"></script>
</body>
</html>
