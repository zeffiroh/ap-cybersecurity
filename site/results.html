<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="assets/config.js"></script>
<script src="assets/shared/paywall.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saved results · Aayat-AP-Prep</title>
<link id="apnav-icon" rel="icon" href="assets/theme/icon.svg" type="image/svg+xml">
<link id="apnav-icon32" rel="icon" href="assets/theme/icon-32.png" sizes="32x32" type="image/png">
<link id="apnav-touch" rel="apple-touch-icon" href="assets/theme/apple-touch-icon.png">
<link id="apnav-css" rel="stylesheet" href="assets/theme/aayat.css">
<script id="apnav-map" src="assets/theme/course-map.js" defer></script>
<script id="apnav-js" src="assets/theme/aayat.js" defer></script>
<script id="apnav-progress" src="assets/theme/progress.js" defer></script>
<meta id="apnav-og-site" property="og:site_name" content="Aayat-AP-Prep · Cybersecurity">
<meta id="apnav-og-desc" property="og:description" content="The complete AP Cybersecurity course: textbook, lectures, practice, quizzes and a capstone. Free to use.">
<meta id="apnav-og-image" property="og:image" content="https://zeffiroh.github.io/ap-cybersecurity/assets/theme/share-banner.png">
<meta id="apnav-card" name="twitter:card" content="summary_large_image">
</head>
<body class="aa">
<main class="aa-main">
<h1>Saved results</h1>
<p class="aa-sub">Skill quizzes taken in this browser</p>
<p><button class="btn" onclick="exportCsv()">Export CSV</button>
<button class="btn" onclick="if(confirm('Clear all saved results?')){localStorage.removeItem('bb_results');render();}">Clear</button></p>
<table id="rtable"></table>
<script>var HEAD='<tr><th>Skill</th><th>Score</th><th>Max</th><th>%</th><th>Attempts</th><th>Last attempt</th></tr>';function results(){try{return JSON.parse(localStorage.getItem('bb_results')||'{}');}catch(e){return{};}}
function render(){var r=results(),t=document.getElementById('rtable');t.innerHTML=HEAD;Object.keys(r).sort().forEach(function(id){var e=r[id],pct=e.max?Math.round(100*e.score/e.max):0;t.innerHTML+='<tr><td>'+id+'</td><td>'+e.score+'</td><td>'+e.max+'</td><td>'+pct+'%</td><td>'+e.attempts+'</td><td>'+new Date(e.last).toLocaleString()+'</td></tr>';});}
function exportCsv(){var r=results(),rows=['atom,score,max,pct,attempts,last'];Object.keys(r).sort().forEach(function(id){var e=r[id],pct=e.max?Math.round(100*e.score/e.max):0;rows.push([id,e.score,e.max,pct,e.attempts,new Date(e.last).toISOString()].join(','));});var link=document.createElement('a');link.href=URL.createObjectURL(new Blob([rows.join('\n')],{type:'text/csv'}));link.download='quiz_results.csv';link.click();}
render();</script>
</main>
</body>
</html>
