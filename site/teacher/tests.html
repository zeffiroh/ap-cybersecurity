<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="../assets/config.js"></script>
<script src="../assets/shared/paywall.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AP Cyber, Tutor Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;font-family:'Times New Roman',Times,serif;background:#fff;color:#000;font-size:14px;overflow:hidden}.shell{position:fixed;inset:0;display:flex;flex-direction:column}.hd{background:#8B0000;color:#fff;display:flex;align-items:center;gap:10px;padding:5px 16px;flex-shrink:0}.hd img{height:26px;object-fit:contain}.hd h1{font-size:13px;font-weight:bold;flex:1}.hd .meta{font-size:11px;opacity:.8}.toolbar{background:#fafafa;border-bottom:1px solid #e0e0e0;padding:6px 14px;display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:wrap}.toolbar input,.toolbar select{padding:4px 8px;border:1px solid #ccc;font-family:'Times New Roman',serif;font-size:12px;outline:none}.toolbar input:focus,.toolbar select:focus{border-color:#8B0000}.toolbar input{width:200px}.btn{font-family:'Times New Roman',serif;font-size:12px;padding:4px 14px;cursor:pointer;border:1px solid}.btn-p{background:#8B0000;color:#fff;border-color:#600000}.btn-p:hover{background:#a00000}.btn-o{background:#fff;color:#000;border-color:#999}.btn-o:hover{border-color:#8B0000;color:#8B0000}.body{flex:1;overflow:hidden;display:flex}.list-panel{width:300px;flex-shrink:0;border-right:1px solid #e0e0e0;display:flex;flex-direction:column;overflow:hidden}.list-hd{background:#f5f0f0;border-bottom:1px solid #d8c8c8;padding:5px 10px;font-size:11px;font-weight:bold;color:#8B0000;text-transform:uppercase;letter-spacing:.03em}.list-scroll{flex:1;overflow-y:auto}.sess-item{padding:7px 12px;border-bottom:1px solid #f0e8e8;cursor:pointer}.sess-item:hover{background:#fff8f8}.sess-item.active{background:#fff0f0;border-left:3px solid #8B0000}.sess-name{font-size:12px;font-weight:bold}.sess-meta{font-size:10.5px;color:#666;margin-top:1px}.badge{display:inline-block;font-size:10px;padding:1px 5px;background:#f5f0f0;border:1px solid #d8c8c8;color:#8B0000;margin-left:4px}.detail{flex:1;overflow-y:auto;padding:14px;background:#fff}.empty{display:flex;align-items:center;justify-content:center;height:100%;color:#bbb;font-size:13px;font-style:italic}.ribbon{background:#8B0000;color:#fff;padding:3px 10px;font-size:11px;font-weight:bold;letter-spacing:.04em;margin-bottom:8px;text-transform:uppercase}.section{margin-bottom:16px}.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}.stat-card{text-align:center;padding:8px 4px;border:1px solid #e8e8e8}.stat-val{font-size:20px;font-weight:bold;color:#8B0000}.stat-lbl{font-size:10px;color:#888;margin-top:1px}.sk-row{display:flex;align-items:center;gap:6px;margin-bottom:4px}.sk-name{font-size:11px;width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sk-bar{flex:1;height:6px;background:#f0e8e8}.sk-fill{height:100%;background:#8B0000}.sk-val{font-family:'Courier New',monospace;font-size:10px;width:36px;text-align:right;color:#666}.sk-lv{font-size:10px;width:66px;text-align:center;border:1px solid #ddd;padding:1px 3px;font-weight:bold}.chart-wrap{height:140px;margin-top:8px}.tbl{width:100%;border-collapse:collapse;font-size:11.5px}.tbl th{background:#f5f0f0;border:1px solid #d8c8c8;padding:3px 7px;text-align:left;font-size:11px;color:#8B0000;font-weight:bold}.tbl td{border:1px solid #e8e8e8;padding:3px 7px;vertical-align:top}.tbl tr:nth-child(even) td{background:#fafafa}.green{color:#1a6b1a}.red{color:#8B0000}.reco{padding:4px 10px;margin-bottom:3px;font-size:12px;background:#fafafa;border-left:3px solid #8B0000}.statusbar{flex-shrink:0;background:#fafafa;border-top:1px solid #e0e0e0;padding:2px 14px;font-size:10.5px;color:#777;display:flex;justify-content:space-between}::-webkit-scrollbar{width:7px}::-webkit-scrollbar-track{background:#f8f8f8}::-webkit-scrollbar-thumb{background:#d8c8c8}::-webkit-scrollbar-thumb:hover{background:#8B0000}.hw-badge{font-size:10px;padding:1px 6px;background:#e8f0ff;border:1px solid #b8c8e8;color:#1a3a8b;margin-left:4px}</style>
</head>
<body>
<div class="shell">
<div class="hd">
  <img src="../tests/logo.png" onerror="this.style.display='none'">
  <h1>AP Cybersecurity, Tutor Dashboard</h1>
  <span class="meta" id="hd-meta">Loading…</span>
</div>
<div class="toolbar">
  <button class="btn btn-p" onclick="loadSessions()">↻ Refresh</button>
  <input id="search" type="text" placeholder="Filter by name, email, unit…" oninput="filterSessions()">
  <select id="unit-filter" onchange="filterSessions()">
    <option value="">All Units</option>
    <option>U1</option><option>U2</option><option>U3</option><option>U4</option><option>U5</option>
  </select>
  <select id="type-filter" onchange="filterSessions()">
    <option value="">All Types</option>
    <option value="adaptive">Adaptive</option>
    <option value="hw">CW/HW</option>
  </select>
  <div style="flex:1"></div>
  <button class="btn btn-o" onclick="showClassView()">Class Overview</button>
  <button class="btn btn-o" onclick="exportCSV()">Export CSV</button>
</div>
<div class="body">
  <div class="list-panel">
    <div class="list-hd">Sessions (<span id="sess-count">0</span>)</div>
    <div class="list-scroll" id="sess-list">
      <div style="padding:14px;font-size:12px;color:#aaa;font-style:italic">Click Refresh to load sessions.</div>
    </div>
  </div>
  <div class="detail" id="detail">
    <div class="empty">Select a session to view details.</div>
  </div>
</div>
<div class="statusbar">
  <span id="status">Ready.</span>
  <span style="color:#aaa;font-size:10px">© mitali120501@gmail.com · AP Cybersecurity Adaptive Engine</span>
</div>
</div>
<script src="../assets/config.js"></script>
<script src="../assets/shared/neon.js"></script>
<script src="../tests/engine.js"></script>
<script>const SKILL_NAMES={"1.A":"Identify Concepts","1.B":"Identify Adversaries","1.C":"Explain Mechanisms","1.D":"Determine/Document","2.A":"Apply Controls","3.A":"Evaluate Posture","3.B":"Analyze Incidents"};const SKILL_COLOR={"1.A":"#8B0000","1.B":"#A02020","1.C":"#B83030","1.D":"#CC4040","2.A":"#6B3090","3.A":"#1A5C8B","3.B":"#1A6B4A"};let ALL=[],CHART=null;async function loadSessions(){setStatus('Loading…');try{const got=await Engine.listSessions();ALL=got.sessions;renderList(ALL);document.getElementById('hd-meta').textContent=`${ALL.length} sessions`;setStatus(got.source==='neon'?`Loaded ${ALL.length} sessions from the class database.`:`Loaded ${ALL.length} sessions saved in THIS browser only (the class database is not configured or unreachable).`);}catch(e){setStatus('Error: '+e.message);}}
function renderList(sessions){document.getElementById('sess-count').textContent=sessions.length;const el=document.getElementById('sess-list');if(!sessions.length){el.innerHTML='<div style="padding:14px;font-size:12px;color:#aaa;font-style:italic">No sessions found.</div>';return;}
el.innerHTML=sessions.map(s=>{const i=ALL.indexOf(s);const hw=s.session_type==='hw';const acc=s.accuracy_pct!==undefined?`${s.accuracy_pct}%`:'—';const ts=s.timestamp?new Date(s.timestamp).toLocaleDateString():'';return`<div class="sess-item" onclick="selectSession(${i})" id="si-${i}">
      <div class="sess-name">${esc(s.name||'—')}<span class="badge">${s.unit||'—'}</span>${hw?`<span class="hw-badge">HW</span>`:''}</div>
      <div class="sess-meta">${esc(s.email||'')} · ${ts}</div>
      <div class="sess-meta">${s.n_answered||0} items · ${acc} accuracy${s.overall?`·<b style="color:${s.overall.level_color}">${s.overall.level}</b>`:''}</div>
    </div>`;}).join('');}
function filterSessions(){const q=document.getElementById('search').value.toLowerCase();const u=document.getElementById('unit-filter').value;const t=document.getElementById('type-filter').value;const filtered=ALL.filter(s=>{const txt=(s.name||'')+(s.email||'')+(s.unit||'');if(q&&!txt.toLowerCase().includes(q))return false;if(u&&s.unit!==u)return false;if(t&&s.session_type!==t)return false;return true;});renderList(filtered);}
function selectSession(idx){document.querySelectorAll('.sess-item').forEach(el=>el.classList.remove('active'));const el=document.getElementById(`si-${idx}`);if(el){el.classList.add('active');}
if(CHART){CHART.destroy();CHART=null;}
renderDetail(ALL[idx]);}
function renderDetail(s){const acc=s.accuracy_pct??0;const ac=acc>=75?'#1a6b1a':acc>=50?'#8B6914':'#8B0000';const sp=s.skill_profile||{};const hw=s.session_type==='hw';let h=`<h2 style="font-size:14px;margin-bottom:3px">${esc(s.name||'—')}</h2>
  <p style="font-size:11.5px;color:#666;margin-bottom:10px">${esc(s.email||'')} · ${s.unit||'—'}${hw?' · <b style="color:#1a3a8b">CW/HW Quiz</b>':' · <b style="color:#8B0000">Adaptive</b>'} · ${s.timestamp?new Date(s.timestamp).toLocaleString():''}</p>
  <div class="stat-grid">
    <div class="stat-card"><div class="stat-val">${s.n_answered||0}</div><div class="stat-lbl">Items</div></div>
    <div class="stat-card"><div class="stat-val" style="color:${ac}">${acc}%</div><div class="stat-lbl">Accuracy</div></div>
    <div class="stat-card"><div class="stat-val">${fmtTime(s.elapsed_sec)}</div><div class="stat-lbl">Time</div></div>
    <div class="stat-card"><div class="stat-val">${s.n_answered?Math.round((s.elapsed_sec||0)/s.n_answered)+'s':'—'}</div><div class="stat-lbl">Avg/Item</div></div>
  </div>`;if(s.overall){const o=s.overall;h+=`<div class="section"><div class="ribbon">Overall Result</div>
      <p style="font-size:13px;margin:6px 0"><b style="color:${o.level_color}">${o.level}</b> · θ = ${o.theta.toFixed(2)} ± ${o.se.toFixed(2)} ·
      ${s.done?(o.meets_gate?'<span class="green">meets the unit gate</span>':'<span class="red">below the unit gate, book tutoring</span>'):'in progress'}</p></div>`;}
if(Object.keys(sp).length){h+=`<div class="section"><div class="ribbon">Skill Profile (θ)</div>`;for(const[sk,d]of Object.entries(sp)){const pct=Math.max(0,Math.min(100,Math.round((d.theta+4)/8*100)));const col=SKILL_COLOR[sk]||'#8B0000';h+=`<div class="sk-row">
        <span class="sk-name" title="${d.name||SKILL_NAMES[sk]||sk}">${d.name||SKILL_NAMES[sk]||sk}</span>
        <div class="sk-bar"><div class="sk-fill" style="width:${pct}%;background:${col}"></div></div>
        <span class="sk-val">${(d.theta||0).toFixed(2)}</span>
        <span class="sk-lv" style="color:${col}">${d.level||'—'}</span>
        <span style="font-size:10px;color:#1a6b1a;width:12px">${d.mastered?'✓':''}</span>
      </div>`;}
h+=`<div class="chart-wrap"><canvas id="det-chart"></canvas></div></div>`;}
const resp=s.responses||[];if(resp.length){h+=`<div class="section"><div class="ribbon">Response Log</div>
    <table class="tbl"><thead><tr><th>#</th><th>Q ID</th><th>Skill/Topic</th><th>Answer</th><th>Correct</th><th>Time</th></tr></thead><tbody>`;resp.forEach((r,i)=>{h+=`<tr><td style="color:#999">${i+1}</td>
        <td style="font-family:'Courier New',monospace;font-size:10.5px">${r.question_id||'—'}</td>
        <td style="font-weight:bold;font-size:10.5px;color:${SKILL_COLOR[r.skill]||'#8B0000'}">${r.skill||r.topic||'—'}</td>
        <td style="font-weight:bold">${r.answer||'—'}</td>
        <td>${r.correct?'<span class="green">✓</span>':'<span class="red">✗ '+esc(r.correct_answer||'')+'</span>'}</td>
        <td style="font-family:'Courier New',monospace;font-size:10.5px">${r.time_taken||0}s</td></tr>`;});h+=`</tbody></table></div>`;}
if(s.recommendations&&s.recommendations.length){h+=`<div class="section"><div class="ribbon">Recommendations</div>`;s.recommendations.forEach(r=>{h+=`<div class="reco">${r}</div>`;});h+=`</div>`;}
document.getElementById('detail').innerHTML=h;if(Object.keys(sp).length){setTimeout(()=>{const ctx=document.getElementById('det-chart');if(!ctx)return;if(CHART)CHART.destroy();const entries=Object.entries(sp);CHART=new Chart(ctx,{type:'bar',data:{labels:entries.map(([k])=>k),datasets:[{label:'θ',data:entries.map(([,v])=>v.theta||0),backgroundColor:entries.map(([k])=>(SKILL_COLOR[k]||'#8B0000')+'88'),borderColor:entries.map(([k])=>SKILL_COLOR[k]||'#8B0000'),borderWidth:2}]},options:{responsive:true,maintainAspectRatio:false,scales:{y:{min:-2,max:2.5,grid:{color:'#f0e8e8'},ticks:{color:'#333',font:{family:'Times New Roman'}}},x:{grid:{display:false},ticks:{color:'#333',font:{family:'Times New Roman'}}}},plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>`θ = ${c.raw.toFixed(3)}`}}}}});},60);}}
function showClassView(){if(!ALL.length){alert('Load sessions first.');return;}
if(CHART){CHART.destroy();CHART=null;}
const byUnit={};ALL.forEach(s=>{const u=s.unit||'?';(byUnit[u]=byUnit[u]||[]).push(s);});let h=`<h2 style="font-size:14px;margin-bottom:12px">Class Overview, ${ALL.length} sessions</h2>
  <div class="section"><div class="ribbon">Summary by Unit</div>
  <table class="tbl"><thead><tr><th>Unit</th><th>Sessions</th><th>Avg Accuracy</th><th>Avg Items</th><th>HW Quizzes</th></tr></thead><tbody>`;for(const[u,sess]of Object.entries(byUnit)){const avgAcc=Math.round(sess.reduce((a,s)=>a+(s.accuracy_pct||0),0)/sess.length);const avgItems=Math.round(sess.reduce((a,s)=>a+(s.n_answered||0),0)/sess.length);const hwCount=sess.filter(s=>s.session_type==='hw').length;const col=avgAcc>=75?'#1a6b1a':avgAcc>=50?'#8B6914':'#8B0000';h+=`<tr><td><b>${u}</b></td><td>${sess.length}</td><td style="color:${col};font-weight:bold">${avgAcc}%</td><td>${avgItems}</td><td>${hwCount}</td></tr>`;}
h+=`</tbody></table></div>
  <div class="section"><div class="ribbon">All Students</div>
  <table class="tbl"><thead><tr><th>Name</th><th>Email</th><th>Unit</th><th>Type</th><th>Items</th><th>Accuracy</th><th>Date</th></tr></thead><tbody>`;ALL.forEach((s,i)=>{const acc=s.accuracy_pct??'—';const col=typeof acc==='number'?(acc>=75?'#1a6b1a':acc>=50?'#8B6914':'#8B0000'):'#000';const hw=s.session_type==='hw';h+=`<tr style="cursor:pointer" onclick="selectSessionByIdx(${i})">
      <td style="color:#8B0000;text-decoration:underline">${esc(s.name||'—')}</td>
      <td>${esc(s.email||'—')}</td><td>${s.unit||'—'}</td>
      <td>${hw?'<span style="color:#1a3a8b">HW</span>':'<span style="color:#8B0000">Adaptive</span>'}</td>
      <td>${s.n_answered||0}</td>
      <td style="font-weight:bold;color:${col}">${typeof acc==='number'?acc+'%':acc}</td>
      <td style="font-size:10.5px;color:#888">${s.timestamp?new Date(s.timestamp).toLocaleDateString():'—'}</td></tr>`;});h+=`</tbody></table></div>`;document.getElementById('detail').innerHTML=h;document.querySelectorAll('.sess-item').forEach(el=>el.classList.remove('active'));}
function selectSessionByIdx(i){document.querySelectorAll('.sess-item').forEach(el=>el.classList.remove('active'));const el=document.getElementById(`si-${i}`);if(el){el.classList.add('active');el.scrollIntoView({block:'nearest'});}
if(CHART){CHART.destroy();CHART=null;}
renderDetail(ALL[i]);}
function exportCSV(){if(!ALL.length){alert('No sessions to export.');return;}
const cols=['name','email','unit','session_type','n_answered','accuracy_pct','overall_theta','overall_level','meets_gate','elapsed_sec','timestamp'];const rows=[cols.join(',')];ALL.forEach(s=>{const o=s.overall||{};const row=Object.assign({},s,{overall_theta:o.theta??'',overall_level:o.level??'',meets_gate:s.overall?(o.meets_gate?'yes':'no'):''});rows.push(cols.map(c=>`"${(row[c]??'').toString().replace(/"/g,'""')}"`).join(','));});const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([rows.join('\n')],{type:'text/csv'}));a.download=`ap_cyber_sessions_${new Date().toISOString().slice(0,10)}.csv`;a.click();}
function fmtTime(sec){if(!sec)return'—';const m=Math.floor(sec/60),s=sec%60;return`${m}m${s}s`;}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function setStatus(msg){document.getElementById('status').textContent=msg;}
loadSessions();</script>
</body>
</html>
