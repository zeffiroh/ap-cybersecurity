apiVersion: apps/v1
kind: Deployment
metadata:
  name: mobile-api-staging
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mobile-api
  template:
    metadata:
      labels:
        app: mobile-api
    spec:
      hostNetwork: true
      containers:
        - name: api
          image: registry.paperplane.example/mobile-api:latest
          ports:
            - containerPort: 8080
          securityContext:
            privileged: true
          env:
            - name: STRATUS_SECRET
              value: stratus.secret.Lr4vT9wQ2nX8pZ6kD1yH5mB3
