apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart-api
  namespace: shop
spec:
  replicas: 3
  selector:
    matchLabels:
      app: cart-api
  template:
    metadata:
      labels:
        app: cart-api
    spec:
      containers:
        - name: cart-api
          image: registry.monsoon.example/cart-api:latest
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              value: orders-db.internal
            - name: DB_PASSWORD
              value: monsoon-db-password-2026
