stages: [test, build, deploy]

test:
  script:
    - npm ci
    - npm test

build:
  script:
    - docker build -t registry.monsoon.example/cart-api:latest .
    - docker push registry.monsoon.example/cart-api:latest

deploy:
  script:
    - stratus deploy service/cart-api --image registry.monsoon.example/cart-api:latest
  variables:
    STRATUS_KEY_ID: $CI_STRATUS_KEY_ID
    STRATUS_SECRET: $CI_STRATUS_SECRET
    GIT_TOKEN: ghp_7aQ2xR9mK4vL8pW3nT6yB1cD5eF0gH2jK4
