<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="../assets/config.js"></script>
<script src="../assets/shared/paywall.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pay What You Want · AP Cybersecurity</title>
<meta name="description" content="Support the AP Cybersecurity course: pay what you want, any way you like.">
<style>:root{--ink:#111;--muted:#444;--faint:#777;--line:#d4d4d4}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font-family:"Times New Roman",Times,Georgia,serif;line-height:1.5}main{max-width:480px;margin:0 auto;padding:40px 16px 56px}.mark{width:56px;height:56px;display:block;margin:0 auto 14px}h1{font-size:30px;margin:0 0 6px;text-align:center}.lede{color:var(--muted);font-size:16px;text-align:center;margin:0 0 26px}.methods{display:flex;flex-direction:column;gap:12px;margin-bottom:28px}.method{border:1px solid #000;padding:14px 16px}.method h2{font-size:17px;margin:0}.method p{margin:2px 0 0;font-size:14px;color:var(--muted)}.method img{display:block;width:220px;max-width:100%;margin:12px auto 4px;border:1px solid var(--line)}.method a{display:inline-block;margin-top:10px;font-weight:700;color:var(--ink)}.none{border:1px dashed var(--faint);padding:16px;color:var(--muted);text-align:center;margin-bottom:28px}.done{border-top:2px solid #000;padding-top:22px;text-align:center}.done p{color:var(--muted);font-size:14.5px;margin:0 0 14px}.btn{display:block;width:100%;padding:13px;font:inherit;font-size:14px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;background:#000;color:#fff;border:1px solid #000;cursor:pointer;text-decoration:none}.btn:hover{background:#333}.btn.light{background:#fff;color:var(--ink);margin-top:10px}.btn.light:hover{background:#f5f5f5}footer{margin-top:30px;font-size:13px;color:var(--faint);text-align:center}footer a{color:inherit}a:focus-visible,button:focus-visible{outline:3px solid #888;outline-offset:2px}[hidden]{display:none!important}</style>
</head>
<body>
<main>
  <img class="mark" src="../assets/theme/icon.svg" alt="">
  <h1 id="title">Pay what you want</h1>
  <p class="lede" id="lede"></p>

  <div class="methods" id="methods"></div>
  <p class="none" id="none" hidden>Payment options are being set up.</p>

  <section class="done">
    <p id="done-note">Once you've paid, press the button. Your course opens as soon as the payment is confirmed.</p>
    <a class="btn" id="paid" href="../unlock/?paid=1">I've paid</a>
    <a class="btn light" id="free" href="../unlock/?free=1" hidden>Continue without paying</a>
  </section>

  <footer id="footer"></footer>
</main>

<script>(function(){"use strict";var P=(window.APCYBER_PAYWALL||{}).pay||{};var S=window.APCYBER_SUPPORT||{};var q=new URLSearchParams(location.search);var donating=q.has("donate");var $=function(id){return document.getElementById(id);};var ret=new URL(donating?"../index.html":"../unlock/?paid=1",location.href).href;try{var r=new URL(q.get("return")||"",location.href);if(q.get("return")&&r.origin===location.origin)ret=r.href;}catch(e){}
var min=(P.minAmount||"").trim();if(donating){$("title").textContent="Support the course";$("lede").textContent="Any amount, any way you like. Thank you for keeping it going.";$("done-note").textContent="Thank you. When you're done, head back to where you were.";$("paid").textContent="Back to the course";}else{$("lede").textContent=(min?"From "+min+", any way you like.":"Any amount, any way you like.")+" It's a one-time payment: your account keeps the full course for good.";$("free").hidden=!!min;}
$("paid").href=ret;$("free").href=ret.replace(/([?&])paid=1\b/,"$1free=1");var shown=0;(P.methods||[]).forEach(function(m){if(!m.url&&!m.qr)return;shown++;var box=document.createElement("div");box.className="method";var h=document.createElement("h2");h.textContent=m.label;box.appendChild(h);if(m.note){var p=document.createElement("p");p.textContent=m.note;box.appendChild(p);}
if(m.qr){var img=document.createElement("img");img.src=m.qr;img.alt="QR code for "+m.label;box.appendChild(img);}
if(m.url){var a=document.createElement("a");a.href=m.url;a.target="_blank";a.rel="noopener";a.textContent="Pay with "+m.label+" →";box.appendChild(a);}
$("methods").appendChild(box);});$("none").hidden=shown>0;var who="";try{who=localStorage.getItem("apcyber_student_email")||"";}catch(e){}
if(shown&&!donating&&who){$("done-note").textContent="On the payment page, type "+who+" as your course email. Once you've paid, "+"press the button: your course opens as soon as the payment is confirmed.";}
if(!shown){$("none").hidden=true;$("done-note").hidden=true;if(donating){$("lede").textContent="Payment options are coming soon. Thank you for wanting to help!";}else{$("title").textContent="Free for now";$("lede").textContent="Payment options are coming soon. Until then the full course is free, "+"and your account keeps it for good.";$("paid").hidden=true;$("free").hidden=false;$("free").textContent="Unlock my course";$("free").className="btn";}}
if(S.contactEmail){$("footer").innerHTML='Questions? <a href="mailto:'+S.contactEmail+'">'+S.contactEmail+"</a>";}})();</script>
</body>
</html>
